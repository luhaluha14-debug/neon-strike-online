# Render blueprint for everything in this repo.  New → Blueprint on
# render.com, point it at this repo, and everything below is filled in for
# you.  Each service is independent: deploy one, some, or all of them.
#
#   sigilfall        the sorcery action FPS (game + room server, repo root)
#   dropzone         NEON STRIKE: DROPZONE (online battle royale server)
#   tactical-fps     the tactical FPS as a static single-player site
#   tactical-fps-mp  the same game plus its room relay (WebSocket /mp)
#
# The GRID account server (tactical-fps/server) is not deployed: sign-in is
# switched off for now.  The older neon_strike_online game keeps its own
# config in its folder.
#
# No service pins a branch, so Render follows the repo's default branch (main).

services:
  # Sorcery action FPS.  Lives at the repo root, so no rootDir: the root
  # package.json holds its dependencies (three, ws) and its start script.
  - type: web
    name: sigilfall
    runtime: node
    plan: free
    region: singapore          # closest free region to Korea; an FPS feels ping
    buildCommand: npm ci --omit=dev
    startCommand: node sigilfall/server/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"

  - type: web
    name: dropzone
    runtime: node
    plan: free
    rootDir: dropzone
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"

  # Tactical FPS prototype: plain static site built with Vite.
  - type: web
    name: tactical-fps
    runtime: static
    rootDir: tactical-fps
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /maps/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: "22"

  # Tactical FPS multiplayer: the game plus the room relay (WebSocket /mp) on one origin.
  # Rooms run in the host player's browser; the relay only manages rooms and forwards
  # messages, so the free plan is enough (it sleeps when idle: the first visit wakes it, ~1 min).
  - type: web
    name: tactical-fps-mp
    runtime: node
    plan: free
    rootDir: tactical-fps
    # NODE_ENV=production also applies to the build: keep the dev dependencies (vite, typescript) for it.
    buildCommand: npm ci --include=dev && npm run build && npm run build:mp
    startCommand: npm run start:mp
    healthCheckPath: /mp/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Pages of the static sites may connect too (once they are pointed at this relay).
      - key: GRID_MP_ORIGINS
        value: https://tactical-fps.onrender.com,https://tactical-fps-bmsr.onrender.com
