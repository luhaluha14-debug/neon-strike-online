# Render blueprint for NEON STRIKE: DROPZONE (online battle royale server).
# The older neon_strike_online game keeps its own config in its folder.
services:
  - type: web
    name: dropzone
    runtime: node
    plan: free
    rootDir: dropzone
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"

  # Tactical FPS prototype: plain static site built with Vite.
  - type: web
    name: tactical-fps
    runtime: static
    rootDir: tactical-fps
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /maps/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: "22"
