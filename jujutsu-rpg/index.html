    return list.sort((a, b) => {
      const oa = GameState.owns(a.id) ? 0 : 1, ob = GameState.owns(b.id) ? 0 : 1;
      if (oa !== ob) return oa - ob;
      if (a.rarity !== b.rarity) return b.rarity - a.rarity;
      return a.name.localeCompare(b.name, 'ko');
    });
  }
  function filterBar(elId, active, onPick) {
    const wrap = document.getElementById(elId); if (!wrap) return;
    wrap.innerHTML = FILTERS.map(f => '<button class="chip' + (f.id === active ? ' on' : '') + '" data-f="' + f.id + '">' + f.label + '</button>').join('');
    $$('.chip', wrap).forEach(c => onTap(c, () => { AudioSystem.sfx('click'); onPick(c.dataset.f); }));
  }

  /* ---------- HOME ---------- */
  RENDER.home = function () {
    const hero = $('#home-hero'); if (!hero) return;
    const party = GameState.party();
    const id = party[0] || GameState.ownedIds()[0] || 'yuji_s';
    const def = DB.byId(id) || DB.CHARS[0];
    const nextStage = DB.STAGES.find(s2 => !GameState.stageCleared(s2.id)) || DB.STAGES[DB.STAGES.length - 1];
    const doneCount = DB.STAGES.filter(s2 => GameState.stageCleared(s2.id)).length;
    hero.innerHTML =
      '<button class="home-next" id="home-next"><span class="hn-ic">📍</span><span class="hn-b">' +

      '<span class="hn-s">진행 ' + doneCount + '/' + DB.STAGES.length + ' · 보유 주술사 ' +

      '<div class="hero-char">' + Art.portrait(def, { bare: true }) + '</div>' +
      '<div class="hero-info"><div class="hv">' + esc(def.version) + '</div>' +
      '<div class="hn">' + esc(def.name) + '</div>' +
      '<div class="hd">' + esc(def.desc || '') + '</div></div>';
    const menu = $('#home-menu');
    const items = [
      { id: 'storylist', ic: '📖', label: '스토리' },
      { id: 'stage', ic: '⚔', label: '전투', hi: true },
      { id: 'chars', ic: '👥', label: '캐릭터' },
      { id: 'party', ic: '🎌', label: '부대' },

  RENDER.stage = function () {

        '<span class="si-d">' + esc(s.desc) + '</span></span>' +
        '<span class="si-r">' + (unlocked ? (cleared ? '<span class="clear-mark">CLEAR</span>' : 'Lv.' + s.lv) : '🔒') + '</span></button>';
    }).join('');

        '<br>부대: ' + party + '</div>',
      actions: [
        { label: '부대 편성', cls: 'ghost', fn: () => nav('party') },
        { label: '출격', cls: 'primary', fn: () => StageSystem.enter(id) },

  /* ---------- CHARACTERS ---------- */
  RENDER.chars = function () {
    filterBar('chars-filter', charFilter, f => { charFilter = f; RENDER.chars(); });
    const grid = $('#chars-grid'); if (!grid) return;

    bindCards('#chars-grid', id => { detailId = id; detailFrom = 'chars'; nav('detail'); });

    if (cnt) cnt.textContent = GameState.ownedIds().length + ' / ' + DB.CHARS.length;

  /* ---------- CHARACTER DETAIL ---------- */
  RENDER.detail = function () {
    const body = $('#detail-body'); if (!body || !detailId) return;
    const def = DB.byId(detailId);
    if (!def) { nav('chars'); return; }
    const cs = GameState.charState(detailId);

    const st = CharacterSystem.stats(detailId, cs || { lv: 1, asc: 0, sklv: [1, 1, 1, 1] });

      '<div class="dn">' + esc(def.name) + '</div>' +
      '<div class="tags"><span class="tag" style="color:' + (el.color || '#fff') + '">' + (el.icon || '') + ' ' + (el.name || '') + '</span>' +

    def.skills.forEach((s, i) => {

        '<div class="skill-meta"><div class="sn">' + esc(s.name) +

        '<div class="sd">' + esc(s.desc) + '</div>' +
        (owned ? '<button class="btn sm ghost" data-sk="' + i + '" style="margin-top:7px">강화 (재료 ' + cost.mat + ' · 골드 ' + fmt(cost.gold) + ')</button>' : '') +

    const ucost = CharacterSystem.skillUpCost(ulv);
    h += '<div class="skill-row"><div class="skill-ic ult">' + esc(u.icon || '★') + '</div>' +

      '<div class="sd">' + esc(u.desc) + '</div>' +

      '</div></div>';
    h += '<div class="skill-row"><div class="skill-ic psv">◈</div><div class="skill-meta">' +
      '<div class="sn">' + esc(def.passive.name) + '<span class="cost-pip">패시브</span></div>' +

    }
  };
  const statBox = (l, v) => '<div class="stat-box"><div class="sl">' + l + '</div><div class="sv">' + v + '</div></div>';

  /* ---------- PARTY ---------- */
  RENDER.party = function () {
    const slots = $('#party-slots'); if (!slots) return;
    const p = GameState.party();
    let h = '';
    for (let i = 0; i < 4; i++) {
      const id = p[i];
      if (id) {
        const def = DB.byId(id), cs = GameState.charState(id), stt = CharacterSystem.stats(id, cs);
        h += '<div class="party-slot filled rar-' + def.rarity + '" data-slot="' + i + '">' +
          '<button class="ps-x" data-rm="' + id + '" aria-label="제외">×</button>' +
          '<span class="cc-rar" style="position:absolute;top:4px;left:4px;z-index:2">' + def.rarity + '★</span>' +
          '<span class="portrait" style="border-radius:0">' + Art.portrait(def) + '</span>' +
          '<span style="padding:5px 6px;min-width:0">' +
          '<span class="cc-name" style="display:block;font-size:calc(11.5px * var(--fs));font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(def.name) + '</span>' +
          '<span class="ps-line muted">Lv.' + stt.lv + ' · HP ' + fmt(stt.hp) + '</span>' +
          '<span class="ps-line" style="color:var(--gold)">ATK ' + fmt(stt.atk) + '</span>' +
          '<span class="ps-line muted">' + esc((DB.ROLES[def.role] || {}).name || '') + ' · ' +
          esc((DB.ELEMENTS[def.el] || {}).name || '') + '</span></span></div>';
      } else {
        h += '<div class="party-slot" data-slot="' + i + '"><span class="ps-empty">+ 빈 자리</span></div>';
      }
    }
    slots.innerHTML = h;
    $$('.party-slot', slots).forEach(s => onTap(s, () => {
      const i = parseInt(s.dataset.slot, 10);
      if (partyPending) {
        GameState.replaceParty(i, partyPending);
        partyPending = null; AudioSystem.sfx('click'); toast('교체 완료', 'good'); RENDER.party();
      }
    }));
    $$('[data-rm]', slots).forEach(b => onTap(b, e => {
      e.stopPropagation && e.stopPropagation();
      const r = GameState.toggleParty(b.dataset.rm);
      if (!r.ok) { AudioSystem.sfx('error'); toast(r.msg, 'bad'); return; }
      AudioSystem.sfx('back'); RENDER.party();
    }));

    const stat = $('#party-stat');
    if (stat) {
      let hp = 0, atk = 0, pw = 0;
      p.forEach(id => { const s = CharacterSystem.stats(id); hp += s.hp; atk += s.atk; pw += CharacterSystem.power(id); });
      stat.innerHTML = '<span class="tag">부대 전투력 ' + fmt(pw) + '</span><span class="tag">총 HP ' + fmt(hp) + '</span>' +
        '<span class="tag">총 공격력 ' + fmt(atk) + '</span>' +
        (partyPending ? '<span class="tag" style="color:var(--gold)">교체할 자리를 선택하세요</span>' : '');
    }
    const cnt = $('#party-count'); if (cnt) cnt.textContent = p.length + ' / 4';
    filterBar('party-filter', partyFilter, f => { partyFilter = f; RENDER.party(); });
    const grid = $('#party-grid'); if (!grid) return;
    const list = filterChars(partyFilter, true);
    grid.innerHTML = list.length ? list.map(c => charCard(c.id, { sel: GameState.inParty(c.id) })).join('')
      : '<div class="empty-note">보유한 캐릭터가 없습니다. 소환에서 주술사를 영입하세요.</div>';
    bindCards('#party-grid', id => {
      if (GameState.inParty(id)) {
        const r = GameState.toggleParty(id);
        if (!r.ok) { toast(r.msg, 'bad'); return; }
        toast('부대에서 제외했습니다'); RENDER.party(); return;
      }
      const r = GameState.toggleParty(id);
      if (!r.ok) {
        if (r.full) { partyPending = id; toast('교체할 자리를 선택하세요'); RENDER.party(); }
        else toast(r.msg, 'bad');
        return;
      }
      toast('부대에 편성했습니다', 'good'); RENDER.party();
    });
  };

  /* ---------- GACHA ---------- */
  RENDER.gacha = function () {
    const pk = DB.byId(DB.GACHA.pickup) || DB.CHARS[0];
    const banner = $('#gacha-banner');
    if (banner) {
      banner.innerHTML = '<span class="gb-tag">PICK UP</span>' +
        '<div class="gb-art portrait rar-5">' + Art.portrait(pk) + '</div>' +
        '<div class="gb-name">' + esc(pk.name) + ' 「' + esc(pk.version) + '」</div>';
    }
    const info = GachaSystem.pityInfo();
    const pf = $('#pity-fill'), pt = $('#pity-text'), gr = $('#gacha-rate');
    if (pf) pf.style.width = (info.pity / info.max * 100) + '%';
    if (pt) pt.textContent = info.pity + ' / ' + info.max;
    if (gr) gr.innerHTML = '5★ 확률 ' + Util.round(info.rate * 100, 2) + '% · 누적 ' + info.total + '회' +
      (info.lost ? ' · <b style="color:var(--gold)">다음 5★는 픽업 확정</b>' : '') +
      '<br>중복 시 성흔 조각과 회주로 전환됩니다.';
    const b1 = $('#btn-pull1'), b10 = $('#btn-pull10');
    if (b1 && !b1.dataset.bound) { b1.dataset.bound = '1'; onTap(b1, () => doPull(1)); }
    if (b10 && !b10.dataset.bound) { b10.dataset.bound = '1'; onTap(b10, () => doPull(10)); }
    if (b1) b1.disabled = !GameState.canPay({ jade: DB.GACHA.cost1 });
    if (b10) b10.disabled = !GameState.canPay({ jade: DB.GACHA.cost10 });
  };
  let pulling = false;
  async function doPull(n) {
    if (pulling) return;
    const cost = n >= 10 ? DB.GACHA.cost10 : DB.GACHA.cost1;
    if (!GameState.canPay({ jade: cost })) { AudioSystem.sfx('error'); toast('회주가 부족합니다', 'bad'); return; }
    pulling = true;
    AudioSystem.sfx('gacha');
    const r = GachaSystem.pull(n);
    if (!r.ok) { pulling = false; toast(r.msg, 'bad'); return; }
    const best = r.results.reduce((m, x) => Math.max(m, x.rarity), 3);
    const box = $('#gacha-anim'), inner = $('#gacha-anim-inner');
    inner.innerHTML = '<div class="pull-core' + (best === 5 ? ' gold' : '') + '"></div>' +
      '<div class="pull-text">' + (best === 5 ? '강대한 주력…' : '주력이 모인다…') + '</div>';
    box.classList.add('on');
    await sleep(best === 5 ? 1500 : 1000);
    if (best === 5) AudioSystem.sfx('rare');
    let h = '<div class="result-grid">';
    r.results.forEach((x, i) => {
      const def = DB.byId(x.id);
      h += '<div class="char-card result-card rar-' + def.rarity + '" style="animation-delay:' + (i * 70) + 'ms">' +
        '<span class="cc-port"><span class="portrait">' + Art.portrait(def) + '</span>' +
        '<span class="cc-rar">' + def.rarity + '★</span>' +
        (x.dup ? '<span class="res-dup">조각 +' + x.shard + '</span>' : '<span class="res-new">NEW</span>') +
        '</span><span class="cc-meta"><span class="cc-name">' + esc(def.name) + '</span>' +
        '<span class="cc-ver">' + esc(def.version) + '</span></span></div>';
    });
    h += '</div><div style="display:flex;gap:9px;padding:10px 12px;flex-wrap:wrap;justify-content:center">' +
      '<button class="btn ghost" id="pull-close">닫기</button>' +
      '<button class="btn primary" id="pull-again">다시 소환</button></div>';
    inner.innerHTML = h;
    onTap($('#pull-close'), () => { AudioSystem.sfx('back'); box.classList.remove('on'); inner.innerHTML = ''; RENDER.gacha(); refreshCurrency(); });
    onTap($('#pull-again'), () => {
      AudioSystem.sfx('click'); box.classList.remove('on'); inner.innerHTML = '';
      RENDER.gacha(); refreshCurrency();
      setTimeout(() => doPull(n), 120);
    });
    pulling = false;
    refreshCurrency();
  }

  /* ---------- SHOP ---------- */
  RENDER.shop = function () {
    const grid = $('#shop-grid'); if (!grid) return;
    grid.innerHTML = DB.SHOP.map(it => {
      const costTxt = Object.keys(it.cost).map(k => ({ gold: '골드', jade: '회주', mat: '재료' }[k] || k) + ' ' + fmt(it.cost[k])).join(' · ');
      return '<div class="shop-item"><div class="sh-ic">' + it.icon + '</div>' +
        '<div class="sh-n">' + esc(it.name) + '</div>' +
        '<div class="tiny muted">' + esc(it.desc) + '</div>' +
        '<button class="btn sm ' + (GameState.canPay(it.cost) ? 'primary' : '') + '" data-buy="' + it.id + '"' +
        (GameState.canPay(it.cost) ? '' : ' disabled') + '>' + costTxt + '</button></div>';
    }).join('');
    $$('[data-buy]', grid).forEach(b => onTap(b, () => {
      const it = DB.SHOP.find(x => x.id === b.dataset.buy); if (!it) return;
      if (!GameState.pay(it.cost)) { AudioSystem.sfx('error'); toast('재화가 부족합니다', 'bad'); return; }
      if (it.give.shardRandom) {
        const owned = GameState.ownedIds();
        if (owned.length) {
          const id = Util.pick(owned);
          CharacterSystem.addShards(id, it.give.shardRandom);
          toast(DB.byId(id).name + ' 성흔 조각 +' + it.give.shardRandom, 'good');
        }
      } else {
        GameState.give(it.give);
        toast(it.name + ' 구매 완료', 'good');
      }
      AudioSystem.sfx('levelup');
      RENDER.shop(); refreshCurrency();
    }));
  };

  /* ---------- STORY ---------- */
  RENDER.storylist = function () {
    const list = $('#storylist'); if (!list) return;
    list.innerHTML = DB.STORY.map(s => {
      const unlocked = GameState.stageCleared(s.stage) || GameState.get().flags.story[s.id] || GameState.stageUnlocked(s.stage);
      return '<button class="stage-item' + (unlocked ? '' : ' locked') + '" data-id="' + s.id + '">' +
        '<span class="si-no">' + s.stage + '</span>' +
        '<span class="si-body"><span class="si-t">' + esc(s.title) + '</span>' +
        '<span class="si-d">' + (unlocked ? '대화 ' + s.lines.length + '개' : '임무를 진행하면 해금됩니다') + '</span></span>' +
        '<span class="si-r">' + (unlocked ? '▶' : '🔒') + '</span></button>';
    }).join('');
    $$('.stage-item', list).forEach(b => onTap(b, () => {
      const s = DB.STORY.find(x => x.id === b.dataset.id);
      if (!s || !GameState.stageUnlocked(s.stage)) { AudioSystem.sfx('error'); toast('아직 해금되지 않았습니다', 'bad'); return; }
      AudioSystem.sfx('click');
      playStory(s.id, () => nav('storylist'));
    }));
  };
  function playStory(id, onDone) {
    const scene = DB.STORY.find(s => s.id === id);
    if (!scene) { if (onDone) onDone(); return; }
    story = { scene, idx: 0, onDone: onDone || (() => nav('home')) };
    apply('story');
    Util.safe(() => history.pushState({ screen: 'story' }, ''), 'history');
    renderStoryLine();
  }
  function renderStoryLine() {
    if (!story) return;
    const s = story.scene, line = s.lines[story.idx];
    const t = $('#story-title'); if (t) t.textContent = s.title;
    if (!line) return endStory();
    const def = DB.byId(line.who) || DB.ENEMY_MAP[line.who];
    const stage = $('#story-stage');
    if (stage) stage.innerHTML = '<div class="story-char">' + (def ? Art.art(def, { bare: true }) : '') + '</div>';
    const nm = $('#story-name'), tx = $('#story-text'), ix = $('#story-idx');
    if (nm) nm.textContent = def ? def.name : '';
    if (tx) tx.textContent = line.text;
    if (ix) ix.textContent = (story.idx + 1) + ' / ' + s.lines.length;
  }
  function nextStoryLine() {
    if (!story) return;
    story.idx++;
    if (story.idx >= story.scene.lines.length) return endStory();
    AudioSystem.sfx('click');
    renderStoryLine();
  }
  function endStory() {
    if (!story) return;
    const cb = story.onDone, id = story.scene.id;
    GameState.get().flags.story[id] = true;
    GameState.persist(true);
    story = null;
    Util.safe(cb, 'story-done');
  }
  RENDER.story = function () { renderStoryLine(); };

  /* ---------- BATTLE 결과 / 메뉴 ---------- */
  RENDER.battle = function () { /* 전투 화면은 BattleUI가 담당 */ };
  RENDER.title = function () { };

  function showBattleResult(win, rew, levelUps, stageId) {
    const box = $('#result'); if (!box) return;
    const stage = DB.STAGE_MAP[stageId];
    let lines = '';
    if (win && rew) {
      const items = [
        ['경험치', rew.exp], ['골드', rew.gold], ['회주', rew.jade], ['강화 재료', rew.mat],
      ];
      items.forEach((it, i) => {
        lines += '<div class="res-line" style="animation-delay:' + (i * 80) + 'ms"><span>' + it[0] + '</span><b>+' + fmt(it[1]) + '</b></div>';
      });
      if (rew.first) lines = '<div class="res-line" style="color:var(--gold)"><span>최초 클리어 보너스</span><b>★</b></div>' + lines;
      levelUps.forEach((l, i) => {
        lines += '<div class="res-line" style="animation-delay:' + ((i + 4) * 80) + 'ms"><span>' + esc(DB.byId(l.id).name) +
          ' 레벨 업</span><b>Lv.' + l.from + ' → ' + l.to + '</b></div>';
      });
    } else {
      lines = '<div class="res-line"><span>부대가 전멸했습니다</span><b>—</b></div>' +
        '<div class="res-line"><span>캐릭터를 성장시키거나 조합을 바꿔보세요</span><b>?</b></div>';
    }
    const next = StageSystem.nextStageId(stageId);
    const canNext = win && next && GameState.stageUnlocked(next);
    box.innerHTML =
      '<div class="res-title ' + (win ? 'win' : 'lose') + '">' + (win ? 'VICTORY' : 'DEFEAT') + '</div>' +
      '<div class="tiny muted" style="margin-top:4px">' + esc(stage ? stage.id + ' · ' + stage.name : '') + '</div>' +
      '<div class="res-box">' + lines + '</div>' +
      '<div class="res-actions">' +
      '<button class="btn ghost" id="res-home">홈으로</button>' +
      '<button class="btn" id="res-retry">다시 도전</button>' +
      (canNext ? '<button class="btn primary" id="res-next">다음 임무</button>' : '') +
      '</div>';
    box.classList.add('on');
    const close = () => { box.classList.remove('on'); box.innerHTML = ''; };
    onTap($('#res-home'), () => { AudioSystem.sfx('click'); close(); nav('home'); });
    onTap($('#res-retry'), () => { AudioSystem.sfx('click'); close(); StageSystem.beginBattle(stageId); });
    if (canNext) onTap($('#res-next'), () => { AudioSystem.sfx('click'); close(); StageSystem.enter(next); });
  }

  /* ---------- 최초 설정 ---------- */
  function firstTimeSetup() {
    const g = GameState.get();
    ['yuji_s', 'megumi_s', 'nobara_s', 'miwa'].forEach(id => GameState.addChar(id));
    GameState.give({ jade: 2400, gold: 6000, exp: 4000, mat: 8 });
    g.flags.firstBoot = false;
    GameState.persist(true);
  }

  /* ---------- 부팅 ---------- */
  let resizeTimer = null;
  function boot() {
    FX.init();
    GameState.init();
    if (GameState.get().flags.firstBoot || !GameState.ownedIds().length) firstTimeSetup();
    applySettings();
    updateLayout();
    initHistory();

    // 타이틀
    onTap($('#btn-start'), () => {
      AudioSystem.unlock(); AudioSystem.sfx('click');
      nav('home');
      const noProgress = !Object.keys(GameState.get().stages).length;
      if (noProgress) {
        setTimeout(() => modal({
          title: '첫 임무를 시작할까요?',
          desc: '기본 부대(이타도리 · 메구미 · 노바라 · 미와)가 배정되었습니다. 1-1에서 전투 기본기를 배웁니다.',
          actions: [
            { label: '나중에', cls: 'ghost' },
            { label: '출격', cls: 'primary', fn: () => StageSystem.enter('1-1') },
          ],
        }), 400);
      }
    });
    onTap($('#btn-title-reset'), () => confirmReset());

    // 공통 뒤로가기 버튼
    $$('[data-nav]').forEach(b => onTap(b, () => { AudioSystem.sfx('back'); nav(b.dataset.nav); }));

    // 스토리
    onTap($('#btn-story-next'), () => nextStoryLine());
    onTap($('#story-box'), e => {
      if (e.target && e.target.closest && e.target.closest('button')) return;
      nextStoryLine();
    });
    onTap($('#btn-story-skip'), () => { AudioSystem.sfx('back'); endStory(); });

    // 사운드 잠금 해제 (자동재생 정책)
    const unlock = () => { AudioSystem.unlock(); window.removeEventListener('pointerdown', unlock); window.removeEventListener('keydown', unlock); };
    window.addEventListener('pointerdown', unlock, { passive: true });
    window.addEventListener('keydown', unlock);

    // 회전 / 리사이즈
    const onResize = () => {
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        resizeTimer = null;
        updateLayout();
        if (current === 'battle') Util.safe(() => BattleUI.renderAll(), 'resize-battle');
      }, 120);
    };
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', onResize);

    // 백그라운드 전환 시 BGM 정지 & 저장
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { AudioSystem.stopBgm(); GameState.persist(true); }
      else if (GameState.settings().bgm) AudioSystem.startBgm();
    });
    window.addEventListener('pagehide', () => GameState.persist(true));

    // 전역 오류 방어
    window.addEventListener('error', e => { console.warn('[global error]', e.message); });
    window.addEventListener('unhandledrejection', e => { console.warn('[promise]', e.reason); });

    apply('title');
  }

  return {
    boot, nav, back, apply, toast, modal, closeModal, refreshCurrency, updateLayout, applySettings,
    showBattleResult, battleMenu, playStory, charCard, current: () => current,
  };
})();

/* =====================================================================
 * 부팅
 * ===================================================================== */
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => Util.safe(UI.boot, 'boot'));
} else {
  Util.safe(UI.boot, 'boot');
}
</script>
</body>
</html>
