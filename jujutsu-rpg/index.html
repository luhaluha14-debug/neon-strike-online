<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#08060f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="description" content="주술 전선 - 수집형 턴제 RPG (팬메이드 프로토타입)" />
<title>주술 전선 · JUJUTSU FRONT</title>
<style>
/* =====================================================================
   0. DESIGN TOKENS
   ===================================================================== */
:root{
  --bg-0:#07060d;
  --bg-1:#0d0b18;
  --bg-2:#141126;
  --bg-3:#1c1833;
  --panel:rgba(22,19,40,.92);
  --panel-soft:rgba(38,33,66,.72);
  --line:rgba(150,130,255,.22);
  --line-strong:rgba(165,140,255,.45);
  --txt:#f2efff;
  --txt-dim:#a49dc4;
  --txt-mute:#6f6890;
  --violet:#a06bff;
  --violet-deep:#6b3ce0;
  --blue:#4ea8ff;
  --cyan:#59e7ff;
  --red:#ff4d6d;
  --crimson:#c81e4a;
  --gold:#ffd166;
  --green:#4ade80;
  --orange:#ff9f43;
  --r-sm:8px; --r-md:14px; --r-lg:20px; --r-xl:28px;
  --fs: 1;                     /* 글자 크기 배율(설정) */
  --tap: 46px;                 /* 최소 터치 영역 */
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  --sar:env(safe-area-inset-right,0px);
  --shadow-1:0 6px 24px rgba(0,0,0,.45);
  --shadow-2:0 12px 46px rgba(0,0,0,.6);
  --ease:cubic-bezier(.22,.9,.3,1);
}
/* 고대비 모드 */
body.high-contrast{
  --panel:rgba(6,5,12,.97);
  --panel-soft:rgba(12,10,24,.95);
  --txt:#ffffff; --txt-dim:#d8d3f0; --txt-mute:#b0aacc;
  --line:rgba(200,185,255,.55); --line-strong:rgba(220,205,255,.8);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
html{ -webkit-text-size-adjust:100%; }
body{
  background:var(--bg-0);
  color:var(--txt);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:calc(15px * var(--fs));
  line-height:1.45;
  overflow:hidden;
  overscroll-behavior:none;
  touch-action:manipulation;
  user-select:none;
  -webkit-user-select:none;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;font-size:inherit;}
button:disabled{cursor:default;}
img{max-width:100%;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:rgba(160,107,255,.35);border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

/* =====================================================================
   1. APP SHELL / SCREENS
   ===================================================================== */
#app{
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  background:
    radial-gradient(120% 80% at 50% -10%, #241a4d 0%, transparent 60%),
    radial-gradient(100% 70% at 110% 110%, #3a1440 0%, transparent 55%),
    var(--bg-0);
  isolation:isolate;
}
.screen{
  position:absolute; inset:0;
  display:none;
  flex-direction:column;
  padding-top:var(--sat); padding-bottom:var(--sab);
  padding-left:var(--sal); padding-right:var(--sar);
}
.screen.active{display:flex;}
.screen.fade-in{animation:screenIn .28s var(--ease);}
@keyframes screenIn{from{opacity:0;transform:translateY(8px) scale(.995);}to{opacity:1;transform:none;}}

.scroll{overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;}

/* 공통 헤더 */
.topbar{
  display:flex; align-items:center; gap:10px;
  padding:10px 14px;
  min-height:56px;
  background:linear-gradient(180deg,rgba(12,10,24,.96),rgba(12,10,24,.6));
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(8px);
  flex:0 0 auto;
  z-index:5;
}
.topbar h2{
  margin:0; font-size:calc(17px * var(--fs)); letter-spacing:.06em; font-weight:800;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  flex:0 0 auto; max-width:46%;
}
.topbar .spacer{flex:1 1 auto;min-width:4px;}
.btn-back{
  min-width:var(--tap); min-height:var(--tap);
  display:flex;align-items:center;justify-content:center;
  border-radius:var(--r-md);
  background:var(--panel-soft); border:1px solid var(--line);
  font-size:calc(18px * var(--fs)); font-weight:700;
  flex:0 0 auto;
}
.btn-back:active{transform:scale(.94);}

/* 재화 표시 */
.currency-row{display:flex; gap:8px; align-items:center; flex-wrap:nowrap;
  flex:1 1 auto; justify-content:flex-end; min-width:0; overflow-x:auto; scrollbar-width:none;}
.currency-row::-webkit-scrollbar{display:none;}
.cur{
  display:flex;align-items:center;gap:5px;
  padding:5px 10px; border-radius:999px;
  background:rgba(10,8,20,.72); border:1px solid var(--line);
  font-size:calc(12.5px * var(--fs)); font-weight:700; white-space:nowrap; flex:0 0 auto;
}
.cur .ic{font-size:calc(13px * var(--fs));}
.cur.jade{color:var(--cyan);} .cur.gold{color:var(--gold);} .cur.shard{color:var(--violet);}

/* 버튼 */
.btn{
  min-height:var(--tap); padding:11px 18px;
  border-radius:var(--r-md);
  background:linear-gradient(180deg,rgba(76,58,140,.95),rgba(44,32,88,.95));
  border:1px solid var(--line-strong);
  font-weight:800; letter-spacing:.03em;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .12s var(--ease), filter .15s;
  box-shadow:0 4px 14px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
  text-align:center;
}
.btn:active:not(:disabled){transform:scale(.96); filter:brightness(1.15);}
.btn:disabled{opacity:.42; filter:saturate(.3);}
.btn.primary{background:linear-gradient(180deg,#7a45ff,#4a1fbd); border-color:rgba(190,160,255,.6);}
.btn.gold{background:linear-gradient(180deg,#e0a93c,#9c6a12); border-color:rgba(255,220,150,.55); color:#1a1200;}
.btn.danger{background:linear-gradient(180deg,#c8304f,#7a1229); border-color:rgba(255,150,170,.5);}
.btn.ghost{background:rgba(30,26,54,.7);}
.btn.sm{min-height:38px;padding:7px 12px;font-size:calc(12.5px * var(--fs));border-radius:10px;}

.chip{
  min-height:34px; padding:6px 13px; border-radius:999px;
  background:rgba(30,26,58,.8); border:1px solid var(--line);
  font-size:calc(12.5px * var(--fs)); font-weight:700; color:var(--txt-dim);
  white-space:nowrap;
}
.chip.on{background:linear-gradient(180deg,#7a45ff,#4a1fbd); color:#fff; border-color:rgba(190,160,255,.6);}

.card{
  background:var(--panel); border:1px solid var(--line);
  border-radius:var(--r-lg); padding:14px;
  box-shadow:var(--shadow-1);
}
.muted{color:var(--txt-dim);}
.tiny{font-size:calc(11.5px * var(--fs));}
.sec-title{
  font-size:calc(12px * var(--fs)); letter-spacing:.18em; color:var(--txt-mute);
  font-weight:800; margin:0 0 8px;
}
.empty-note{color:var(--txt-mute); text-align:center; padding:26px 12px; font-size:calc(13px * var(--fs));}

/* =====================================================================
   2. TITLE SCREEN
   ===================================================================== */
#screen-title{
  align-items:center; justify-content:center; text-align:center;
  background:radial-gradient(90% 60% at 50% 35%, rgba(110,60,220,.35), transparent 70%), var(--bg-0);
}
.title-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px;max-width:560px;}
.title-mark{
  font-size:clamp(34px,9vw,68px); font-weight:900; letter-spacing:.1em;
  background:linear-gradient(180deg,#fff,#a06bff 60%,#4ea8ff);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  text-shadow:0 0 40px rgba(160,107,255,.35);
  line-height:1.1;
}
.title-sub{color:var(--txt-dim); letter-spacing:.32em; font-size:calc(12px * var(--fs));}
.title-ring{
  width:min(52vw,220px); aspect-ratio:1; border-radius:50%;
  border:1px solid rgba(160,107,255,.45);
  box-shadow:0 0 60px rgba(120,70,240,.35) inset, 0 0 40px rgba(120,70,240,.25);
  display:grid;place-items:center; position:relative; margin:4px 0;
}
.title-ring::before,.title-ring::after{
  content:''; position:absolute; inset:10%; border-radius:50%;
  border:1px dashed rgba(120,190,255,.35);
  animation:spin 22s linear infinite;
}
.title-ring::after{inset:24%; border-style:solid; border-color:rgba(255,80,120,.25); animation-duration:14s; animation-direction:reverse;}
.title-ring span{font-size:clamp(28px,8vw,52px); filter:drop-shadow(0 0 14px rgba(160,107,255,.8));}
@keyframes spin{to{transform:rotate(360deg);}}
.title-note{color:var(--txt-mute); font-size:calc(11px * var(--fs)); line-height:1.6; max-width:420px;}

/* =====================================================================
   3. MAIN MENU
   ===================================================================== */
.home-body{flex:1 1 auto; display:flex; flex-direction:column; min-height:0;}
.home-hero{
  position:relative; flex:1 1 auto; min-height:120px;
  display:flex; align-items:flex-end; padding:14px;
  overflow:hidden;
}
.home-hero::after{
  content:''; position:absolute; inset:0;
  background:radial-gradient(70% 60% at 30% 40%, rgba(120,70,240,.28), transparent 70%);
  pointer-events:none;
}
.home-hero .hero-char{
  position:absolute; right:-4%; bottom:-2%; width:min(70%,380px); opacity:.97;
  background:radial-gradient(50% 44% at 50% 44%, rgba(150,110,255,.20), transparent 70%);
  filter:drop-shadow(0 12px 30px rgba(0,0,0,.6));
  pointer-events:none;
}
.home-hero .hero-char svg{width:100%;height:auto;display:block;}
.hero-info{position:relative; z-index:2; max-width:62%;
  text-shadow:0 2px 10px rgba(0,0,0,.85);}
.home-next{
  position:absolute; top:12px; left:14px; right:14px; z-index:3;
  display:flex; align-items:center; gap:10px; max-width:420px;
  padding:10px 12px; border-radius:var(--r-md);
  background:linear-gradient(100deg,rgba(28,22,58,.92),rgba(16,12,34,.72));
  border:1px solid var(--line);
}
.home-next .hn-ic{font-size:20px;}
.home-next .hn-b{min-width:0;flex:1;display:flex;flex-direction:column;}
.home-next .hn-t{display:block;font-size:calc(12.5px * var(--fs));font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.home-next .hn-s{display:block;font-size:calc(10.5px * var(--fs));color:var(--txt-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hero-info .hn{font-size:calc(21px * var(--fs)); font-weight:900; letter-spacing:.02em;}
.hero-info .hv{color:var(--violet); font-size:calc(12.5px * var(--fs)); font-weight:700;}
.hero-info .hd{color:var(--txt-dim); font-size:calc(11.5px * var(--fs)); margin-top:4px;}

.menu-grid{
  display:grid; gap:9px; padding:10px 12px calc(12px + var(--sab));
  grid-template-columns:repeat(4,1fr);
  flex:0 0 auto;
}
.menu-btn{
  min-height:70px; border-radius:var(--r-md);
  background:linear-gradient(180deg,rgba(40,34,74,.95),rgba(22,18,44,.95));
  border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-weight:800; font-size:calc(12px * var(--fs));
  transition:transform .12s var(--ease);
  position:relative; overflow:hidden;
}
.menu-btn .mi{font-size:calc(21px * var(--fs)); line-height:1;}
.menu-btn:active{transform:scale(.95);}
.menu-btn.hi{border-color:rgba(190,160,255,.6); background:linear-gradient(180deg,#5c34c4,#33197f);}
.menu-btn .badge{
  position:absolute; top:5px; right:6px; min-width:17px; height:17px; border-radius:999px;
  background:var(--red); color:#fff; font-size:10px; display:grid;place-items:center; padding:0 4px; font-weight:800;
}

/* =====================================================================
   4. CHARACTER CARDS / PORTRAITS
   ===================================================================== */
.portrait{
  position:relative; width:100%; aspect-ratio:3/4; border-radius:var(--r-md);
  overflow:hidden; background:var(--bg-2); display:block;
}
.portrait svg{display:block;width:100%;height:100%;}
.rar-5{--rar:#ffce4d;--rar2:#ff8a3d;}
.rar-4{--rar:#c07bff;--rar2:#6a4ad6;}
.rar-3{--rar:#54b6ff;--rar2:#2f6bd0;}

.char-card{
  position:relative; border-radius:var(--r-md); overflow:hidden;
  background:linear-gradient(180deg,rgba(38,32,70,.9),rgba(18,15,36,.95));
  border:1px solid var(--line);
  display:flex; flex-direction:column;
  transition:transform .12s var(--ease);
  min-width:0;
}
.char-card:active{transform:scale(.96);}
.char-card.locked{filter:grayscale(.85) brightness(.55);}
.char-card .cc-port{position:relative;}
.char-card .cc-rar{
  position:absolute; top:5px; left:5px; z-index:2;
  padding:2px 7px; border-radius:999px; font-size:10px; font-weight:900;
  background:linear-gradient(180deg,var(--rar,#888),var(--rar2,#555)); color:#1a1200;
  box-shadow:0 2px 8px rgba(0,0,0,.5);
}
.char-card .cc-lv{
  position:absolute; top:5px; right:5px; z-index:2;
  padding:2px 7px; border-radius:999px; font-size:10px; font-weight:800;
  background:rgba(8,6,18,.82); border:1px solid var(--line); color:var(--txt);
}
.char-card .cc-el{
  position:absolute; bottom:5px; right:5px; z-index:2;
  width:22px;height:22px;border-radius:50%; display:grid;place-items:center;
  font-size:11px; background:rgba(8,6,18,.8); border:1px solid var(--line);
}
.char-card .cc-meta{padding:7px 8px 8px; min-width:0; display:flex; flex-direction:column; gap:1px;}
.char-card .cc-port{display:block;}
.char-card .cc-name,.char-card .cc-ver,.char-card .cc-role{display:block;}
.char-card .cc-name{
  font-size:calc(12.5px * var(--fs)); font-weight:800;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.char-card .cc-ver{
  font-size:calc(10.5px * var(--fs)); color:var(--violet); font-weight:700;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.char-card .cc-role{font-size:calc(10px * var(--fs)); color:var(--txt-mute);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.char-card .cc-asc{
  position:absolute; bottom:5px; left:5px; z-index:2;
  padding:1px 6px; border-radius:999px; font-size:10px; font-weight:900;
  background:rgba(255,209,102,.9); color:#1a1200;
}
.char-card.sel{outline:2px solid var(--violet); outline-offset:-2px;}

.grid-chars{
  display:grid; gap:9px; padding:12px;
  grid-template-columns:repeat(auto-fill,minmax(104px,1fr));
  align-content:start;
}
.filter-bar{
  display:flex; gap:6px; padding:9px 12px; overflow-x:auto; flex:0 0 auto;
  border-bottom:1px solid var(--line); background:rgba(10,8,20,.55);
  scrollbar-width:none;
}
.filter-bar::-webkit-scrollbar{display:none;}

/* 캐릭터 상세 */
.detail-wrap{flex:1 1 auto; min-height:0; display:flex; flex-direction:column;}
.detail-body{display:flex; flex-direction:column; gap:12px; padding:12px; padding-bottom:calc(20px + var(--sab));}
.detail-top{display:flex; gap:12px; align-items:stretch;}
.detail-port{width:min(38%,190px); flex:0 0 auto;}
.detail-head{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:6px;}
.detail-head .dn{font-size:calc(19px * var(--fs)); font-weight:900; line-height:1.2; word-break:keep-all;}
.detail-head .dv{color:var(--violet); font-weight:800; font-size:calc(12.5px * var(--fs));}
.tags{display:flex; gap:5px; flex-wrap:wrap;}
.tag{padding:3px 9px; border-radius:999px; background:rgba(40,34,74,.9); border:1px solid var(--line);
  font-size:calc(10.5px * var(--fs)); font-weight:700;}
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(88px,1fr)); gap:7px;}
.stat-box{background:rgba(16,13,32,.75); border:1px solid var(--line); border-radius:10px; padding:7px 9px; min-width:0;}
.stat-box .sl{font-size:calc(10px * var(--fs)); color:var(--txt-mute); letter-spacing:.08em;}
.stat-box .sv{font-size:calc(14.5px * var(--fs)); font-weight:900;}
.skill-row{
  display:flex; gap:10px; padding:10px; border-radius:12px;
  background:rgba(18,15,38,.8); border:1px solid var(--line); align-items:flex-start;
}
.skill-ic{
  width:40px;height:40px;border-radius:11px;flex:0 0 auto; display:grid;place-items:center;
  background:linear-gradient(160deg,var(--violet),var(--violet-deep)); font-size:18px;
}
.skill-ic.ult{background:linear-gradient(160deg,#ffce4d,#e0562c);}
.skill-ic.psv{background:linear-gradient(160deg,#4ea8ff,#2c4bd0);}
.skill-meta{flex:1 1 auto; min-width:0;}
.skill-meta .sn{font-weight:800; font-size:calc(13px * var(--fs)); display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
.skill-meta .sd{color:var(--txt-dim); font-size:calc(11.5px * var(--fs)); margin-top:3px; word-break:keep-all;}
.cost-pip{
  font-size:10px;font-weight:900;padding:1px 7px;border-radius:999px;
  background:rgba(78,168,255,.18); color:var(--cyan); border:1px solid rgba(78,168,255,.4);
}
.lv-pip{font-size:10px;font-weight:900;padding:1px 7px;border-radius:999px;
  background:rgba(255,209,102,.16); color:var(--gold); border:1px solid rgba(255,209,102,.35);}

/* 파티 */
.party-slots{display:grid; grid-template-columns:repeat(4,1fr); gap:9px; padding:12px;}
.party-slot{
  border-radius:var(--r-md); border:1px dashed var(--line-strong); min-height:112px;
  background:rgba(18,15,38,.6); display:flex; flex-direction:column; overflow:hidden;
  position:relative;
}
.party-slot.filled{border-style:solid;}
.party-slot .ps-empty{flex:1;display:grid;place-items:center;color:var(--txt-mute);font-size:calc(11px * var(--fs));}
.party-slot .ps-line{
  display:block; font-size:calc(10.5px * var(--fs)); line-height:1.35;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.party-slot .ps-x{
  position:absolute; top:3px; right:3px; z-index:3; width:26px;height:26px;border-radius:50%;
  background:rgba(200,30,60,.9); display:grid;place-items:center;font-size:13px;font-weight:900;
}
.team-stat{display:flex;gap:8px;flex-wrap:wrap;padding:0 12px 10px;}

/* =====================================================================
   5. STAGE SELECT
   ===================================================================== */
.stage-list{display:flex;flex-direction:column;gap:9px;padding:12px;padding-bottom:calc(20px + var(--sab));}
.stage-item{
  display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:var(--r-md);
  background:linear-gradient(100deg,rgba(38,32,70,.92),rgba(18,15,36,.92));
  border:1px solid var(--line); min-height:var(--tap); text-align:left; width:100%;
}
.stage-item.boss{border-color:rgba(255,90,120,.45); background:linear-gradient(100deg,rgba(74,22,44,.92),rgba(24,12,30,.94));}
.stage-item.locked{opacity:.45;}
.stage-item .si-no{
  min-width:52px;height:40px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;
  background:rgba(10,8,20,.7); border:1px solid var(--line); font-weight:900; font-size:calc(13px * var(--fs));
}
.stage-item .si-body{flex:1 1 auto; min-width:0;}
.stage-item .si-t{font-weight:800;font-size:calc(13.5px * var(--fs)); white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stage-item .si-d{font-size:calc(11px * var(--fs)); color:var(--txt-dim); white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stage-item .si-r{flex:0 0 auto;color:var(--gold);font-size:calc(11px * var(--fs));font-weight:800;}
.clear-mark{color:var(--green);font-weight:900;font-size:calc(12px * var(--fs));}

/* =====================================================================
   6. GACHA
   ===================================================================== */
.gacha-wrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden;}
.gacha-banner{
  flex:1 1 auto; min-height:150px; position:relative; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  background:radial-gradient(60% 70% at 50% 40%, rgba(130,70,255,.45), transparent 70%), var(--bg-1);
}
.gacha-banner .gb-art{width:min(46%,260px); filter:drop-shadow(0 10px 40px rgba(160,107,255,.5));}
.gacha-banner .gb-tag{
  position:absolute; top:12px; left:12px; padding:5px 12px; border-radius:999px;
  background:rgba(255,209,102,.92); color:#1a1200; font-weight:900; font-size:calc(11px * var(--fs));
}
.gacha-banner .gb-name{
  position:absolute; bottom:10px; left:12px; right:12px;
  font-weight:900; font-size:calc(17px * var(--fs)); text-shadow:0 2px 12px #000;
}
.pity-wrap{padding:10px 14px 4px;}
.pity-bar{height:9px;border-radius:999px;background:rgba(10,8,20,.8);overflow:hidden;border:1px solid var(--line);}
.pity-fill{height:100%;background:linear-gradient(90deg,#4ea8ff,#ffce4d);transition:width .4s var(--ease);}
.gacha-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:10px 12px calc(14px + var(--sab));}

#gacha-anim{
  position:absolute; inset:0; z-index:40; display:none;
  align-items:center;justify-content:center;flex-direction:column;
  background:radial-gradient(60% 60% at 50% 50%, rgba(50,16,104,.985), #05040a 72%);
}
#gacha-anim.on{display:flex;}
.pull-core{
  width:min(52vw,220px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 50% 45%, #fff, #a06bff 45%, #3a1a90 70%, transparent 74%);
  animation:pullPulse 1.1s var(--ease) infinite;
  filter:blur(.4px);
}
@keyframes pullPulse{0%,100%{transform:scale(.86);opacity:.85;}50%{transform:scale(1.08);opacity:1;}}
.pull-core.gold{background:radial-gradient(circle at 50% 45%, #fff, #ffd166 45%, #d1700f 70%, transparent 74%);}
.pull-text{margin-top:18px;letter-spacing:.3em;font-weight:900;color:#fff;text-shadow:0 0 22px rgba(255,255,255,.6);}
.result-grid{
  display:grid;gap:8px;padding:12px;width:100%;max-width:640px;
  grid-template-columns:repeat(auto-fill,minmax(92px,1fr));
}
.result-card{animation:resIn .34s var(--ease) backwards;}
@keyframes resIn{from{opacity:0;transform:translateY(18px) scale(.86) rotateY(35deg);}to{opacity:1;transform:none;}}
.res-new{position:absolute;bottom:4px;left:4px;z-index:3;background:var(--red);color:#fff;font-size:9px;font-weight:900;padding:1px 5px;border-radius:5px;}
.res-dup{position:absolute;bottom:4px;left:4px;z-index:3;background:rgba(10,8,20,.85);color:var(--violet);font-size:9px;font-weight:900;padding:1px 5px;border-radius:5px;border:1px solid var(--line);}

/* =====================================================================
   7. STORY / DIALOGUE
   ===================================================================== */
#screen-story{background:radial-gradient(80% 60% at 50% 30%, rgba(60,30,130,.35), transparent 70%), var(--bg-0);}
.story-stage{flex:1 1 auto;position:relative;display:flex;align-items:flex-end;justify-content:center;min-height:0;overflow:hidden;}
.story-char{width:min(76%,340px);align-self:flex-end;
  background:radial-gradient(50% 46% at 50% 44%, rgba(140,110,255,.22), transparent 72%);filter:drop-shadow(0 10px 30px rgba(0,0,0,.7));
  animation:storyIn .3s var(--ease);}
.story-char svg{width:100%;height:auto;display:block;}
@keyframes storyIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
.story-box{
  flex:0 0 auto; margin:12px; margin-bottom:calc(12px + var(--sab));
  background:rgba(10,8,22,.94); border:1px solid var(--line-strong); border-radius:var(--r-lg);
  padding:14px; min-height:120px; display:flex;flex-direction:column;gap:8px;
  box-shadow:var(--shadow-2);
}
.story-name{font-weight:900;color:var(--violet);font-size:calc(14px * var(--fs));}
.story-text{flex:1 1 auto;font-size:calc(13.5px * var(--fs));line-height:1.65;word-break:keep-all;}
.story-foot{display:flex;gap:8px;justify-content:flex-end;align-items:center;}

/* =====================================================================
   8. SETTINGS / SHOP
   ===================================================================== */
.set-list{display:flex;flex-direction:column;gap:10px;padding:12px;padding-bottom:calc(24px + var(--sab));}
.set-row{
  display:flex;align-items:center;gap:10px;justify-content:space-between;
  padding:11px 13px;border-radius:12px;background:rgba(18,15,38,.8);border:1px solid var(--line);
  min-height:var(--tap); flex-wrap:wrap;
}
.set-row .sr-l{min-width:0;flex:1 1 160px;}
.set-row .sr-t{font-weight:800;font-size:calc(13px * var(--fs));}
.set-row .sr-s{font-size:calc(11px * var(--fs));color:var(--txt-mute);}
.seg{display:flex;gap:4px;background:rgba(8,6,18,.7);padding:3px;border-radius:12px;border:1px solid var(--line);flex:0 0 auto;}
.seg button{min-height:34px;padding:5px 12px;border-radius:9px;font-size:calc(12px * var(--fs));font-weight:800;color:var(--txt-dim);}
.seg button.on{background:linear-gradient(180deg,#7a45ff,#4a1fbd);color:#fff;}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:12px;padding-bottom:calc(24px + var(--sab));}
.shop-item{display:flex;flex-direction:column;gap:7px;padding:12px;border-radius:var(--r-md);
  background:linear-gradient(180deg,rgba(38,32,70,.92),rgba(18,15,36,.92));border:1px solid var(--line);}
.shop-item .sh-ic{font-size:26px;}
.shop-item .sh-n{font-weight:800;font-size:calc(12.5px * var(--fs));}

/* =====================================================================
   9. BATTLE
   ===================================================================== */
#screen-battle{padding:0;}
.battle{
  position:absolute; inset:0;
  display:grid; min-height:0;
  grid-template-rows:auto minmax(0,1fr) auto auto;
  grid-template-areas:"top" "stage" "party" "cmd";
  padding-top:var(--sat); padding-bottom:var(--sab);
  padding-left:var(--sal); padding-right:var(--sar);
}
.bt-top{grid-area:top; display:flex; align-items:center; gap:8px; padding:6px 10px; z-index:6;}
.bt-stage{grid-area:stage; position:relative; overflow:hidden; min-height:0;}
.bt-party{grid-area:party; display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:6px 8px 2px; z-index:5;}
.bt-cmd{grid-area:cmd; padding:6px 8px calc(8px + var(--sab)); z-index:6;}

/* 배경 (2.5D) */
.bg-layer{position:absolute;inset:0;pointer-events:none;}
.bg-far{
  background:
    radial-gradient(90% 60% at 50% 15%, rgba(120,60,220,.35), transparent 65%),
    linear-gradient(180deg,#120c26 0%, #1b1038 45%, #0a0716 100%);
}
.bg-mid{
  background-image:
    linear-gradient(transparent 0 62%, rgba(120,80,220,.10) 78%, rgba(150,110,255,.16) 100%),
    repeating-linear-gradient(115deg, rgba(160,120,255,.05) 0 3px, transparent 3px 22px);
  opacity:.9;
}
.bg-grid{
  position:absolute;left:-25%;right:-25%;bottom:-6%;height:64%;
  background-image:
    linear-gradient(rgba(160,120,255,.22) 1px, transparent 1px),
    linear-gradient(90deg, rgba(160,120,255,.16) 1px, transparent 1px);
  background-size:52px 40px, 52px 40px;
  transform:perspective(420px) rotateX(64deg);
  transform-origin:50% 100%;
  opacity:.5;
  mask-image:linear-gradient(180deg,transparent,#000 40%);
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 40%);
}
.bg-orbs{position:absolute;inset:0;overflow:hidden;}
.bg-orbs i{
  position:absolute;width:5px;height:5px;border-radius:50%;
  background:rgba(180,140,255,.7);box-shadow:0 0 12px rgba(160,107,255,.8);
  animation:floatUp linear infinite;
}
@keyframes floatUp{from{transform:translateY(20px);opacity:0;}20%{opacity:.85;}to{transform:translateY(-120px);opacity:0;}}
body.q-low .bg-orbs,body.q-low .bg-grid{display:none;}
body.reduce-motion .bg-orbs{display:none;}

/* 전투 캐릭터 라인 */
.line{
  position:absolute; left:0; right:0; display:flex; justify-content:center;
  align-items:flex-end; gap:clamp(4px,2vw,22px); padding:0 8px; pointer-events:none;
}
.enemy-line{top:12%; align-items:flex-start;}
.ally-line{bottom:6%;}
.unit{
  position:relative; pointer-events:auto; display:flex;flex-direction:column;align-items:center;
  transition:transform .18s var(--ease), filter .2s, opacity .3s;
  min-width:0; flex:0 1 auto;
  transform-origin:50% 100%;
}
.unit .u-art{
  width:clamp(58px,16vw,130px); aspect-ratio:3/4;
  filter:drop-shadow(0 8px 18px rgba(0,0,0,.65));
  position:relative;
}
.enemy-line .unit .u-art{width:clamp(74px,21vw,175px);}
.unit.boss .u-art{width:clamp(120px,36vw,280px);}
.unit .u-art svg{width:100%;height:100%;display:block;}
.unit.ally .u-art{width:clamp(66px,19vw,150px);}
.unit.dead{opacity:.22; filter:grayscale(1) brightness(.5);}
.unit.dead .u-art{transform:rotate(-12deg) translateY(10px);}
.unit.acting{transform:translateY(-6px) scale(1.06); filter:drop-shadow(0 0 16px rgba(160,107,255,.85));}
.unit.targetable{cursor:pointer;}
.unit.targetable .u-art{outline:2px solid var(--red); outline-offset:3px; border-radius:16px; animation:tgPulse .9s infinite;}
@keyframes tgPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,77,109,.55);}50%{box-shadow:0 0 0 10px rgba(255,77,109,0);}}
.unit.hit{animation:hitShake .34s;}
@keyframes hitShake{0%,100%{transform:translateX(0);}20%{transform:translateX(-9px) rotate(-3deg);}40%{transform:translateX(7px) rotate(2deg);}60%{transform:translateX(-5px);}80%{transform:translateX(3px);}}
.unit.attack-move{animation:atkLunge .42s var(--ease);}
@keyframes atkLunge{0%{transform:translateY(0);}35%{transform:translateY(-14px) scale(1.1);}60%{transform:translateY(-4px) scale(1.04);}100%{transform:translateY(0);}}
.unit.guard .u-art{box-shadow:0 0 0 3px rgba(78,168,255,.6) inset; border-radius:16px;}

/* 유닛 HP / 브레이크 */
.u-bars{
  width:clamp(66px,19vw,150px); margin-top:5px; display:flex;flex-direction:column;gap:2px; pointer-events:none;
}
.u-name{
  font-size:clamp(9px,2.3vw,12px); font-weight:800; text-align:center; max-width:100%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis; text-shadow:0 1px 4px #000;
}
.bar{height:6px;border-radius:999px;background:rgba(6,4,14,.85);overflow:hidden;border:1px solid rgba(255,255,255,.12);}
.bar > i{display:block;height:100%;width:100%;transform-origin:left;transition:width .35s var(--ease);}
.bar.hp > i{background:linear-gradient(90deg,#ff5f6d,#ffb36b);}
.bar.hp.ally > i{background:linear-gradient(90deg,#4ade80,#a7f3d0);}
.bar.brk{height:5px;}
.bar.brk > i{background:linear-gradient(90deg,#ffd166,#fff3c4);}
.bar.brk.broken > i{background:linear-gradient(90deg,#777,#aaa);}
.u-intent{
  font-size:clamp(8.5px,2.2vw,11.5px); font-weight:800; text-align:center;
  color:#ffd166; background:rgba(10,8,20,.72); border:1px solid rgba(255,209,102,.45);
  border-radius:999px; padding:0 6px; margin:1px auto 2px; max-width:100%;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.unit.boss .u-bars{width:clamp(110px,34vw,320px);}
.brk-tag{
  position:absolute; top:-8px; left:50%; transform:translateX(-50%);
  background:var(--gold); color:#1a1200; font-weight:900; font-size:10px;
  padding:1px 8px; border-radius:6px; letter-spacing:.1em; z-index:5;
  animation:brkPop .5s var(--ease);
}
@keyframes brkPop{from{transform:translateX(-50%) scale(2);opacity:0;}to{transform:translateX(-50%) scale(1);opacity:1;}}

/* 상태 아이콘 */
.st-icons{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:100%;}
.st-ic{
  font-size:9px; font-weight:900; padding:1px 4px; border-radius:5px;
  background:rgba(10,8,20,.9); border:1px solid var(--line); line-height:1.3;
  display:inline-flex; align-items:center; gap:2px;
}
.st-ic.buff{color:var(--green);border-color:rgba(74,222,128,.5);}
.st-ic.debuff{color:var(--red);border-color:rgba(255,77,109,.5);}
.st-ic.ctrl{color:var(--gold);border-color:rgba(255,209,102,.5);}
.st-ic b{opacity:.75;font-size:8px;}

/* 행동 순서 */
.timeline{
  position:absolute; left:6px; top:8px; display:flex; flex-direction:column; gap:4px; z-index:4;
  pointer-events:none; max-height:78%;
}
.tl-label{font-size:9px;letter-spacing:.14em;color:var(--txt-mute);font-weight:800;}
.tl-item{
  display:flex;align-items:center;gap:4px; padding:2px 6px 2px 2px; border-radius:999px;
  background:rgba(8,6,18,.75); border:1px solid var(--line);
  transition:transform .3s var(--ease), opacity .3s;
}
.tl-item .tl-p{width:22px;height:22px;border-radius:50%;overflow:hidden;flex:0 0 auto;background:var(--bg-3);}
.tl-item .tl-p svg{width:100%;height:100%;}
.tl-item .tl-n{font-size:9.5px;font-weight:800;max-width:52px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tl-item.enemy{border-color:rgba(255,77,109,.5);}
.tl-item.now{background:linear-gradient(90deg,rgba(160,107,255,.95),rgba(80,40,190,.9)); transform:scale(1.06);}
.tl-item.first{border-color:var(--violet);}

/* 아군 카드 */
.ally-card{
  border-radius:12px; padding:5px 6px; min-width:0;
  background:linear-gradient(180deg,rgba(34,28,64,.95),rgba(16,13,34,.95));
  border:1px solid var(--line); display:flex; flex-direction:column; gap:3px;
  transition:transform .15s var(--ease), border-color .2s;
  position:relative; overflow:hidden;
}
.ally-card.active{border-color:var(--violet); box-shadow:0 0 0 1px var(--violet), 0 0 18px rgba(160,107,255,.4);}
.ally-card.dead{opacity:.45; filter:grayscale(.8);}
.ally-card .ac-top{display:flex;gap:5px;align-items:center;min-width:0;}
.ally-card .ac-p{width:30px;height:30px;border-radius:9px;overflow:hidden;flex:0 0 auto;background:var(--bg-3);}
.ally-card .ac-p svg{width:100%;height:100%;}
.ally-card .ac-n{font-size:calc(10.5px * var(--fs));font-weight:800;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ally-card .ac-hp{font-size:9.5px;color:var(--txt-dim);font-variant-numeric:tabular-nums;}
.ult-bar{height:5px;border-radius:999px;background:rgba(6,4,14,.85);overflow:hidden;border:1px solid rgba(255,255,255,.1);}
.ult-bar > i{display:block;height:100%;background:linear-gradient(90deg,#4ea8ff,#a06bff);transition:width .35s var(--ease);}
.ult-bar.full > i{background:linear-gradient(90deg,#ffd166,#fff);box-shadow:0 0 10px rgba(255,209,102,.9);}
.ally-card.ultready .ac-n{padding-right:26px;}
.ally-card.ultready::after{
  content:'ULT'; position:absolute; top:2px; right:3px; font-size:8px; font-weight:900; color:#1a1200;
  background:var(--gold); padding:0 4px; border-radius:4px; animation:blink 1.1s infinite;
}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.35;}}

/* 커맨드 */
.cmd-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:7px;}
.cmd-btn{
  min-height:52px; border-radius:14px; font-weight:900; letter-spacing:.04em;
  background:linear-gradient(180deg,rgba(58,46,108,.96),rgba(26,20,52,.96));
  border:1px solid var(--line-strong);
  display:flex;align-items:center;justify-content:center;gap:7px;
  font-size:calc(14px * var(--fs));
  box-shadow:0 4px 14px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.07);
  transition:transform .1s var(--ease), filter .15s;
  position:relative; overflow:hidden;
}
.cmd-btn:active:not(:disabled){transform:scale(.96);filter:brightness(1.2);}
.cmd-btn:disabled{opacity:.4;filter:saturate(.25);}
.cmd-btn.atk{background:linear-gradient(180deg,#3d5bd6,#1e2c7e);}
.cmd-btn.skill{background:linear-gradient(180deg,#7a45ff,#3f1c9e);}
.cmd-btn.guard{background:linear-gradient(180deg,#2f8f7a,#144a45);}
.cmd-btn.ult{background:linear-gradient(180deg,#e0a93c,#96530f); color:#1a1200;}
.cmd-btn.ult.ready{animation:ultGlow 1.4s infinite; color:#241600;}
@keyframes ultGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,209,102,.55);}50%{box-shadow:0 0 0 9px rgba(255,209,102,0);}}
.cmd-btn .cb-sub{font-size:10px;font-weight:700;opacity:.8;}
.sp-row{display:flex;align-items:center;gap:6px;justify-content:center;padding:2px 0 5px;}
.sp-pip{width:15px;height:8px;border-radius:3px;background:rgba(255,255,255,.14);border:1px solid rgba(120,190,255,.3);transition:background .25s;}
.sp-pip.on{background:linear-gradient(90deg,#59e7ff,#4ea8ff);box-shadow:0 0 8px rgba(89,231,255,.7);}
.sp-label{font-size:10px;font-weight:900;color:var(--cyan);letter-spacing:.12em;}

/* 스킬 시트 */
.sheet{
  position:absolute; left:0; right:0; bottom:0; z-index:30;
  background:linear-gradient(180deg,rgba(14,11,28,.97),rgba(8,6,18,.99));
  border-top:1px solid var(--line-strong); border-radius:20px 20px 0 0;
  padding:12px 12px calc(12px + var(--sab));
  transform:translateY(105%); transition:transform .26s var(--ease);
  max-height:74%; overflow-y:auto; box-shadow:0 -10px 40px rgba(0,0,0,.6);
}
.sheet.open{transform:translateY(0);}
.sheet-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
.sheet-head .sh-t{font-weight:900;font-size:calc(14px * var(--fs));}
.skill-btn{
  width:100%; display:flex; gap:10px; align-items:center; text-align:left;
  padding:10px; border-radius:12px; margin-bottom:7px; min-height:var(--tap);
  background:rgba(30,25,58,.9); border:1px solid var(--line);
}
.skill-btn:disabled{opacity:.42;}
.skill-btn:active:not(:disabled){transform:scale(.985);}
.hint-bar{
  position:absolute; left:50%; transform:translateX(-50%); bottom:8px; z-index:20;
  background:rgba(8,6,18,.88); border:1px solid var(--line-strong); border-radius:999px;
  padding:6px 14px; font-size:calc(12px * var(--fs)); font-weight:800; white-space:nowrap;
  pointer-events:none; animation:fadeIn .2s;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

/* 전투 로그 */
.bt-log{
  position:absolute; right:6px; top:8px; width:min(38%,190px); z-index:4; pointer-events:none;
  display:flex; flex-direction:column; gap:2px; align-items:flex-end;
}
.log-line{
  background:rgba(8,6,18,.7); border:1px solid var(--line); border-radius:8px;
  padding:2px 7px; font-size:10px; color:var(--txt-dim); max-width:100%;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  animation:logIn .25s var(--ease);
}
@keyframes logIn{from{opacity:0;transform:translateX(12px);}to{opacity:1;transform:none;}}

/* =====================================================================
   10. FX LAYER
   ===================================================================== */
#fx-layer{position:absolute;inset:0;pointer-events:none;z-index:25;overflow:hidden;}
.dmg-num{
  position:absolute; font-weight:900; font-size:clamp(17px,4.6vw,30px);
  text-shadow:0 2px 0 #2a0010, 0 0 16px rgba(255,80,110,.75);
  animation:dmgFloat .95s var(--ease) forwards; will-change:transform,opacity;
  white-space:nowrap; letter-spacing:-.02em;
}
@keyframes dmgFloat{
  0%{transform:translate(-50%,0) scale(.5);opacity:0;}
  18%{transform:translate(-50%,-16px) scale(1.24);opacity:1;}
  36%{transform:translate(-50%,-22px) scale(1);}
  100%{transform:translate(-50%,-64px) scale(.92);opacity:0;}
}
.dmg-num.crit{color:#ffe38a;font-size:clamp(21px,6vw,40px);text-shadow:0 2px 0 #6a2a00,0 0 22px rgba(255,190,70,.95);}
.dmg-num.heal{color:#8df7b5;text-shadow:0 2px 0 #043a1c,0 0 16px rgba(74,222,128,.8);}
.dmg-num.brk{color:#fff1b8;}
.dmg-num.miss{color:#cfd3e6;font-size:clamp(14px,3.6vw,22px);}
.dmg-crit-tag{
  position:absolute;font-size:11px;font-weight:900;color:#ffce4d;letter-spacing:.2em;
  animation:dmgFloat 1s var(--ease) forwards; text-shadow:0 0 12px rgba(255,180,50,.9);
}
.fx-flash{position:absolute;inset:0;background:#fff;opacity:0;animation:flashAnim .3s ease-out forwards;}
@keyframes flashAnim{0%{opacity:.85;}100%{opacity:0;}}
.fx-flash.dark{background:#05030c;}
.fx-flash.red{background:radial-gradient(circle,#ff2a55,transparent 70%);}
.fx-flash.violet{background:radial-gradient(circle,#a06bff,transparent 70%);}

.fx-slash{
  position:absolute; width:min(52vw,320px); height:6px; border-radius:6px;
  background:linear-gradient(90deg,transparent,#fff,transparent);
  box-shadow:0 0 22px rgba(255,255,255,.95);
  transform-origin:50% 50%; animation:slashAnim .34s ease-out forwards;
}
@keyframes slashAnim{0%{transform:translate(-50%,-50%) rotate(var(--rot,-35deg)) scaleX(0);opacity:0;}
  30%{opacity:1;transform:translate(-50%,-50%) rotate(var(--rot,-35deg)) scaleX(1.1);}
  100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--rot,-35deg)) scaleX(1.2);}}

.fx-ring{
  position:absolute; width:26px;height:26px;border-radius:50%;
  border:3px solid var(--fxc,#a06bff); transform:translate(-50%,-50%);
  animation:ringAnim .5s ease-out forwards;
}
@keyframes ringAnim{0%{opacity:.95;transform:translate(-50%,-50%) scale(.3);}100%{opacity:0;transform:translate(-50%,-50%) scale(5.5);}}

.fx-part{
  position:absolute;width:6px;height:6px;border-radius:50%;
  background:var(--fxc,#a06bff);box-shadow:0 0 10px var(--fxc,#a06bff);
  animation:partAnim .66s ease-out forwards; will-change:transform,opacity;
}
@keyframes partAnim{0%{transform:translate(-50%,-50%) scale(1);opacity:1;}
  100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2);opacity:0;}}

.fx-beam{
  position:absolute; left:50%; top:0; bottom:0; width:min(34vw,180px);
  transform:translateX(-50%);
  background:linear-gradient(180deg,transparent,var(--fxc,#59e7ff) 30%,#fff 55%,var(--fxc,#59e7ff) 75%,transparent);
  filter:blur(1px); opacity:.9; animation:beamAnim .6s ease-out forwards;
}
@keyframes beamAnim{0%{transform:translateX(-50%) scaleX(.1);opacity:0;}
  25%{transform:translateX(-50%) scaleX(1.05);opacity:1;}
  100%{transform:translateX(-50%) scaleX(.6);opacity:0;}}

.fx-shock{
  position:absolute; width:40px;height:40px;border-radius:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle, rgba(255,255,255,.95), var(--fxc,#ff4d6d) 45%, transparent 72%);
  animation:shockAnim .5s ease-out forwards;
}
@keyframes shockAnim{0%{opacity:1;transform:translate(-50%,-50%) scale(.3);}100%{opacity:0;transform:translate(-50%,-50%) scale(3.4);}}

.fx-afterimage{
  position:absolute; opacity:.45; filter:drop-shadow(0 0 10px var(--fxc,#a06bff)) saturate(1.6);
  animation:afterAnim .45s ease-out forwards; pointer-events:none;
}
@keyframes afterAnim{0%{opacity:.6;transform:translateX(0) scale(1);}100%{opacity:0;transform:translateX(var(--dx,-30px)) scale(1.06);}}

.shake-s{animation:camShake .3s;}
.shake-m{animation:camShake .45s;}
.shake-l{animation:camShakeBig .6s;}
@keyframes camShake{0%,100%{transform:translate(0,0);}25%{transform:translate(-5px,3px);}50%{transform:translate(5px,-3px);}75%{transform:translate(-3px,-2px);}}
@keyframes camShakeBig{0%,100%{transform:translate(0,0) scale(1);}
  15%{transform:translate(-12px,7px) scale(1.02);}35%{transform:translate(11px,-8px) scale(1.03);}
  55%{transform:translate(-8px,5px) scale(1.02);}75%{transform:translate(6px,-4px) scale(1.01);}}
body.reduce-motion .shake-s,body.reduce-motion .shake-m,body.reduce-motion .shake-l{animation:none !important;}

.zoom-in{animation:zoomPunch .7s var(--ease);}
@keyframes zoomPunch{0%{transform:scale(1);}30%{transform:scale(1.14);}100%{transform:scale(1);}}

/* 필살기 컷인 */
#cutin{
  position:absolute; inset:0; z-index:60; display:none; overflow:hidden;
  pointer-events:none;
}
#cutin.on{display:block;}
.cut-bg{position:absolute;inset:0;background:rgba(4,2,10,.88);animation:fadeIn .18s;}
.cut-speed{
  position:absolute;inset:0;
  background:repeating-linear-gradient(100deg, rgba(255,255,255,.14) 0 2px, transparent 2px 16px);
  animation:speedMove .5s linear infinite;
}
@keyframes speedMove{to{background-position:60px 0;}}
.cut-port{
  position:absolute; left:4%; top:50%; transform:translateY(-50%);
  width:min(42vw,260px); aspect-ratio:3/4; border-radius:18px; overflow:hidden; z-index:3;
  box-shadow:0 0 60px rgba(160,107,255,.8), 0 0 0 2px rgba(255,255,255,.35);
  animation:cutInPort .5s var(--ease) both;
}
@keyframes cutInPort{0%{transform:translate(-140%,-50%) skewX(-16deg);opacity:0;}
  60%{transform:translate(6%,-50%) skewX(4deg);opacity:1;}
  100%{transform:translate(0,-50%) skewX(0);opacity:1;}}
.cut-band{
  position:absolute; left:0; right:0; top:50%; height:clamp(56px,16vw,120px);
  transform:translateY(-50%) skewY(-4deg);
  background:linear-gradient(90deg,transparent,rgba(120,60,230,.92) 18%,rgba(40,15,90,.95) 82%,transparent);
  animation:bandIn .45s var(--ease) both;
}
@keyframes bandIn{from{transform:translateY(-50%) skewY(-4deg) scaleX(0);}to{transform:translateY(-50%) skewY(-4deg) scaleX(1);}}
.cut-name{
  position:absolute; left:calc(4% + min(42vw,260px) + 12px); right:4%; top:50%; transform:translateY(-50%);
  text-align:right; z-index:4;
}
.cut-name .cn-char{font-size:clamp(11px,3vw,18px);letter-spacing:.24em;color:#cfc3ff;font-weight:800;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cut-name .cn-skill{
  font-size:clamp(19px,5.6vw,44px); font-weight:900; letter-spacing:.04em; line-height:1.15;
  color:#fff; text-shadow:0 0 26px rgba(160,107,255,.95), 0 3px 0 rgba(0,0,0,.5);
  animation:nameIn .45s var(--ease) both .12s; word-break:keep-all;
}
@keyframes nameIn{from{opacity:0;transform:translateY(16px) scale(1.3);letter-spacing:.4em;}to{opacity:1;transform:none;}}

/* 영역전개 */
#domain{position:absolute;inset:0;z-index:70;display:none;overflow:hidden;pointer-events:none;}
#domain.on{display:block;}
.dom-void{position:absolute;inset:0;background:#02010a;animation:fadeIn .25s;}
.dom-sphere{
  position:absolute;left:50%;top:50%;width:min(160vw,1100px);aspect-ratio:1;
  transform:translate(-50%,-50%) scale(.05);border-radius:50%;
  background:radial-gradient(circle at 42% 38%, var(--dc1,#6a3ce0), var(--dc2,#12052e) 58%, #02010a 78%);
  box-shadow:0 0 120px var(--dc1,#6a3ce0) inset, 0 0 90px rgba(160,107,255,.5);
  animation:domExpand 1.1s var(--ease) forwards;
}
@keyframes domExpand{0%{transform:translate(-50%,-50%) scale(.05);opacity:.2;}
  55%{transform:translate(-50%,-50%) scale(1.06);opacity:1;}
  100%{transform:translate(-50%,-50%) scale(1);opacity:1;}}
.dom-rings{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(120vw,760px);aspect-ratio:1;}
.dom-rings i{
  position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,255,255,.28);
  animation:spin 9s linear infinite;
}
.dom-rings i:nth-child(2){inset:12%;border-style:dashed;animation-duration:6s;animation-direction:reverse;}
.dom-rings i:nth-child(3){inset:26%;border-color:rgba(255,255,255,.5);animation-duration:12s;}
.dom-title{
  position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); text-align:center; z-index:4; padding:0 16px;
}
.dom-title .dt-sub{font-size:clamp(11px,3vw,17px);letter-spacing:.5em;color:#d7c9ff;font-weight:800;}
.dom-title .dt-main{
  font-size:clamp(26px,8.5vw,64px);font-weight:900;letter-spacing:.1em;color:#fff;
  text-shadow:0 0 40px var(--dc1,#a06bff), 0 4px 0 rgba(0,0,0,.6);
  animation:domName .7s var(--ease) both .35s; word-break:keep-all;
}
@keyframes domName{0%{opacity:0;transform:scale(2.2);filter:blur(10px);}100%{opacity:1;transform:scale(1);filter:none;}}
.dom-user{
  position:absolute; left:50%; bottom:4%; transform:translateX(-50%);
  width:min(46vw,240px); filter:drop-shadow(0 0 30px var(--dc1,#a06bff));
  animation:domUser .6s var(--ease) both .2s;
}
@keyframes domUser{from{opacity:0;transform:translateX(-50%) translateY(40px);}to{opacity:1;transform:translateX(-50%);}}

/* 결과 오버레이 */
#result{
  position:absolute; inset:0; z-index:80; display:none; flex-direction:column;
  align-items:center; justify-content:center; padding:20px;
  background:radial-gradient(70% 60% at 50% 40%, rgba(50,20,110,.92), rgba(3,2,8,.97));
}
#result.on{display:flex;}
.res-title{font-size:clamp(30px,9vw,60px);font-weight:900;letter-spacing:.18em;animation:nameIn .5s var(--ease) both;}
.res-title.win{background:linear-gradient(180deg,#fff,#ffd166);-webkit-background-clip:text;background-clip:text;color:transparent;}
.res-title.lose{color:#ff6b84;}
.res-box{width:min(94%,460px);margin-top:14px;display:flex;flex-direction:column;gap:9px;}
.res-line{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:9px 13px;border-radius:12px;background:rgba(14,11,28,.85);border:1px solid var(--line);
  animation:resIn .34s var(--ease) backwards; font-size:calc(13px * var(--fs));}
.res-line b{color:var(--gold);font-variant-numeric:tabular-nums;}
.res-actions{display:flex;gap:9px;margin-top:16px;width:min(94%,460px);}
.res-actions .btn{flex:1 1 0;min-width:0;padding:11px 8px;white-space:nowrap;font-size:calc(13.5px * var(--fs));}

/* 튜토리얼 */
#tutorial{position:absolute;inset:0;z-index:90;display:none;pointer-events:none;}
#tutorial.on{display:block;}
.tut-mask{position:absolute;inset:0;background:rgba(2,1,8,.72);pointer-events:auto;}
.tut-hole{position:absolute;border-radius:16px;box-shadow:0 0 0 9999px rgba(2,1,8,.74);border:2px solid var(--gold);
  pointer-events:none; transition:all .3s var(--ease); animation:holeGlow 1.3s infinite;}
@keyframes holeGlow{0%,100%{box-shadow:0 0 0 9999px rgba(2,1,8,.74),0 0 0 0 rgba(255,209,102,.6);}
  50%{box-shadow:0 0 0 9999px rgba(2,1,8,.74),0 0 0 10px rgba(255,209,102,0);}}
.tut-box{
  position:absolute; left:50%; transform:translateX(-50%); width:min(92%,430px);
  background:rgba(12,9,26,.97); border:1px solid var(--line-strong); border-radius:var(--r-lg);
  padding:13px 15px; box-shadow:var(--shadow-2); pointer-events:auto;
  display:flex; flex-direction:column; gap:9px;
}
.tut-box .tb-t{font-weight:900;color:var(--gold);font-size:calc(13.5px * var(--fs));letter-spacing:.06em;}
.tut-box .tb-d{font-size:calc(12.5px * var(--fs));color:var(--txt-dim);line-height:1.6;word-break:keep-all;}
.tut-box .tb-a{display:flex;gap:8px;justify-content:flex-end;}

/* 모달 / 토스트 */
#modal{position:absolute;inset:0;z-index:95;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(3,2,8,.82);}
#modal.on{display:flex;}
.modal-box{width:min(92%,420px);background:rgba(14,11,28,.98);border:1px solid var(--line-strong);border-radius:var(--r-lg);
  padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-2);animation:resIn .22s var(--ease);}
.modal-box .mb-t{font-weight:900;font-size:calc(15px * var(--fs));}
.modal-box .mb-d{color:var(--txt-dim);font-size:calc(12.5px * var(--fs));line-height:1.6;word-break:keep-all;}
.modal-box .mb-a{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;}
#toast-wrap{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + var(--sab));z-index:99;
  display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:100%;padding:0 12px;}
.toast{
  background:rgba(12,9,26,.96);border:1px solid var(--line-strong);border-radius:999px;
  padding:9px 16px;font-size:calc(12.5px * var(--fs));font-weight:700;box-shadow:var(--shadow-1);
  animation:toastIn .28s var(--ease); max-width:100%; text-align:center; word-break:keep-all;
}
@keyframes toastIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
.toast.bad{border-color:rgba(255,77,109,.6);color:#ffc0cb;}
.toast.good{border-color:rgba(74,222,128,.55);color:#bff5d3;}

/* =====================================================================
   11. RESPONSIVE — layout modes: p / l / tp / tl / d
        (JS가 #app[data-layout] 를 갱신한다)
   ===================================================================== */

/* --- 모바일 가로 --- */
#app[data-layout="l"] .battle{
  grid-template-rows:minmax(0,1fr) auto auto;
  grid-template-areas:"stage" "party" "cmd";
}
#app[data-layout="l"] .bt-top{
  position:absolute; top:calc(2px + var(--sat)); left:calc(6px + var(--sal)); right:calc(6px + var(--sar));
  padding:2px 4px; background:none;
}
#app[data-layout="l"] .bt-party{grid-template-columns:repeat(4,1fr);gap:5px;padding:2px 10px 0;}
#app[data-layout="l"] .bt-cmd{padding:4px 10px calc(5px + var(--sab));}
#app[data-layout="l"] .cmd-grid{grid-template-columns:repeat(4,1fr);}
#app[data-layout="l"] .cmd-btn{min-height:46px;font-size:calc(13px * var(--fs));}
#app[data-layout="l"] .ally-card .ac-p{width:26px;height:26px;}
/* 가로 모드는 높이가 좁으므로 vh 기준으로 스프라이트를 축소한다 */

#app[data-layout="l"] .ally-line{bottom:0;}
#app[data-layout="l"] .unit .u-art{width:clamp(34px,13vh,84px);}
#app[data-layout="l"] .enemy-line .unit .u-art{width:clamp(40px,15.5vh,104px);}
#app[data-layout="l"] .unit.boss .u-art{width:clamp(60px,26vh,180px);}
#app[data-layout="l"] .u-bars{width:clamp(50px,16vh,110px);margin-top:2px;}
#app[data-layout="l"] .ally-line .u-name{display:none;}
#app[data-layout="l"] .u-name{font-size:10px;}
#app[data-layout="l"] .st-ic{font-size:8px;padding:0 3px;}
#app[data-layout="l"] .line{gap:clamp(6px,3vw,26px);}
#app[data-layout="p"] .timeline{
  flex-direction:row; left:50%; transform:translateX(-50%); top:4px;
  max-width:96%; flex-wrap:nowrap; overflow:hidden; gap:3px;
}
#app[data-layout="p"] .timeline .tl-label{display:none;}
#app[data-layout="p"] .tl-item{padding:2px;border-radius:999px;}
#app[data-layout="p"] .tl-item .tl-n{display:none;}
#app[data-layout="p"] .tl-item .tl-p{width:26px;height:26px;}
#app[data-layout="p"] .tl-item.now,#app[data-layout="p"] .tl-item.first{box-shadow:0 0 0 2px var(--violet);}
#app[data-layout="p"] .bt-log{top:36px;}
#app[data-layout="l"] .timeline{flex-direction:row;left:50%;transform:translateX(-50%);top:calc(26px + var(--sat));max-width:84%;flex-wrap:nowrap;overflow:hidden;}
#app[data-layout="l"] .tl-item{padding:1px 5px 1px 1px;}
#app[data-layout="l"] .tl-item .tl-p{width:18px;height:18px;}
#app[data-layout="l"] .tl-item .tl-n{font-size:8.5px;max-width:42px;}
#app[data-layout="l"] .timeline .tl-label{display:none;}
#app[data-layout="l"] .bt-log{display:none;}
#app[data-layout="l"] .sp-row{padding:0 0 3px;}
#app[data-layout="l"] .home-hero{min-height:90px;}
#app[data-layout="l"] .menu-grid{grid-template-columns:repeat(7,1fr);}
#app[data-layout="l"] .menu-btn{min-height:58px;}
#app[data-layout="l"] .result-grid{grid-template-columns:repeat(auto-fill,minmax(84px,1fr));max-width:900px;}
#app[data-layout="l"] .story-box{min-height:88px;}
#app[data-layout="l"] .detail-body{flex-direction:row;flex-wrap:wrap;}

/* --- 태블릿 (세로/가로) & 데스크톱 공통 --- */
#app[data-layout="tp"], #app[data-layout="tl"], #app[data-layout="d"]{--tap:50px;}
#app[data-layout="tp"] body, #app[data-layout="tl"] body{font-size:calc(16px * var(--fs));}
#app[data-layout="tp"] .grid-chars,
#app[data-layout="tl"] .grid-chars,

#app[data-layout="d"] .menu-grid{grid-template-columns:repeat(7,1fr);gap:12px;padding:14px 18px calc(18px + var(--sab));max-width:1100px;margin:0 auto;width:100%;}
#app[data-layout="tp"] .menu-btn,
#app[data-layout="tl"] .menu-btn,
#app[data-layout="d"] .menu-btn{min-height:88px;font-size:calc(13.5px * var(--fs));}

#app[data-layout="tl"] .menu-btn .mi,
#app[data-layout="d"] .menu-btn .mi{font-size:calc(26px * var(--fs));}

#app[data-layout="tp"] .detail-body,
#app[data-layout="tl"] .detail-body,
#app[data-layout="d"] .detail-body{max-width:900px;margin:0 auto;width:100%;}
#app[data-layout="tp"] .party-slots,
#app[data-layout="tl"] .party-slots,
#app[data-layout="d"] .party-slots{max-width:760px;margin:0 auto;width:100%;}
#app[data-layout="tp"] .shop-grid,
#app[data-layout="tl"] .shop-grid,
#app[data-layout="d"] .shop-grid{max-width:900px;margin:0 auto;width:100%;}
#app[data-layout="tp"] .story-char,#app[data-layout="tl"] .story-char,#app[data-layout="d"] .story-char{width:min(46%,420px);}

#app[data-layout="tp"] .gacha-actions,

/* 태블릿/데스크톱 전투: 무대를 크게, 커맨드는 한 줄 */

#app[data-layout="tp"] .ally-card,

#app[data-layout="tp"] .ally-card .ac-p,

#app[data-layout="tl"] .enemy-line .unit .u-art, #app[data-layout="d"] .enemy-line .unit .u-art{width:clamp(100px,13vw,186px);}

#app[data-layout="tp"] .u-bars,#app[data-layout="tl"] .u-bars,#app[data-layout="d"] .u-bars{width:clamp(90px,13vw,160px);}

#app[data-layout="tp"] .bt-log,#app[data-layout="tl"] .bt-log,#app[data-layout="d"] .bt-log{width:min(26%,240px);}
#app[data-layout="tp"] .log-line,#app[data-layout="tl"] .log-line,#app[data-layout="d"] .log-line{font-size:11.5px;}

<script>
"use strict";
/* =====================================================================
 * 주술 전선 (JUJUTSU FRONT) — 수집형 턴제 RPG 프로토타입
 * 팬메이드 / 비영리 / 원작 에셋 미사용 (모든 그래픽은 런타임 생성 SVG)
 *
 * 시스템 구성
 *   Util / Art  ─ 유틸리티 & 절차적 아트 생성
 *   DB          ─ 캐릭터 / 스킬 / 적 / 스테이지 / 스토리 데이터
 *   SaveSystem  ─ localStorage 저장·로드·마이그레이션
 *   GameState   ─ 플레이어 진행 상태
 *   CharacterSystem ─ 스탯 계산 / 성장 / 돌파
 *   AudioSystem ─ WebAudio 합성 효과음
 *   AnimationSystem(FX) ─ 전투 연출
 *   BattleSystem ─ 상태머신 / 턴 / 데미지 / 스킬 / AI / 브레이크
 *   GachaSystem ─ 뽑기 / 천장 / 중복
 *   StageSystem ─ 스테이지 진행 / 보상
 *   UISystem    ─ 화면 전환 / 렌더링
 * ===================================================================== */

/* =====================================================================
 * UTIL
 * ===================================================================== */
const Util = (() => {
  const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
  const rand = (a, b) => a + Math.random() * (b - a);
  const irand = (a, b) => Math.floor(rand(a, b + 1));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const round = (v, d = 0) => { const p = Math.pow(10, d); return Math.round(v * p) / p; };
  const num = v => (typeof v === 'number' && isFinite(v)) ? v : 0;
  const fmt = n => Math.floor(num(n)).toLocaleString('ko-KR');
  const uid = (() => { let i = 0; return p => (p || 'u') + (++i); })();
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const sleep = ms => new Promise(r => setTimeout(r, Math.max(0, ms)));
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  /** 안전 실행: 한 부분이 터져도 게임 전체가 멈추지 않도록 */
  function safe(fn, label, fallback) {
    try { return fn(); } catch (err) { console.warn('[safe:' + (label || '?') + ']', err); return fallback; }
  }
  /** 가중치 랜덤 */
  function weighted(entries) { // [{v, w}]
    let total = 0; for (const e of entries) total += Math.max(0, e.w || 0);
    if (total <= 0) return entries.length ? entries[0].v : null;
    let r = Math.random() * total;
    for (const e of entries) { r -= Math.max(0, e.w || 0); if (r <= 0) return e.v; }
    return entries[entries.length - 1].v;
  }
  const hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return Math.abs(h); };
  return { clamp, rand, irand, pick, round, num, fmt, uid, esc, sleep, $, $$, el, safe, weighted, hash };
})();
const { $, $$, esc, fmt, clamp, sleep } = Util;

/* =====================================================================
 * ART — 절차적 SVG 생성 (외부 이미지 에셋 0개)
 * ===================================================================== */
const Art = (() => {
  const cache = new Map();

  function grad(id, c1, c2, angle) {
    const a = angle === undefined ? 90 : angle;
    const rad = a * Math.PI / 180;
    const x2 = (Math.cos(rad) * 0.5 + 0.5).toFixed(3), y2 = (Math.sin(rad) * 0.5 + 0.5).toFixed(3);
    const x1 = (1 - x2).toFixed(3), y1 = (1 - y2).toFixed(3);
    return `<linearGradient id="${id}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}">
      <stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>`;
  }

  const HAIR = {
    // 뒷머리 / 앞머리 패스 (viewBox 120x160 기준, 얼굴 중심 60,58)
    spiky:  { back: 'M28,62 Q26,22 60,18 Q94,22 92,62 L86,58 Q88,30 60,27 Q32,30 34,58 Z',
              front:'M28,52 Q32,30 60,29 Q88,30 92,52 Q80,38 60,36 Q40,38 28,52 Z M38,37 L46,15 L54,35 Z M52,35 L60,11 L68,35 Z M66,37 L74,15 L82,37 Z' },
    long:   { back: 'M26,70 Q22,20 60,17 Q98,20 94,70 Q98,104 88,112 L86,56 Q88,30 60,27 Q32,30 34,56 L32,112 Q22,104 26,70 Z',
              front:'M32,48 Q34,28 60,26 Q86,28 88,48 Q78,34 60,34 Q42,34 32,48 Z' },
    bob:    { back: 'M28,64 Q26,22 60,19 Q94,22 92,64 L90,76 L30,76 Z',
              front:'M31,50 Q36,28 60,27 Q84,28 89,50 Q76,36 60,36 Q44,36 31,50 Z' },
    slick:  { back: 'M30,60 Q28,24 60,20 Q92,24 90,60 L85,55 Q86,32 60,29 Q34,32 35,55 Z',
              front:'M33,44 Q42,30 60,30 Q78,30 87,44 Q74,35 60,35 Q46,35 33,44 Z' },
    wild:   { back: 'M24,66 Q20,20 60,16 Q100,20 96,66 L88,54 Q90,28 60,26 Q30,28 32,54 Z',
              front:'M26,54 Q30,28 60,27 Q90,28 94,54 Q80,38 60,35 Q40,38 26,54 Z M30,42 L38,10 L48,38 Z M46,36 L58,6 L66,36 Z M64,38 L74,9 L84,42 Z' },
    bun:    { back: 'M30,60 Q28,22 60,19 Q92,22 90,60 L86,54 Q88,30 60,27 Q32,30 34,54 Z M60,10 a9,9 0 1,0 0.1,0 Z',
              front:'M33,46 Q40,29 60,29 Q80,29 87,46 Q74,34 60,34 Q46,34 33,46 Z' },
    short:  { back: 'M30,58 Q28,23 60,20 Q92,23 90,58 L85,54 Q87,31 60,28 Q33,31 35,54 Z',
              front:'M34,44 Q42,29 60,29 Q78,29 86,44 Q73,36 60,36 Q47,36 34,44 Z' },
  };

  /** 캐릭터 초상 SVG */
  function portrait(ch, opt) {
    opt = opt || {};
    const key = 'p:' + ch.id + ':' + (opt.bare ? 'b' : 'n');
    if (cache.has(key)) return cache.get(key);
    const c = ch.art || {};
    const aura1 = c.aura1 || '#4a2b8f', aura2 = c.aura2 || '#140a2c';
    const hair = HAIR[c.hair] || HAIR.short;
    const hc = c.hairColor || '#2b2440', hc2 = c.hairColor2 || hc;
    const skin = c.skin || '#f0cdb0', eye = c.eye || '#5ec8ff';
    const uni1 = c.uni1 || '#1d1a30', uni2 = c.uni2 || '#0e0c1c';
    const id = 'g' + Util.hash(ch.id) % 99999;
    const marks = c.marks || 'none';

    let face = '';
    if (marks === 'blindfold') {
      face = `<rect x="34" y="50" width="52" height="11" rx="5" fill="#111" opacity=".92"/>
              <rect x="34" y="50" width="52" height="4" rx="2" fill="#fff" opacity=".12"/>`;
    } else if (marks === 'mask') {
      face = `<path d="M36,56 Q60,50 84,56 Q80,74 60,78 Q40,74 36,56 Z" fill="#dfe6f0" opacity=".9"/>
              <ellipse cx="48" cy="54" rx="5" ry="3.4" fill="#fff"/><ellipse cx="72" cy="54" rx="5" ry="3.4" fill="#fff"/>
              <circle cx="48" cy="54" r="2.4" fill="${eye}"/><circle cx="72" cy="54" r="2.4" fill="${eye}"/>`;
    } else {
      face = `<ellipse cx="48" cy="55" rx="6.2" ry="4.2" fill="#fff" opacity=".95"/>
              <ellipse cx="72" cy="55" rx="6.2" ry="4.2" fill="#fff" opacity=".95"/>
              <circle cx="48.5" cy="55" r="3.1" fill="${eye}"/><circle cx="71.5" cy="55" r="3.1" fill="${eye}"/>
              <circle cx="47.4" cy="53.8" r="1.1" fill="#fff"/><circle cx="70.4" cy="53.8" r="1.1" fill="#fff"/>
              <path d="M41,49 L55,51" stroke="${hc}" stroke-width="2.2" stroke-linecap="round"/>
              <path d="M79,49 L65,51" stroke="${hc}" stroke-width="2.2" stroke-linecap="round"/>`;
    }
    let extra = '';
    if (marks === 'tattoo') {
      extra = `<path d="M38,44 h14 M38,49 h11 M82,44 h-14 M82,49 h-11" stroke="#1b0b14" stroke-width="2" opacity=".8" stroke-linecap="round"/>
               <path d="M50,64 h20" stroke="#1b0b14" stroke-width="1.6" opacity=".55"/>
               <ellipse cx="60" cy="41" rx="3" ry="2" fill="#1b0b14" opacity=".5"/>`;
    } else if (marks === 'stitches') {
      extra = `<path d="M34,60 Q60,66 86,60" stroke="#3a2a4a" stroke-width="1.6" fill="none"/>
               <path d="M42,44 v-8 M52,42 v-8 M68,42 v-8 M78,44 v-8" stroke="#3a2a4a" stroke-width="1.4"/>
               <path d="M58,46 L62,46" stroke="#3a2a4a" stroke-width="1.4"/>`;
    } else if (marks === 'glasses') {
      extra = `<g fill="none" stroke="#dfe6f0" stroke-width="1.8" opacity=".9">
               <rect x="39" y="49" width="19" height="12" rx="4"/><rect x="62" y="49" width="19" height="12" rx="4"/>
               <path d="M58,55 h4"/></g>`;
    } else if (marks === 'scar') {
      extra = `<path d="M74,44 L80,62" stroke="#9c5a5a" stroke-width="1.8" opacity=".8"/>`;
    } else if (marks === 'horn') {
      extra = `<path d="M34,26 L28,6 L44,20 Z" fill="${hc2}"/><path d="M86,26 L92,6 L76,20 Z" fill="${hc2}"/>`;
    } else if (marks === 'crest') {
      extra = `<path d="M60,34 l6,9 -6,9 -6,-9 Z" fill="${eye}" opacity=".85"/>`;
    }

    const svg =
`<svg viewBox="0 0 120 160" preserveAspectRatio="${opt.bare ? 'xMidYMax meet' : 'xMidYMid slice'}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(ch.name)}">
<defs>${grad(id + 'bg', aura1, aura2, 110)}${grad(id + 'h', hc, hc2, 70)}${grad(id + 'u', uni1, uni2, 90)}
<radialGradient id="${id}gl" cx="50%" cy="38%" r="60%"><stop offset="0" stop-color="#fff" stop-opacity=".30"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
${opt.bare
  ? `<radialGradient id="${id}sp" cx="50%" cy="46%" r="58%">
       <stop offset="0" stop-color="${aura1}" stop-opacity=".40"/>
       <stop offset=".62" stop-color="${aura1}" stop-opacity=".15"/>
       <stop offset="1" stop-color="${aura1}" stop-opacity="0"/></radialGradient>
     <ellipse cx="60" cy="86" rx="56" ry="70" fill="url(#${id}sp)"/>
     <ellipse cx="60" cy="156" rx="30" ry="5" fill="#000" opacity=".4"/>`
  : `<rect width="120" height="160" fill="url(#${id}bg)"/>
     <circle cx="60" cy="58" r="46" fill="url(#${id}gl)"/>
     <g opacity=".30" stroke="#fff" fill="none" stroke-width="1">
       <circle cx="60" cy="60" r="40" stroke-dasharray="3 7"/><circle cx="60" cy="60" r="52" stroke-dasharray="1 9"/></g>`}
<path d="M14,160 Q18,116 44,104 L60,112 L76,104 Q102,116 106,160 Z" fill="url(#${id}u)"
  stroke="#fff" stroke-opacity="${opt.bare ? '.16' : '.07'}" stroke-width="1"/>
<path d="M44,104 L60,112 L76,104 L70,98 L60,104 L50,98 Z" fill="#fff" opacity=".10"/>
<rect x="52" y="86" width="16" height="16" rx="6" fill="${skin}"/>
<path d="${hair.back}" fill="url(#${id}h)" stroke="#fff" stroke-opacity=".08" stroke-width="1"/>
<ellipse cx="60" cy="58" rx="24" ry="28" fill="${skin}"/>

      const cols = Math.min(eyes, 3);
      const row = Math.floor(i / cols), col = i % cols;
      const n = Math.min(eyes - row * cols, cols);
      const x = 60 + (col - (n - 1) / 2) * (eyes > 2 ? 17 : 20);
      const y = 56 + row * 15;
      eyeStr += `<ellipse cx="${x}" cy="${y}" rx="7" ry="${eyes > 3 ? 5 : 6}" fill="#0b0510"/>

<ellipse cx="60" cy="156" rx="34" ry="5" fill="#000" opacity=".35"/>

  function art(def, opt) { return def.isCurse ? curse(def, opt) : portrait(def, opt); }

  return { portrait, curse, art, clearCache };

/* =====================================================================
 * SAVE SYSTEM
 * ===================================================================== */
const SaveSystem = (() => {
  const KEY = 'jjkfront.save.v1';
  const SAVE_VERSION = 1;

  function defaults() {
    return {
      saveVersion: SAVE_VERSION,
      created: Date.now(),
      lastSaved: 0,
      chars: {},                 // id -> {lv, exp, asc, sklv:[], shards}
      party: [],
      cur: { jade: 0, gold: 0, mat: 0, exp: 0 },
      stages: {},                // id -> {cleared:true}
      gacha: { pity: 0, total: 0, since4: 0, lost5050: false },
      flags: { tutorialDone: false, story: {}, firstBoot: true },
      settings: {
        bgm: true, sfx: true, quality: 'high', fontScale: 1,
        reduceMotion: false, vibrate: true, highContrast: false, speed: 1,
      },
    };
  }

  /** 잘못된 세이브도 기본값으로 복구 */
  function sanitize(raw) {
    const d = defaults();
    if (!raw || typeof raw !== 'object') return d;
    const out = d;
    out.created = Util.num(raw.created) || Date.now();
    out.saveVersion = SAVE_VERSION;
    // 캐릭터
    if (raw.chars && typeof raw.chars === 'object') {
      for (const id of Object.keys(raw.chars)) {
        if (!DB.byId(id)) continue;                       // 존재하지 않는 ID 무시
        const c = raw.chars[id] || {};
        const skl = Array.isArray(c.sklv) ? c.sklv.map(v => clamp(Math.floor(Util.num(v)) || 1, 1, 10)) : [1, 1, 1];
        while (skl.length < 4) skl.push(1);
        out.chars[id] = {
          lv: clamp(Math.floor(Util.num(c.lv)) || 1, 1, 100),
          exp: Math.max(0, Math.floor(Util.num(c.exp))),
          asc: clamp(Math.floor(Util.num(c.asc)), 0, 6),
          sklv: skl.slice(0, 4),
          shards: Math.max(0, Math.floor(Util.num(c.shards))),
        };
      }
    }
    // 파티 (중복/미보유 제거, 최대 4)
    if (Array.isArray(raw.party)) {
      const seen = new Set();
      for (const id of raw.party) {
        if (typeof id !== 'string' || seen.has(id) || !out.chars[id]) continue;
        seen.add(id); out.party.push(id);
        if (out.party.length >= 4) break;
      }
    }
    // 재화
    if (raw.cur && typeof raw.cur === 'object') {
      for (const k of ['jade', 'gold', 'mat', 'exp']) out.cur[k] = Math.max(0, Math.floor(Util.num(raw.cur[k])));
    }
    // 스테이지
    if (raw.stages && typeof raw.stages === 'object') {
      for (const id of Object.keys(raw.stages)) {
        if (DB.STAGE_MAP[id]) out.stages[id] = { cleared: !!(raw.stages[id] && raw.stages[id].cleared) };
      }
    }
    // 뽑기
    if (raw.gacha && typeof raw.gacha === 'object') {
      out.gacha.pity = clamp(Math.floor(Util.num(raw.gacha.pity)), 0, DB.GACHA.pityMax);
      out.gacha.total = Math.max(0, Math.floor(Util.num(raw.gacha.total)));
      out.gacha.since4 = clamp(Math.floor(Util.num(raw.gacha.since4)), 0, 10);
      out.gacha.lost5050 = !!raw.gacha.lost5050;
    }
    // 플래그
    if (raw.flags && typeof raw.flags === 'object') {
      out.flags.tutorialDone = !!raw.flags.tutorialDone;
      out.flags.firstBoot = !!raw.flags.firstBoot;
      if (raw.flags.story && typeof raw.flags.story === 'object') {
        for (const k of Object.keys(raw.flags.story)) out.flags.story[k] = !!raw.flags.story[k];
      }
    }
    // 설정
    if (raw.settings && typeof raw.settings === 'object') {
      const s = raw.settings, o = out.settings;
      o.bgm = s.bgm !== false; o.sfx = s.sfx !== false;
      o.quality = ['high', 'mid', 'low'].includes(s.quality) ? s.quality : 'high';
      o.fontScale = clamp(Util.num(s.fontScale) || 1, .85, 1.35);
      o.reduceMotion = !!s.reduceMotion; o.vibrate = s.vibrate !== false;
      o.highContrast = !!s.highContrast;
      o.speed = [1, 2, 3].includes(Util.num(s.speed)) ? Util.num(s.speed) : 1;
    }
    return out;
  }

  /** 구버전 → 현재 버전 마이그레이션 */
  function migrate(raw) {
    if (!raw || typeof raw !== 'object') return raw;
    let v = Util.num(raw.saveVersion) || 0;
    // (예시) v0 → v1 : 필드명 변경 대응
    if (v < 1) {
      if (raw.currencies && !raw.cur) raw.cur = raw.currencies;
      if (raw.owned && !raw.chars) {
        raw.chars = {};
        for (const id of Object.keys(raw.owned)) raw.chars[id] = { lv: 1, asc: 0, sklv: [1, 1, 1], shards: 0 };
      }
      v = 1;
    }
    raw.saveVersion = v;
    return raw;
  }

  function load() {
    return Util.safe(() => {
      const txt = localStorage.getItem(KEY);
      if (!txt) return null;
      const parsed = JSON.parse(txt);
      return sanitize(migrate(parsed));
    }, 'load', null);
  }

  let pending = null;
  function save(state, immediate) {
    if (!state) return;
    state.lastSaved = Date.now();
    const doIt = () => Util.safe(() => {
      localStorage.setItem(KEY, JSON.stringify(state));
    }, 'save');
    if (immediate) { if (pending) { clearTimeout(pending); pending = null; } doIt(); return; }
    if (pending) clearTimeout(pending);
    pending = setTimeout(() => { pending = null; doIt(); }, 350);
  }
  function wipe() { Util.safe(() => localStorage.removeItem(KEY), 'wipe'); }
  return { defaults, load, save, wipe, sanitize, SAVE_VERSION, KEY };
})();

/* =====================================================================
 * GAME STATE
 * ===================================================================== */
const GameState = (() => {
  let S = SaveSystem.defaults();

  function init() {
    const loaded = SaveSystem.load();
    if (loaded) { S = loaded; return false; }
    S = SaveSystem.defaults();
    return true; // 신규 플레이어
  }
  function get() { return S; }
  function persist(now) { SaveSystem.save(S, now); }

  /* --- 재화 --- */
  function cur() { return S.cur; }
  function canPay(cost) {
    for (const k of Object.keys(cost || {})) if (Util.num(S.cur[k]) < cost[k]) return false;
    return true;
  }
  function pay(cost) {
    if (!canPay(cost)) return false;
    for (const k of Object.keys(cost)) S.cur[k] = Math.max(0, S.cur[k] - cost[k]);
    persist(); return true;
  }
  function give(res) {
    for (const k of Object.keys(res || {})) {
      if (k === 'shardRandom') continue;
      if (S.cur[k] === undefined) continue;
      S.cur[k] = Math.max(0, Math.floor(S.cur[k] + Util.num(res[k])));
    }
    persist();
  }

  /* --- 캐릭터 --- */
  function owns(id) { return !!S.chars[id]; }
  function ownedIds() { return Object.keys(S.chars).filter(id => DB.byId(id)); }
  function charState(id) { return S.chars[id] || null; }
  function addChar(id) {
    if (!DB.byId(id)) return { ok: false };
    if (S.chars[id]) {                             // 중복 → 조각 + 회주
      const r = DB.byId(id).rarity;
      const shard = r === 5 ? 2 : (r === 4 ? 3 : 5);
      const jade = r === 5 ? 60 : (r === 4 ? 25 : 10);
      S.chars[id].shards += shard;
      S.cur.jade += jade;
      persist();
      return { ok: true, dup: true, shard, jade };
    }
    S.chars[id] = { lv: 1, exp: 0, asc: 0, sklv: [1, 1, 1, 1], shards: 0 };
    if (S.party.length < 4 && !S.party.includes(id)) S.party.push(id);
    persist();
    return { ok: true, dup: false };
  }

  /* --- 파티 --- */
  function party() { return S.party.filter(id => S.chars[id]); }
  function inParty(id) { return S.party.includes(id); }
  function toggleParty(id) {
    if (!S.chars[id]) return { ok: false, msg: '보유하지 않은 캐릭터입니다.' };
    const i = S.party.indexOf(id);
    if (i >= 0) {
      if (S.party.length <= 1) return { ok: false, msg: '최소 1명은 편성해야 합니다.' };
      S.party.splice(i, 1); persist(); return { ok: true, removed: true };
    }
    if (S.party.length >= 4) return { ok: false, full: true, msg: '부대가 가득 찼습니다. 교체할 대원을 선택하세요.' };
    S.party.push(id); persist(); return { ok: true, added: true };
  }
  function replaceParty(slot, id) {
    if (!S.chars[id]) return false;
    const exist = S.party.indexOf(id);
    if (exist >= 0) S.party.splice(exist, 1);
    S.party[clamp(slot, 0, 3)] = id;
    S.party = S.party.filter(Boolean).slice(0, 4);
    persist(); return true;
  }

  /* --- 진행 --- */
  function stageCleared(id) { return !!(S.stages[id] && S.stages[id].cleared); }
  function clearStage(id) {
    const first = !stageCleared(id);
    S.stages[id] = { cleared: true };
    persist();
    return first;
  }
  function stageUnlocked(id) {
    const idx = DB.STAGES.findIndex(s => s.id === id);
    if (idx <= 0) return true;
    return stageCleared(DB.STAGES[idx - 1].id);
  }
  function settings() { return S.settings; }
  function reset() { SaveSystem.wipe(); S = SaveSystem.defaults(); }
  function loadFrom(obj) { S = SaveSystem.sanitize(obj); persist(true); }

  return {
    init, get, persist, cur, canPay, pay, give, owns, ownedIds, charState, addChar,
    party, inParty, toggleParty, replaceParty, stageCleared, clearStage, stageUnlocked,
    settings, reset, loadFrom,
  };
})();

/* =====================================================================
 * CHARACTER SYSTEM — 스탯/성장/돌파
 * ===================================================================== */
const CharacterSystem = (() => {
  const MAX_LV_BY_ASC = [20, 35, 50, 60, 70, 85, 100];
  const ASC_COST = [2, 4, 8, 16, 30, 50];          // 필요한 성흔 조각
  const RARITY_MULT = { 3: 1.0, 4: 1.08, 5: 1.16 };

  const maxLevel = asc => MAX_LV_BY_ASC[clamp(asc, 0, 6)];
  const expToNext = lv => Math.floor(90 + lv * 55 + lv * lv * 1.9);
  const goldToLevel = lv => Math.floor(40 + lv * 26);
  const ascCost = asc => ASC_COST[clamp(asc, 0, 5)];
  const skillUpCost = slv => ({ mat: slv * 2, gold: 300 + slv * 260 });

  /** 레벨/돌파 반영 최종 스탯 */
  function stats(id, cs) {
    const def = DB.byId(id);
    if (!def) return null;
    cs = cs || GameState.charState(id) || { lv: 1, asc: 0, sklv: [1, 1, 1, 1] };
    const lv = clamp(Util.num(cs.lv) || 1, 1, 100);
    const asc = clamp(Util.num(cs.asc), 0, 6);
    const lvF = 1 + 0.082 * (lv - 1);
    const ascF = 1 + 0.07 * asc;
    const rF = RARITY_MULT[def.rarity] || 1;
    const b = def.base;
    return {
      hp: Math.round(b.hp * lvF * ascF * rF),
      atk: Math.round(b.atk * lvF * ascF * rF),
      def: Math.round(b.def * lvF * ascF * rF),
      spd: Math.round(b.spd * (1 + 0.004 * (lv - 1)) * (1 + 0.01 * asc)),
      crit: b.crit + asc * 1.2,
      cdmg: b.cdmg + asc * 2.5,
      lv, asc,
    };
  }
  /** 스킬 레벨 배율 */
  const skillMult = slv => 1 + 0.065 * (clamp(Util.num(slv) || 1, 1, 10) - 1);

  function addExp(id, amount) {
    const cs = GameState.charState(id); if (!cs) return { ok: false };
    const def = DB.byId(id); if (!def) return { ok: false };
    cs.exp = Math.max(0, cs.exp + Math.floor(amount));
    let gained = 0;
    const cap = maxLevel(cs.asc);
    while (cs.lv < cap) {
      const need = expToNext(cs.lv);
      if (cs.exp < need) break;
      cs.exp -= need; cs.lv++; gained++;
    }
    if (cs.lv >= cap) cs.exp = Math.min(cs.exp, expToNext(cs.lv));
    GameState.persist();
    return { ok: true, levels: gained, lv: cs.lv };
  }
  /** 보유 EXP 재화를 사용해 1회 레벨업 */
  function levelUp(id, times) {
    const cs = GameState.charState(id); if (!cs) return { ok: false, msg: '보유하지 않음' };
    times = times || 1;
    let did = 0;
    for (let i = 0; i < times; i++) {
      const cap = maxLevel(cs.asc);
      if (cs.lv >= cap) return did ? { ok: true, levels: did } : { ok: false, msg: '돌파가 필요합니다.' };
      const needExp = expToNext(cs.lv) - cs.exp;
      const needGold = goldToLevel(cs.lv);
      const c = GameState.cur();
      if (c.exp < needExp || c.gold < needGold) {
        return did ? { ok: true, levels: did } : { ok: false, msg: '경험치 또는 골드가 부족합니다.' };
      }
      GameState.pay({ exp: needExp, gold: needGold });
      cs.exp = 0; cs.lv++; did++;
    }
    GameState.persist();
    return { ok: true, levels: did };
  }
  function ascend(id) {
    const cs = GameState.charState(id); if (!cs) return { ok: false, msg: '보유하지 않음' };
    if (cs.asc >= 6) return { ok: false, msg: '최대 돌파입니다.' };
    if (cs.lv < maxLevel(cs.asc)) return { ok: false, msg: '레벨이 최대치에 도달해야 합니다.' };
    const need = ascCost(cs.asc);
    if (cs.shards < need) return { ok: false, msg: '성흔 조각이 부족합니다. (' + cs.shards + '/' + need + ')' };
    cs.shards -= need; cs.asc++;
    GameState.persist();
    return { ok: true, asc: cs.asc };
  }
  function skillUp(id, idx) {
    const cs = GameState.charState(id); if (!cs) return { ok: false, msg: '보유하지 않음' };
    const def = DB.byId(id);
    const n = def.skills.length + 1;      // 스킬 + 필살기
    if (idx < 0 || idx >= n) return { ok: false };
    while (cs.sklv.length < n) cs.sklv.push(1);
    const cur = cs.sklv[idx] || 1;
    if (cur >= 10) return { ok: false, msg: '최대 레벨입니다.' };
    const maxAllow = Math.min(10, 1 + Math.floor(cs.lv / 10) + cs.asc);
    if (cur >= maxAllow) return { ok: false, msg: '캐릭터 레벨/돌파가 더 필요합니다.' };
    const cost = skillUpCost(cur);
    if (!GameState.canPay(cost)) return { ok: false, msg: '재료가 부족합니다.' };
    GameState.pay(cost);
    cs.sklv[idx] = cur + 1;
    GameState.persist();
    return { ok: true, lv: cs.sklv[idx] };
  }
  function addShards(id, n) {
    const cs = GameState.charState(id); if (!cs) return;
    cs.shards += n; GameState.persist();
  }
  /** 전투력(표시용) */
  function power(id) {
    const st = stats(id); if (!st) return 0;
    return Math.round(st.hp * .12 + st.atk * 4.2 + st.def * 2.4 + st.spd * 2);
  }
  return {
    stats, skillMult, addExp, levelUp, ascend, skillUp, addShards, power,
    maxLevel, expToNext, goldToLevel, ascCost, skillUpCost, MAX_LV_BY_ASC,
  };
})();

/* =====================================================================
 * AUDIO SYSTEM — WebAudio 합성 (외부 사운드 파일 없음)
 * ===================================================================== */
const AudioSystem = (() => {
  let ctx = null, master = null, bgmGain = null, sfxGain = null;
  let bgmTimer = null, bgmStep = 0, unlocked = false;

  function ensure() {
    if (ctx) return ctx;
    return Util.safe(() => {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = .5; master.connect(ctx.destination);
      bgmGain = ctx.createGain(); bgmGain.gain.value = .16; bgmGain.connect(master);
      sfxGain = ctx.createGain(); sfxGain.gain.value = .55; sfxGain.connect(master);
      return ctx;
    }, 'audio-init', null);
  }
  /** 브라우저 자동재생 정책: 첫 터치 이후 활성화 */
  function unlock() {
    if (unlocked) return;
    const c = ensure(); if (!c) return;
    Util.safe(() => { if (c.state === 'suspended') c.resume(); }, 'audio-resume');
    unlocked = true;
    if (GameState.settings().bgm) startBgm();
  }
  function tone(freq, dur, type, vol, slideTo, delay) {
    if (!unlocked || !GameState.settings().sfx) return;
