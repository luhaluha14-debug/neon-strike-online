    const c = ensure(); if (!c) return;
    Util.safe(() => {
      const t0 = c.currentTime + (delay || 0);
      const o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t0);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(Math.max(.001, vol || .25), t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(sfxGain);
      o.start(t0); o.stop(t0 + dur + .04);
    }, 'tone');
  }
  function noise(dur, vol, filterFreq, delay) {
    if (!unlocked || !GameState.settings().sfx) return;
    const c = ensure(); if (!c) return;
    Util.safe(() => {
      const t0 = c.currentTime + (delay || 0);
      const len = Math.floor(c.sampleRate * dur);
      const buf = c.createBuffer(1, Math.max(1, len), c.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = c.createBufferSource(); src.buffer = buf;
      const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filterFreq || 1400;
      const g = c.createGain(); g.gain.value = vol || .3;
      src.connect(f); f.connect(g); g.connect(sfxGain);
      src.start(t0);
    }, 'noise');
  }
  const SFX = {
    click: () => tone(620, .07, 'square', .10, 780),
    back: () => tone(360, .08, 'square', .09, 260),
    attack: () => { noise(.12, .22, 2600); tone(300, .09, 'sawtooth', .10, 140); },
    hit: () => { noise(.16, .30, 900); tone(160, .13, 'square', .13, 70); },
    crit: () => { noise(.2, .34, 2200); tone(720, .16, 'sawtooth', .16, 180); },
    heal: () => { tone(520, .2, 'sine', .16, 880); tone(780, .26, 'sine', .11, 1180, .06); },
    buff: () => { tone(420, .16, 'triangle', .13, 700); },
    debuff: () => { tone(300, .2, 'triangle', .13, 160); },
    guard: () => { tone(220, .18, 'sine', .16, 340); noise(.1, .12, 600); },
    brk: () => { noise(.34, .42, 3200); tone(880, .3, 'square', .16, 110); },
    ult: () => { tone(180, .5, 'sawtooth', .2, 900); noise(.5, .25, 4200); tone(1200, .4, 'sine', .12, 300, .1); },
    domain: () => { tone(90, 1.2, 'sawtooth', .26, 40); tone(1400, 1.0, 'sine', .1, 120, .15); noise(1.0, .18, 900, .1); },
    gacha: () => { tone(500, .3, 'sine', .14, 1400); noise(.4, .16, 3000); },
    rare: () => { [0, .1, .2, .3].forEach((d, i) => tone(660 + i * 220, .3, 'triangle', .16, undefined, d)); },
    win: () => { [523, 659, 784, 1046].forEach((f, i) => tone(f, .35, 'triangle', .17, undefined, i * .1)); },
    lose: () => { [440, 370, 294, 220].forEach((f, i) => tone(f, .4, 'sine', .16, undefined, i * .13)); },
    levelup: () => { [523, 784, 1046].forEach((f, i) => tone(f, .25, 'sine', .15, undefined, i * .07)); },
    error: () => tone(200, .12, 'square', .12, 140),
  };
  function sfx(name) { Util.safe(() => { const f = SFX[name]; if (f) f(); }, 'sfx'); }

  /* 간단한 BGM (4마디 루프) */
  const BGM_NOTES = [220, 0, 262, 0, 294, 0, 262, 0, 196, 0, 233, 0, 262, 0, 233, 0];
  function startBgm() {
    const c = ensure(); if (!c || bgmTimer || !unlocked) return;
    bgmStep = 0;
    bgmTimer = setInterval(() => {
      if (!GameState.settings().bgm) return;
      Util.safe(() => {
        const f = BGM_NOTES[bgmStep % BGM_NOTES.length];
        bgmStep++;
        if (!f) return;
        const t0 = c.currentTime;
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'triangle'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(.18, t0 + .08);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + .62);
        o.connect(g); g.connect(bgmGain); o.start(t0); o.stop(t0 + .7);
        // 저음 패드
        if (bgmStep % 4 === 1) {
          const o2 = c.createOscillator(), g2 = c.createGain();
          o2.type = 'sine'; o2.frequency.value = f / 2;
          g2.gain.setValueAtTime(0.0001, t0);
          g2.gain.exponentialRampToValueAtTime(.12, t0 + .2);
          g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.4);
          o2.connect(g2); g2.connect(bgmGain); o2.start(t0); o2.stop(t0 + 1.5);
        }
      }, 'bgm');
    }, 420);
  }
  function stopBgm() { if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; } }
  function applySettings() {
    const s = GameState.settings();
    if (s.bgm) { if (unlocked) startBgm(); } else stopBgm();
    if (sfxGain) sfxGain.gain.value = s.sfx ? .55 : 0;
  }
  function vibrate(ms) {
    if (!GameState.settings().vibrate) return;
    Util.safe(() => { if (navigator.vibrate) navigator.vibrate(ms); }, 'vibrate');
  }
  return { unlock, sfx, startBgm, stopBgm, applySettings, vibrate };
})();

/* =====================================================================
 * ANIMATION SYSTEM (FX) — 전투 연출
 * ===================================================================== */
const FX = (() => {
  let layer = null, stage = null;
  const timers = new Set();
  const nodes = new Set();

  function init() {
    layer = $('#fx-layer'); stage = $('#bt-stage');
  }
  function q() { return GameState.settings().quality; }
  function reduced() { return GameState.settings().reduceMotion; }
  function speed() { return GameState.settings().speed || 1; }

  function later(fn, ms) {
    const t = setTimeout(() => { timers.delete(t); Util.safe(fn, 'fx-timer'); }, ms);
    timers.add(t); return t;
  }
  /** 자동 제거되는 FX 노드 추가 (메모리 누수 방지) */
  function add(node, life) {
    if (!layer) return null;
    layer.appendChild(node); nodes.add(node);
    later(() => { if (node.parentNode) node.parentNode.removeChild(node); nodes.delete(node); }, life);
    return node;
  }
  /** 모든 연출 정리 (전투 종료/화면 전환 시) */
  function clear() {
    timers.forEach(t => clearTimeout(t)); timers.clear();
    nodes.forEach(n => { if (n.parentNode) n.parentNode.removeChild(n); }); nodes.clear();
    if (layer) layer.innerHTML = '';
    const ci = $('#cutin'), dm = $('#domain');
    if (ci) { ci.className = ''; ci.innerHTML = ''; }
    if (dm) { dm.className = ''; dm.innerHTML = ''; }
    if (stage) stage.className = 'bt-stage';
  }
  /** 대상 엘리먼트의 중심 좌표(FX 레이어 기준) */
  function center(el) {
    if (!el || !layer) return { x: 0, y: 0 };
    const r = el.getBoundingClientRect(), lr = layer.getBoundingClientRect();
    return { x: r.left - lr.left + r.width / 2, y: r.top - lr.top + r.height / 2 };
  }
  function damageNumber(el, value, opt) {
    opt = opt || {};
    if (!layer) return;
    const p = center(el);
    const d = Util.el('div', 'dmg-num' + (opt.crit ? ' crit' : '') + (opt.heal ? ' heal' : '') + (opt.miss ? ' miss' : ''));
    d.textContent = opt.miss ? 'MISS' : (opt.heal ? '+' + fmt(value) : '-' + fmt(value));
    d.style.left = (p.x + Util.rand(-14, 14)) + 'px';
    d.style.top = (p.y - 10 + Util.rand(-8, 8)) + 'px';
    d.style.animationDuration = (0.95 / speed()) + 's';
    add(d, 1100 / speed());
    if (opt.crit) {
      const t = Util.el('div', 'dmg-crit-tag'); t.textContent = 'CRITICAL!';
      t.style.left = (p.x + 14) + 'px'; t.style.top = (p.y - 34) + 'px';
      t.style.animationDuration = (1 / speed()) + 's';
      add(t, 1100 / speed());
    }
  }
  function textPop(el, text, color) {
    if (!layer) return;
    const p = center(el);
    const d = Util.el('div', 'dmg-num');
    d.textContent = text;
    d.style.color = color || '#cbb6ff';
    d.style.fontSize = 'clamp(12px,3vw,18px)';
    d.style.left = p.x + 'px'; d.style.top = (p.y - 26) + 'px';
    d.style.animationDuration = (0.95 / speed()) + 's';
    add(d, 1100 / speed());
  }
  function particles(el, color, count) {
    if (q() === 'low' || reduced()) return;
    const n = q() === 'mid' ? Math.ceil(count * .5) : count;
    const p = center(el);
    for (let i = 0; i < n; i++) {
      const d = Util.el('div', 'fx-part');
      const a = Util.rand(0, Math.PI * 2), dist = Util.rand(24, 86);
      d.style.setProperty('--fxc', color);
      d.style.setProperty('--dx', Math.cos(a) * dist + 'px');
      d.style.setProperty('--dy', Math.sin(a) * dist + 'px');
      d.style.left = p.x + 'px'; d.style.top = p.y + 'px';
      d.style.animationDelay = (i * 8) + 'ms';
      d.style.animationDuration = (0.66 / speed()) + 's';
      add(d, 800 / speed());
    }
  }
  function ring(el, color) {
    if (reduced()) return;
    const p = center(el);
    const d = Util.el('div', 'fx-ring');
    d.style.setProperty('--fxc', color || '#a06bff');
    d.style.left = p.x + 'px'; d.style.top = p.y + 'px';
    d.style.animationDuration = (0.5 / speed()) + 's';
    add(d, 620 / speed());
  }
  function shock(el, color) {
    const p = center(el);
    const d = Util.el('div', 'fx-shock');
    d.style.setProperty('--fxc', color || '#ff4d6d');
    d.style.left = p.x + 'px'; d.style.top = p.y + 'px';
    d.style.animationDuration = (0.5 / speed()) + 's';
    add(d, 620 / speed());
  }
  function slash(el, color) {
    if (reduced()) { shock(el, color); return; }
    const p = center(el);
    const d = Util.el('div', 'fx-slash');
    d.style.left = p.x + 'px'; d.style.top = p.y + 'px';
    d.style.setProperty('--rot', Util.irand(-50, 30) + 'deg');
    if (color) d.style.background = 'linear-gradient(90deg,transparent,' + color + ',transparent)';
    d.style.animationDuration = (0.34 / speed()) + 's';
    add(d, 440 / speed());
  }
  function beam(el, color) {
    const p = center(el);
    const d = Util.el('div', 'fx-beam');
    d.style.setProperty('--fxc', color || '#59e7ff');
    d.style.left = p.x + 'px';
    d.style.animationDuration = (0.6 / speed()) + 's';
    add(d, 720 / speed());
  }
  function flash(kind) {
    if (reduced()) return;
    const d = Util.el('div', 'fx-flash' + (kind ? ' ' + kind : ''));
    d.style.animationDuration = (0.3 / speed()) + 's';
    add(d, 400 / speed());
  }
  function shake(level) {
    if (!stage || reduced()) return;
    const cls = level === 'l' ? 'shake-l' : (level === 'm' ? 'shake-m' : 'shake-s');
    stage.classList.remove('shake-s', 'shake-m', 'shake-l');
    void stage.offsetWidth;
    stage.classList.add(cls);
    later(() => stage.classList.remove(cls), 700);
    AudioSystem.vibrate(level === 'l' ? 45 : (level === 'm' ? 25 : 12));
  }
  function zoom() {
    if (!stage || reduced() || q() === 'low') return;
    stage.classList.remove('zoom-in'); void stage.offsetWidth; stage.classList.add('zoom-in');
    later(() => stage.classList.remove('zoom-in'), 800);
  }
  function afterimage(unitEl, color) {
    if (q() !== 'high' || reduced() || !unitEl) return;
    const art = unitEl.querySelector('.u-art'); if (!art) return;
    const r = art.getBoundingClientRect(), lr = layer.getBoundingClientRect();
    const d = Util.el('div', 'fx-afterimage');
    d.innerHTML = art.innerHTML;
    d.style.left = (r.left - lr.left) + 'px'; d.style.top = (r.top - lr.top) + 'px';
    d.style.width = r.width + 'px'; d.style.height = r.height + 'px';
    d.style.setProperty('--fxc', color || '#a06bff');
    d.style.setProperty('--dx', Util.irand(-40, 40) + 'px');
    d.style.animationDuration = (0.45 / speed()) + 's';
    add(d, 560 / speed());
  }
  /** 스킬 종류별 연출 프리셋 */
  const PRESET = {
    slash: { color: '#ffffff', fn: (el) => { slash(el); particles(el, '#ffd9e0', 8); } },
    impact: { color: '#ff9f43', fn: (el) => { shock(el, '#ff9f43'); particles(el, '#ffce7a', 10); } },
    pierce: { color: '#ff4d6d', fn: (el) => { slash(el, '#ff9ab0'); ring(el, '#ff4d6d'); } },
    fire: { color: '#ff7a1a', fn: (el) => { shock(el, '#ff7a1a'); particles(el, '#ffb347', 14); flash('red'); } },
    ice: { color: '#8fe3ff', fn: (el) => { ring(el, '#8fe3ff'); particles(el, '#d7f6ff', 10); } },
    water: { color: '#4ea8ff', fn: (el) => { ring(el, '#4ea8ff'); particles(el, '#9fd8ff', 10); } },
    curse: { color: '#c44dff', fn: (el) => { shock(el, '#c44dff'); particles(el, '#e0a0ff', 12); } },
    shadow: { color: '#6b3ce0', fn: (el) => { ring(el, '#6b3ce0'); particles(el, '#a88cff', 10); } },
    spirit: { color: '#7affc8', fn: (el) => { ring(el, '#7affc8'); particles(el, '#c6ffe8', 12); } },
    blue: { color: '#4ea8ff', fn: (el) => { beam(el, '#4ea8ff'); ring(el, '#59e7ff'); flash('violet'); } },
    red: { color: '#ff4d6d', fn: (el) => { shock(el, '#ff4d6d'); flash('red'); particles(el, '#ff8fa3', 12); } },
    purple: { color: '#a06bff', fn: (el) => { beam(el, '#a06bff'); shock(el, '#a06bff'); flash('violet'); } },
    black: { color: '#1a0a2a', fn: (el) => { flash('dark'); slash(el, '#ffffff'); shock(el, '#7a3cff'); particles(el, '#ffffff', 14); } },
    void: { color: '#6a8dff', fn: (el) => { beam(el, '#6a8dff'); ring(el, '#ffffff'); particles(el, '#a8c4ff', 16); } },
    shrine: { color: '#ff3355', fn: (el) => { slash(el, '#ff6a80'); slash(el, '#ffffff'); shock(el, '#ff3355'); } },
    nature: { color: '#7ae05a', fn: (el) => { ring(el, '#7ae05a'); particles(el, '#c8f5a0', 10); } },
    heal: { color: '#4ade80', fn: (el) => { ring(el, '#4ade80'); particles(el, '#a7f3d0', 8); } },
    buff: { color: '#ffd166', fn: (el) => { ring(el, '#ffd166'); particles(el, '#fff0b8', 8); } },
    infinity: { color: '#8fb8ff', fn: (el) => { ring(el, '#8fb8ff'); ring(el, '#ffffff'); } },
    clap: { color: '#ffd166', fn: (el) => { shock(el, '#ffd166'); flash(); } },
    chain: { color: '#c0c8d8', fn: (el) => { slash(el, '#c0c8d8'); particles(el, '#e8eef8', 8); } },
  };
  function play(name, el) {
    const p = PRESET[name] || PRESET.slash;
    Util.safe(() => p.fn(el), 'fx-play');
    return p.color;
  }
  function colorOf(name) { return (PRESET[name] || PRESET.slash).color; }

  /* --- 필살기 컷인 --- */
  async function cutin(def, skillName, sub) {
    const box = $('#cutin'); if (!box) return;
    const svg = Art.art(def);
    box.innerHTML =
      '<div class="cut-bg"></div>' +
      (q() === 'high' && !reduced() ? '<div class="cut-speed"></div>' : '') +
      '<div class="cut-band"></div>' +
      '<div class="cut-port">' + svg + '</div>' +
      '<div class="cut-name"><div class="cn-char">' + esc(sub || def.name) + '</div>' +
      '<div class="cn-skill">' + esc(skillName) + '</div></div>';
    box.classList.add('on');
    AudioSystem.sfx('ult');
    await sleep(900 / speed());
    box.classList.remove('on');
    box.innerHTML = '';
  }
  /* --- 영역전개 --- */
  async function domainExpansion(def, name, colors) {
    const box = $('#domain'); if (!box) return;
    const c1 = (colors && colors[0]) || '#6a3ce0', c2 = (colors && colors[1]) || '#12052e';
    box.innerHTML =
      '<div class="dom-void"></div>' +
      '<div class="dom-sphere" style="--dc1:' + c1 + ';--dc2:' + c2 + '"></div>' +
      (q() === 'low' || reduced() ? '' : '<div class="dom-rings"><i></i><i></i><i></i></div>') +
      '<div class="dom-user">' + Art.art(def, { bare: true }) + '</div>' +
      '<div class="dom-title" style="--dc1:' + c1 + '"><div class="dt-sub">영역전개</div>' +
      '<div class="dt-main">' + esc(name) + '</div></div>';
    box.classList.add('on');
    AudioSystem.sfx('domain');
    AudioSystem.vibrate([30, 40, 60]);
    await sleep(1500 / speed());
    flash();
    box.classList.remove('on');
    box.innerHTML = '';
  }
  function spawnOrbs(n) {
    const wrap = $('#bg-orbs'); if (!wrap) return;
    wrap.innerHTML = '';
    if (q() === 'low' || reduced()) return;
    const count = q() === 'mid' ? Math.ceil(n / 2) : n;
    let html = '';
    for (let i = 0; i < count; i++) {
      html += '<i style="left:' + Util.round(Util.rand(2, 96), 1) + '%;bottom:' + Util.round(Util.rand(0, 60), 1) +
        '%;animation-duration:' + Util.round(Util.rand(4, 9), 1) + 's;animation-delay:' + Util.round(Util.rand(0, 5), 1) + 's"></i>';
    }
    wrap.innerHTML = html;
  }
  return {
    init, clear, damageNumber, textPop, particles, ring, shock, slash, beam, flash, shake, zoom,
    afterimage, play, colorOf, cutin, domainExpansion, spawnOrbs, center,
  };
})();

/* =====================================================================
 * BATTLE SYSTEM — 상태머신 / 턴 / 전투 계산
 * 상태: INIT, PLAYER_TURN, SKILL_SELECT, TARGET_SELECT, ANIMATION,
 *       ENEMY_TURN, VICTORY, DEFEAT
 * ===================================================================== */
const BattleSystem = (() => {
  const BASE_AV = 10000;
  const SP_MAX = 6;
  const MAX_ACTIONS = 500;          // 무한 루프 방지 상한
  let B = null;                     // 현재 전투 컨텍스트

  /* ---------------- 유닛 생성 ---------------- */
  function allyUnit(charId) {
    const def = DB.byId(charId); if (!def) return null;
    const cs = GameState.charState(charId) || { lv: 1, asc: 0, sklv: [1, 1, 1, 1] };
    const st = CharacterSystem.stats(charId, cs);
    const sklv = Array.isArray(cs.sklv) ? cs.sklv.slice() : [1, 1, 1, 1];
    while (sklv.length < def.skills.length + 1) sklv.push(1);
    return {
      uid: Util.uid('a'), side: 'ally', id: charId, def,
      name: def.name, version: def.version, el: def.el, role: def.role, rarity: def.rarity,
      lv: st.lv, maxHp: st.hp, hp: st.hp,
      base: { atk: st.atk, def: st.def, spd: st.spd, crit: st.crit / 100, cdmg: st.cdmg / 100 },
      skills: def.skills, sklv, ultDef: def.ult, passive: def.passive,
      ult: 0, buffs: [], av: 0, alive: true, guard: false,
      tough: 0, toughMax: 0, broken: false, breakTurns: 0,
      isBoss: false, isCurse: !!def.isCurseChar,
    };
  }
  function enemyUnit(defId, lv, idx) {
    const def = DB.ENEMY_MAP[defId]; if (!def) return null;
    const f = 1 + 0.074 * (lv - 1);
    const b = def.base;
    return {
      uid: Util.uid('e'), side: 'enemy', id: defId, def,
      name: def.name, version: '', el: def.el, role: 'dps', rarity: def.isBoss ? 5 : 3,
      lv, maxHp: Math.round(b.hp * f), hp: Math.round(b.hp * f),
      base: {
        atk: Math.round(b.atk * f), def: Math.round(b.def * f),
        spd: Math.round(b.spd * (1 + .003 * (lv - 1))), crit: b.crit / 100, cdmg: b.cdmg / 100,
      },
      skills: def.skills, sklv: def.skills.map(() => 1), ultDef: null, passive: null,
      ult: 0, buffs: [], av: 0, alive: true, guard: false,
      toughMax: Math.round((def.tough || 40) * (1 + .03 * (lv - 1))),
      tough: Math.round((def.tough || 40) * (1 + .03 * (lv - 1))),
      broken: false, breakTurns: 0,
      isBoss: !!def.isBoss, isCurse: true, pattern: def.pattern || null, patternIdx: 0, slot: idx,
    };
  }

  /* ---------------- 스탯 계산 ---------------- */
  function modSum(u, stat) {
    let v = 0;
    for (const b of u.buffs) {
      if (b.kind !== 'buff' && b.kind !== 'debuff') continue;
      if (b.stat !== stat) continue;
      v += (b.kind === 'buff' ? b.val : -b.val);
    }
    return v;
  }
  function pAtk(u) {
    let v = u.base.atk * Math.max(.25, 1 + modSum(u, 'atk'));
    const ps = passives(u);
    for (const p of ps) {
      if (p.type === 'ultAtk' && u.ult >= 50) v *= (1 + p.val);
      if (p.type === 'avengeAtk' && B && B.allyDown) v *= (1 + p.val);
    }
    if (B && u.side === 'ally') {
      for (const a of B.allies) {
        if (!a.alive || a === u) continue;
        for (const p of passives(a)) if (p.type === 'teamAtk') v *= (1 + p.val);
      }
    }
    return v;
  }
  function pDef(u) {
    let v = u.base.def * Math.max(.2, 1 + modSum(u, 'def'));
    if (u.guard) v *= 1.5;
    if (B) {
      const mates = u.side === 'ally' ? B.allies : B.enemies;
      for (const a of mates) {
        if (!a.alive) continue;
        for (const p of passives(a)) if (p.type === 'teamDef') v *= (1 + p.val);
      }
    }
    return v;
  }
  function pSpd(u) { return Math.max(20, u.base.spd * Math.max(.3, 1 + modSum(u, 'spd'))); }
  function pCrit(u) { return clamp(u.base.crit + modSum(u, 'crit'), 0, .95); }
  function pCdmg(u) { return Math.max(.1, u.base.cdmg + modSum(u, 'cdmg')); }
  function pDmgOut(u) { return Math.max(.2, 1 + modSum(u, 'dmg')); }
  function pDmgIn(u) {
    let v = 1 + modSum(u, 'taken') - modSum(u, 'takenD');
    for (const p of passives(u)) if (p.type === 'dmgCut') v -= p.val;
    return clamp(v, .1, 3);
  }
  function passives(u) {
    const p = u.passive; if (!p) return [];
    return p.type === 'multi' ? (p.list || []) : [p];
  }
  function hasPassive(u, type) { return passives(u).find(p => p.type === type) || null; }

  /* ---------------- 상태 효과 ---------------- */
  function addBuff(u, b) {
    if (!u || !u.alive) return;
    const key = (b.kind || 'buff') + ':' + (b.stat || b.name || '');
    const ex = u.buffs.find(x => x.key === key);
    const nb = Object.assign({ key, turns: 1, val: 0, kind: 'buff' }, b);
    nb.turns = Math.max(1, Math.floor(nb.turns));
    nb.applied = B ? B.actionCount : 0;   // 같은 턴에 걸린 효과는 그 턴 끝에 감소시키지 않는다
    if (ex) {
      ex.turns = Math.max(ex.turns, nb.turns);
      ex.val = Math.max(ex.val, nb.val);
      ex.applied = nb.applied;
      if (nb.kind === 'shield') ex.val = Math.max(ex.val, nb.val);
      return;
    }
    if (u.buffs.length >= 10) u.buffs.shift();
    u.buffs.push(nb);
  }
  function removeBuffs(u, pred, count) {
    let n = 0;
    for (let i = u.buffs.length - 1; i >= 0 && (count === undefined || n < count); i--) {
      if (pred(u.buffs[i])) { u.buffs.splice(i, 1); n++; }
    }
    return n;
  }
  const isStunned = u => u.buffs.some(b => b.kind === 'stun' && b.turns > 0) || (u.broken && u.breakTurns > 0);
  const hasDot = u => u.buffs.some(b => b.kind === 'dot');
  const debuffCount = u => u.buffs.filter(b => b.kind === 'debuff' || b.kind === 'dot' || b.kind === 'stun').length;

  function tickBuffs(u) {
    const now = B ? B.actionCount : -1;
    for (let i = u.buffs.length - 1; i >= 0; i--) {
      const b = u.buffs[i];
      if (b.applied === now) continue;          // 이번 행동에서 막 부여된 효과는 유지
      b.turns = Math.max(0, b.turns - 1);
      if (b.turns <= 0) u.buffs.splice(i, 1);
    }
  }

  /* ---------------- 데미지 ---------------- */
  function elementMult(a, d) {
    const A = DB.ELEMENTS[a], D = DB.ELEMENTS[d];
    if (!A || !D) return 1;
    if (A.strong === d) return 1.3;
    if (D.strong === a) return .85;
    return 1;
  }
  function calcDamage(src, tgt, power, opt) {
    opt = opt || {};
    const A = pAtk(src), D = pDef(tgt);
    let dmg = A * power * (1 - D / (D + 240 + 13 * src.lv));
    dmg *= elementMult(src.el, tgt.el);
    dmg *= pDmgOut(src) * pDmgIn(tgt);
    // 패시브
    for (const p of passives(src)) {
      if (p.type === 'lowHpDmg' && src.hp / src.maxHp <= .5) dmg *= (1 + p.val);
      if (p.type === 'vsLowHp' && tgt.hp / tgt.maxHp <= .5) dmg *= (1 + p.val);
      if (p.type === 'dotBonus' && hasDot(tgt)) dmg *= (1 + p.val);
      if (p.type === 'vsBroken' && tgt.broken) dmg *= (1 + p.val);
      if (p.type === 'vsSlow' && tgt.buffs.some(b => b.kind === 'debuff' && b.stat === 'spd')) dmg *= (1 + p.val);
      if (p.type === 'vsDebuff') dmg *= (1 + Math.min(4, debuffCount(tgt)) * p.val);
    }
    // 스킬 보너스
    if (opt.bonusVsBroken && tgt.broken) dmg *= (1 + opt.bonusVsBroken);
    if (opt.bonusVsDot && hasDot(tgt)) dmg *= (1 + opt.bonusVsDot);
    if (opt.executeBonus && tgt.hp / tgt.maxHp <= opt.executeBonus.hp) dmg *= (1 + opt.executeBonus.val);
    if (tgt.broken) dmg *= 1.35;
    if (tgt.guard) dmg *= .82;   // 방어력 1.5배 · 받는 피해 30% 감소와 합쳐 약 50% 경감
    // 치명타
    let crit = false;
    if (opt.alwaysCrit || (opt.critIfBroken && tgt.broken)) crit = true;
    else crit = Math.random() < pCrit(src);
    if (crit) {
      let cd = pCdmg(src);
      const cp = hasPassive(src, 'cdmgVsBroken');
      if (cp && tgt.broken) cd += cp.val;
      dmg *= (1 + cd);
    }
    dmg *= Util.rand(.96, 1.04);
    return { dmg: Math.max(1, Math.round(dmg)), crit };
  }

  /** 실제 HP 적용 (보호막 → HP) */
  function applyDamage(tgt, amount, opt) {
    opt = opt || {};
    let left = Math.max(0, Math.round(amount));
    // 보호막 흡수
    for (const b of tgt.buffs) {
      if (b.kind !== 'shield' || left <= 0) continue;
      const use = Math.min(b.val, left);
      b.val -= use; left -= use;
    }
    removeBuffs(tgt, b => b.kind === 'shield' && b.val <= 0);
    tgt.hp = clamp(tgt.hp - left, 0, tgt.maxHp);
    if (tgt.hp <= 0 && tgt.alive) killUnit(tgt, opt.src);
    return left;
  }
  function healUnit(tgt, amount) {
    if (!tgt.alive) return 0;
    const before = tgt.hp;
    tgt.hp = clamp(tgt.hp + Math.round(amount), 0, tgt.maxHp);
    return tgt.hp - before;
  }
  function killUnit(u, src) {
    u.alive = false; u.hp = 0; u.buffs.length = 0; u.broken = false; u.breakTurns = 0;
    log(u.name + ' 격파!');
    if (u.side === 'ally') {
      B.allyDown = true;
      // 아군 사망 시 남은 아군 필살기 게이지 상승
      B.allies.forEach(a => { if (a.alive) gainUlt(a, 15); });
    } else if (src && src.side === 'ally') {
      gainUlt(src, 12);
      const kp = hasPassive(src, 'killAtk');
      if (kp) addBuff(src, { kind: 'buff', stat: 'atk', val: kp.val, turns: 3, name: 'ATK' });
      if (hasDot(u)) { /* 이미 제거됨 */ }
      const dk = hasPassive(src, 'dotKillSp');
      if (dk) addSp(dk.val);
    }
  }

  /* ---------------- 브레이크 ---------------- */
  function breakDamage(src, tgt, amount) {
    if (!tgt || tgt.side !== 'enemy' || tgt.toughMax <= 0 || tgt.broken) return false;
    let mult = 1;
    for (const p of passives(src)) if (p.type === 'breakUp') mult += p.val;
    const dmg = amount * 6.5 * mult;
    tgt.tough = Math.max(0, tgt.tough - dmg);
    if (tgt.tough <= 0) { triggerBreak(src, tgt); return true; }
    return false;
  }
  function triggerBreak(src, tgt) {
    tgt.broken = true;
    tgt.breakTurns = tgt.isBoss ? 1 : 2;
    tgt.av += BASE_AV / pSpd(tgt) * .8;       // 행동 지연
    log('BREAK! ' + tgt.name + '의 자세가 무너졌다');
    AudioSystem.sfx('brk');
    FX.shake('m');
    const el = BattleUI.unitEl(tgt);
    if (el) {
      FX.shock(el, '#ffd166'); FX.particles(el, '#ffe9a8', 16);
      BattleUI.showBreakTag(tgt);
    }
    // 브레이크 추가 피해
    const extra = Math.round(pAtk(src) * .8);
    applyDamage(tgt, extra, { src });
    if (el) FX.damageNumber(el, extra, { crit: false });
    if (B) B.event('break');
  }
  function recoverBreak(u) {
    u.broken = false; u.breakTurns = 0; u.tough = u.toughMax;
    log(u.name + '이(가) 자세를 회복했다');
  }

  /* ---------------- SP / 필살기 게이지 ---------------- */
  function addSp(n) { if (!B) return; B.sp = clamp(B.sp + n, 0, SP_MAX); }
  function gainUlt(u, n) {
    if (!u || !u.alive || u.side !== 'ally') return;
    let v = n;
    const p = hasPassive(u, 'ultGain');
    if (p) v *= (1 + p.val);
    u.ult = clamp(u.ult + v, 0, 100);
  }
  const ultReady = u => u.side === 'ally' && u.alive && u.ult >= 100 && !!u.ultDef;

  /* ---------------- 로그 ---------------- */
  function log(msg) { if (!B) return; B.log.push(msg); if (B.log.length > 5) B.log.shift(); BattleUI.renderLog(); }

  /* ---------------- 행동 순서 (Action Value) ---------------- */
  function allUnits() { return B ? B.allies.concat(B.enemies) : []; }
  const aliveAllies = () => B ? B.allies.filter(u => u.alive) : [];
  const aliveEnemies = () => B ? B.enemies.filter(u => u.alive) : [];
  function resetAv(u) { u.av = BASE_AV / pSpd(u); }

  function advanceTimeline() {
    const list = allUnits().filter(u => u.alive);
    if (!list.length) return null;
    let min = Infinity, actor = null;
    for (const u of list) if (u.av < min - 1e-9) { min = u.av; actor = u; }
    if (!actor) return null;
    if (min > 0) for (const u of list) u.av = Math.max(0, u.av - min);
    resetAv(actor);
    return actor;
  }
  /** 다음 N명의 행동 순서 예측 */
  function previewOrder(n) {
    if (!B) return [];
    const sim = allUnits().filter(u => u.alive).map(u => ({ u, av: u.av, step: BASE_AV / pSpd(u) }));
    const out = [];
    for (let i = 0; i < n && sim.length; i++) {
      let best = sim[0];
      for (const s of sim) if (s.av < best.av) best = s;
      const d = best.av;
      for (const s of sim) s.av -= d;
      out.push(best.u);
      best.av = best.step;
    }
    return out;
  }

  /* ---------------- 타겟 해석 ---------------- */
  function opponents(u) { return u.side === 'ally' ? aliveEnemies() : aliveAllies(); }
  function mates(u) { return u.side === 'ally' ? aliveAllies() : aliveEnemies(); }
  function resolveTargets(actor, skill, chosen) {
    const t = skill.target || 'enemy';
    if (t === 'self') return [actor];
    if (t === 'enemyAll') return opponents(actor);
    if (t === 'allyAll') return mates(actor);
    if (t === 'ally') return chosen && chosen.alive ? [chosen] : [mates(actor)[0]].filter(Boolean);
    return chosen && chosen.alive ? [chosen] : [opponents(actor)[0]].filter(Boolean);
  }
  function needsTarget(skill) {
    const t = skill.target || 'enemy';
    return t === 'enemy' || t === 'ally';
  }
  function effTargets(actor, to, hitTargets) {
    switch (to) {
      case 'self': return [actor];
      case 'allies': return mates(actor);
      case 'enemies': return opponents(actor);
      case 'allyRandom': {
        const pool = mates(actor).filter(u => u !== actor);
        return pool.length ? [Util.pick(pool)] : [actor];
      }
      case 'allyBest': {
        const pool = mates(actor).filter(u => u !== actor);
        if (!pool.length) return [actor];
        return [pool.reduce((a, b) => pAtk(b) > pAtk(a) ? b : a)];
      }
      default: return hitTargets || [];
    }
  }

  /* ---------------- 효과 적용 ---------------- */
  const STAT_LABEL = { atk: 'ATK', def: 'DEF', spd: 'SPD', crit: 'CRIT', cdmg: 'C.DMG', dmg: 'DMG', taken: '피해▲', takenD: '피해▼' };
  function applyEffects(actor, eff, hitTargets) {
    for (const e of (eff || [])) {
      const targets = effTargets(actor, e.to, hitTargets);
      for (const t of targets) {
        if (!t) continue;
        if (e.k !== 'revive' && !t.alive) continue;
        if (e.chance !== undefined && Math.random() > e.chance) continue;
        Util.safe(() => applyOne(actor, t, e), 'eff:' + e.k);
      }
    }
  }
  function applyOne(actor, t, e) {
    const el = BattleUI.unitEl(t);
    switch (e.k) {
      case 'buff':
        addBuff(t, { kind: e.stat === 'takenD' ? 'buff' : 'buff', stat: e.stat, val: e.val, turns: e.turns, name: STAT_LABEL[e.stat] || e.stat });
        if (el) FX.textPop(el, (STAT_LABEL[e.stat] || e.stat) + '▲', '#8df7b5');
        AudioSystem.sfx('buff'); break;
      case 'debuff':
        addBuff(t, { kind: 'debuff', stat: e.stat, val: e.val, turns: e.turns, name: STAT_LABEL[e.stat] || e.stat });
        if (el) FX.textPop(el, (STAT_LABEL[e.stat] || e.stat) + '▼', '#ffb0c0');
        AudioSystem.sfx('debuff'); break;
      case 'heal': {
        const amt = e.base === 'maxhp' ? t.maxHp * e.val : pAtk(actor) * e.val;
        const done = healUnit(t, amt);
        if (done > 0 && el) { FX.damageNumber(el, done, { heal: true }); FX.play('heal', el); }
        const hg = hasPassive(actor, 'healGuard');
        if (hg) addBuff(t, { kind: 'buff', stat: 'takenD', val: hg.val, turns: 1, name: '피해▼' });
        AudioSystem.sfx('heal'); break;
      }
      case 'dot': {
        let per = pAtk(actor) * e.val;
        const dp = hasPassive(actor, 'dotPower');
        if (dp) per *= (1 + dp.val);
        addBuff(t, { kind: 'dot', stat: 'dot', val: Math.round(per), turns: e.turns, name: 'DOT' });
        if (el) FX.textPop(el, 'DOT', '#ff9ad0');
        break;
      }
      case 'regen': addBuff(t, { kind: 'regen', stat: 'regen', val: e.val, turns: e.turns, name: 'REGEN' }); break;
      case 'shield': {
        addBuff(t, { kind: 'shield', stat: 'shield', val: Math.round(pAtk(actor) * e.val), turns: e.turns, name: 'SHIELD' });
        if (el) { FX.ring(el, '#59e7ff'); FX.textPop(el, 'SHIELD', '#9fe8ff'); }
        break;
      }
      case 'stun':
        if (t.side === 'enemy' && t.isBoss && Math.random() < .35) { if (el) FX.textPop(el, '저항!', '#ffd166'); break; }
        addBuff(t, { kind: 'stun', stat: 'stun', val: 1, turns: e.turns, name: 'STUN' });
        if (el) FX.textPop(el, 'STUN', '#ffd166');
        break;
      case 'delay': t.av += (BASE_AV / pSpd(t)) * e.val; if (el) FX.textPop(el, '지연', '#c0b0ff'); break;
      case 'advance':
        t.av = e.val >= 1 ? 0 : Math.max(0, t.av - (BASE_AV / pSpd(t)) * e.val);
        if (el) FX.textPop(el, '행동 촉진', '#ffe08a');
        break;
      case 'sp': addSp(e.val); break;
      case 'ultGain': gainUlt(t, e.val); break;
      case 'cleanse': {
        const n = removeBuffs(t, b => b.kind === 'debuff' || b.kind === 'dot' || b.kind === 'stun', e.val);
        if (n && el) FX.textPop(el, '정화', '#a7f3d0');
        break;
      }
      case 'dispel': {
        const n = removeBuffs(t, b => b.kind === 'buff' || b.kind === 'shield', e.val);
        if (n && el) FX.textPop(el, '해제', '#d0d0e0');
        break;
      }
      case 'taunt': addBuff(t, { kind: 'taunt', stat: 'taunt', val: 1, turns: e.turns, name: 'TAUNT' }); break;
      case 'revive': {
        const dead = mates(actor).length ? null : null;
        const pool = (actor.side === 'ally' ? B.allies : B.enemies).filter(u => !u.alive);
        if (!pool.length) break;
        const target = pool[0];
        target.alive = true;
        target.hp = Math.max(1, Math.round(target.maxHp * e.val));
        target.buffs.length = 0; target.av = BASE_AV / pSpd(target) * .5;
        log(target.name + ' 부활!');
        BattleUI.renderUnits();
        const rel = BattleUI.unitEl(target);
        if (rel) { FX.ring(rel, '#4ade80'); FX.textPop(rel, 'REVIVE', '#8df7b5'); }
        break;
      }
      default: break;
    }
  }

  /* ---------------- 행동 실행 ---------------- */
  async function performAttack(actor, target) {
    const sp = { power: 1.0, hits: 1, brk: 1, fx: actor.isCurse ? 'curse' : 'slash', name: '공격' };
    await runOffense(actor, sp, [target]);
    addSp(1); gainUlt(actor, 15);
  }
  async function performSkill(actor, skill, targets, slotIdx) {
    const mult = actor.side === 'ally' ? CharacterSystem.skillMult(actor.sklv[slotIdx]) : 1;
    const sp = Object.assign({}, skill, { power: (skill.power || 0) * mult, name: skill.name });
    if (actor.side === 'ally') { addSp(-(skill.cost || 0)); gainUlt(actor, 17 + (skill.cost || 0) * 2); }
    await runOffense(actor, sp, targets);
  }
  async function performUlt(actor) {
    const u = actor.ultDef; if (!u) return;
    const slot = actor.skills.length;
    const mult = CharacterSystem.skillMult(actor.sklv[slot]);
    actor.ult = 0;
    B.event('ult');
    if (u.domain) await FX.domainExpansion(actor.def, u.name, u.domainColors);
    else await FX.cutin(actor.def, u.name, actor.name);
    const sp = Object.assign({}, u, { power: (u.power || 0) * mult, isUlt: true });
    const targets = resolveTargets(actor, u, B.ultTarget || opponents(actor)[0]);
    await runOffense(actor, sp, targets);
    const p = hasPassive(actor, 'ultSp');
    if (p) addSp(p.val);
  }
  async function performGuard(actor) {
    actor.guard = true;
    addBuff(actor, { kind: 'buff', stat: 'takenD', val: .3, turns: 1, name: '피해▼', guardTag: true });
    addBuff(actor, { kind: 'buff', stat: 'guard', val: 1, turns: 1, name: 'GUARD', guardTag: true });
    const gp = hasPassive(actor, 'guardTeam');
    if (gp) mates(actor).forEach(m => addBuff(m, { kind: 'buff', stat: 'def', val: gp.val, turns: 1, name: 'DEF' }));
    if (actor.side === 'ally') { addSp(1); gainUlt(actor, 12); }
    log(actor.name + ' 방어 태세');
    AudioSystem.sfx('guard');
    const el = BattleUI.unitEl(actor);
    if (el) { el.classList.add('guard'); FX.ring(el, '#4ea8ff'); }
    BattleUI.renderAll();
    await sleep(420 / (GameState.settings().speed || 1));
  }

  /** 공격/스킬 공통 처리 */
  async function runOffense(actor, sp, targets) {
    const spd = GameState.settings().speed || 1;
    targets = (targets || []).filter(t => t && t.alive);
    const isSupport = (sp.power || 0) <= 0;
    if (!targets.length && !isSupport) { return; }
    log(actor.name + ' ▸ ' + (sp.name || '행동'));
    const aEl = BattleUI.unitEl(actor);
    if (aEl && !isSupport) {
      aEl.classList.add('attack-move');
      FX.afterimage(aEl, FX.colorOf(sp.fx));
      setTimeout(() => aEl.classList.remove('attack-move'), 460);
    }
    await sleep(220 / spd);
    if (sp.isUlt) { FX.zoom(); FX.shake('l'); }

    const hits = Math.max(1, sp.hits || 1);
    let totalDamage = 0;
    for (let h = 0; h < hits; h++) {
      for (const t of targets) {
        if (!t.alive) continue;
        const tEl = BattleUI.unitEl(t);
        if ((sp.power || 0) > 0) {
          const r = calcDamage(actor, t, sp.power, sp);
          const dealt = applyDamage(t, r.dmg, { src: actor });
          totalDamage += dealt;
          B.totalDamage += dealt;
          if (tEl) {
            FX.play(sp.fx || 'slash', tEl);
            FX.damageNumber(tEl, r.dmg, { crit: r.crit });
            tEl.classList.remove('hit'); void tEl.offsetWidth; tEl.classList.add('hit');
            setTimeout(() => tEl && tEl.classList.remove('hit'), 380);
          }
          AudioSystem.sfx(r.crit ? 'crit' : 'hit');
          if (r.crit) {
            const cu = hasPassive(actor, 'critUlt'); if (cu) gainUlt(actor, cu.val);
            const ch = hasPassive(actor, 'critHeal'); if (ch) healUnit(actor, actor.maxHp * ch.val);
          }
          // 피격측 게이지 상승
          if (t.side === 'ally' && t.alive) gainUlt(t, 8);
          if (sp.brk) breakDamage(actor, t, sp.brk);
          FX.shake(sp.isUlt ? 'l' : (sp.power >= 1.8 ? 'm' : 's'));
        } else if (tEl) {
          FX.play(sp.fx || 'buff', tEl);
        }
      }
      BattleUI.renderAll();
      if (h < hits - 1) await sleep(170 / spd);
    }
    // 무작위 추가 효과 (게토 주령 소환 등)
    let effList = sp.eff || [];
    if (sp.randomEff) {
      const roll = Util.pick([
        DB.E('debuff', { stat: 'def', val: .2, turns: 2 }),
        DB.E('debuff', { stat: 'spd', val: .2, turns: 2 }),
        DB.E('dot', { val: .5, turns: 2 }),
        DB.E('buff', { stat: 'atk', val: .2, turns: 2, to: 'allies' }),
      ]);
      effList = effList.concat([roll]);
    }
    applyEffects(actor, effList, targets);
    BattleUI.renderAll();
    await sleep((sp.isUlt ? 520 : 320) / spd);
    return totalDamage;
  }

  /* ---------------- 턴 처리 ---------------- */
  async function startOfTurn(u) {
    const spd = GameState.settings().speed || 1;
    u.guard = false;                       // 방어는 자신의 다음 턴 시작에 해제
    removeBuffs(u, b => b.guardTag);
    const el = BattleUI.unitEl(u);
    if (el) el.classList.remove('guard');
    // 지속 피해
    let dot = 0;
    for (const b of u.buffs) if (b.kind === 'dot') dot += b.val;
    if (dot > 0) {
      applyDamage(u, dot, {});
      if (el) { FX.damageNumber(el, Math.round(dot), {}); FX.play('curse', el); }
      BattleUI.renderAll();
      await sleep(260 / spd);
    }
    if (!u.alive) return false;
    // 재생
    let regen = 0;
    for (const b of u.buffs) if (b.kind === 'regen') regen += u.maxHp * b.val;
    const rp = hasPassive(u, 'regen');
    if (rp) regen += u.maxHp * rp.val;
    if (regen > 0) {
      const done = healUnit(u, regen);
      if (done > 0 && el) FX.damageNumber(el, done, { heal: true });
      BattleUI.renderAll();
    }
    // 브레이크 회복 처리
    if (u.broken) {
      u.breakTurns = Math.max(0, u.breakTurns - 1);
      if (u.breakTurns <= 0) recoverBreak(u);
    }
    return true;
  }

  async function nextTurn() {
    if (!B || B.ended) return;
    B.actionCount++;
    if (B.actionCount > MAX_ACTIONS) { log('전투가 너무 길어졌다...'); return end(false); }
    if (!aliveEnemies().length) return onWaveCleared();
    if (!aliveAllies().length) return end(false);

    const actor = advanceTimeline();
    if (!actor) return end(false);
    B.current = actor;
    B.turnCount++;
    BattleUI.renderAll();

    const ok = await startOfTurn(actor);
    if (!B || B.ended) return;
    if (!ok || !actor.alive) return finishTurn(actor);
    if (!aliveEnemies().length) return onWaveCleared();
    if (!aliveAllies().length) return end(false);

    if (isStunned(actor)) {
      log(actor.name + ' 행동 불가');
      const el = BattleUI.unitEl(actor);
      if (el) FX.textPop(el, '행동 불가', '#ffd166');
      await sleep(520 / (GameState.settings().speed || 1));
      return finishTurn(actor);
    }
    if (actor.side === 'ally') {
      // 아군 행동 시 토도 패시브
      for (const m of aliveAllies()) {
        const p = hasPassive(m, 'allyActUlt');
        if (p && m !== actor) gainUlt(m, p.val);
      }
      setState('PLAYER_TURN');
      BattleUI.renderAll();
      B.event('playerTurn');
    } else {
      setState('ENEMY_TURN');
      BattleUI.renderAll();
      await sleep(460 / (GameState.settings().speed || 1));
      await enemyAct(actor);
      if (!B || B.ended) return;
      finishTurn(actor);
    }
  }

  async function finishTurn(actor) {
    if (!B || B.ended) return;
    tickBuffs(actor);
    BattleUI.renderAll();
    if (!aliveEnemies().length) return onWaveCleared();
    if (!aliveAllies().length) return end(false);
    await sleep(120 / (GameState.settings().speed || 1));
    nextTurn();
  }

  /* ---------------- 적 AI ---------------- */
  const isHeal = s => (s.eff || []).some(e => e.k === 'heal' && (e.to === 'self' || !e.to || e.to === 'target'));
  function pickEnemyTarget(actor, skill) {
    const pool = aliveAllies();
    if (!pool.length) return null;
    const taunt = pool.find(u => u.buffs.some(b => b.kind === 'taunt'));
    if (taunt) return taunt;
    const entries = pool.map(u => {
      let w = 10;
      const hpR = u.hp / u.maxHp;
      w += (1 - hpR) * 26;                        // 약한 대상 우선
      if (hpR < .3) w += 20;                      // 마무리 가능
      if (u.role === 'sup') w += 8;               // 힐러 견제
      if (u.role === 'tank') w -= 5;
      if (pDef(u) < pDef(pool[0]) * .8) w += 4;
      if (ultReady(u)) w += 10;                   // 필살기 준비된 위협 제거
      return { v: u, w: Math.max(1, w) };
    });
    return Util.weighted(entries);
  }
  function chooseEnemySkill(actor) {
    const skills = actor.skills || [];
    if (!skills.length) return null;
    if (actor.pattern && actor.pattern.length) {
      let sid = actor.pattern[actor.patternIdx % actor.pattern.length];
      actor.patternIdx++;
      let sk = skills.find(s => s.id === sid) || skills[0];
      if (isHeal(sk) && actor.hp / actor.maxHp > .72) {
        sk = skills.find(s => !isHeal(s) && (s.power || 0) > 0) || sk;
      }
      return sk;
    }
    const allies = aliveAllies();
    const cand = skills.map(s => {
      let w = 10;
      if (isHeal(s)) w = actor.hp / actor.maxHp < .45 ? 65 : 1;
      if (s.target === 'enemyAll') w += allies.length >= 3 ? 16 : 2;
      if ((s.eff || []).some(e => e.k === 'stun')) w += 8;
      if ((s.power || 0) >= 1.3) w += allies.some(a => a.hp / a.maxHp < .4) ? 16 : 6;
      if ((s.eff || []).some(e => e.k === 'buff') && actor.buffs.some(b => b.kind === 'buff')) w = 2;
      return { v: s, w };
    });
    return Util.weighted(cand);
  }
  /** 보스의 다음 행동 예고 */
  function nextEnemyIntent(u) {
    if (!u.pattern || !u.pattern.length) return null;
    const sid = u.pattern[u.patternIdx % u.pattern.length];
    const sk = (u.skills || []).find(s => s.id === sid);
    return sk ? sk : null;
  }
  async function enemyAct(actor) {
    const skill = chooseEnemySkill(actor);
    if (!skill) return;
    let targets;
    const t = skill.target || 'enemy';
    if (t === 'self') targets = [actor];
    else if (t === 'allyAll') targets = mates(actor);
    else if (t === 'enemyAll') targets = aliveAllies();
    else targets = [pickEnemyTarget(actor, skill)].filter(Boolean);
    if (skill.domain) await FX.domainExpansion(actor.def, skill.name, ['#e0324a', '#2a0410']);
    await runOffense(actor, skill, targets);
  }

  /* ---------------- 플레이어 커맨드 ---------------- */
  function setState(s) { if (!B) return; B.state = s; BattleUI.setState(s); }
  function canAct() {
    return !!(B && !B.ended && !B.busy && B.current && B.current.side === 'ally' && B.current.alive &&
      (B.state === 'PLAYER_TURN' || B.state === 'SKILL_SELECT' || B.state === 'TARGET_SELECT'));
  }
  function inputLocked() { return !B || B.busy || B.ended || B.state === 'ANIMATION' || B.state === 'ENEMY_TURN'; }

  /** 모든 플레이어 행동은 이 래퍼를 통해서만 실행 (중복 입력 차단) */
  async function execute(actor, fn) {
    if (!B || B.busy || B.ended) return;
    B.busy = true;
    setState('ANIMATION');
    BattleUI.closeSkillSheet();
    BattleUI.clearTargetMode();
    B.pending = null;
    try { await fn(); } catch (err) { console.warn('[action]', err); }
    B.busy = false;
    if (!B || B.ended) return;
    finishTurn(actor);
  }

  function cmdAttack() {
    if (!canAct() || B.state === 'ANIMATION') return;
    const actor = B.current;
    const foes = opponents(actor);
    if (!foes.length) return;
    B.pending = { type: 'attack' };
    if (foes.length === 1) return selectTarget(foes[0]);
    setState('TARGET_SELECT');
    BattleUI.enterTargetMode('enemy', '공격할 대상을 선택하세요');
  }
  function cmdSkills() {
    if (!canAct() || B.state === 'ANIMATION') return;
    if (B.state === 'SKILL_SELECT') { setState('PLAYER_TURN'); BattleUI.closeSkillSheet(); return; }
    setState('SKILL_SELECT');
    BattleUI.openSkillSheet(B.current);
  }
  function chooseSkill(idx) {
    if (!canAct()) return;
    const actor = B.current;
    const skill = actor.skills[idx];
    if (!skill) return;
    if ((skill.cost || 0) > B.sp) { UI.toast('주력(SP)이 부족합니다', 'bad'); AudioSystem.sfx('error'); return; }
    B.pending = { type: 'skill', skill, idx };
    B.event('skill');
    if (!needsTarget(skill)) {
      return execute(actor, () => performSkill(actor, skill, resolveTargets(actor, skill, null), idx));
    }
    const side = skill.target === 'ally' ? 'ally' : 'enemy';
    const pool = side === 'ally' ? mates(actor) : opponents(actor);
    if (!pool.length) return;
    if (pool.length === 1) return selectTarget(pool[0]);
    setState('TARGET_SELECT');
    BattleUI.closeSkillSheet();
    BattleUI.enterTargetMode(side, skill.name + ' · 대상 선택');
  }
  function cmdGuard() {
    if (!canAct() || B.state === 'ANIMATION') return;
    const actor = B.current;
    B.event('guard');
    execute(actor, () => performGuard(actor));
  }
  function cmdUlt() {
    if (!canAct() || B.state === 'ANIMATION') return;
    const actor = B.current;
    if (!ultReady(actor)) { UI.toast('필살기 게이지가 부족합니다', 'bad'); AudioSystem.sfx('error'); return; }
    const u = actor.ultDef;
    if (needsTarget(u)) {
      const pool = u.target === 'ally' ? mates(actor) : opponents(actor);
      if (!pool.length) return;
      B.pending = { type: 'ult' };
      if (pool.length === 1) return selectTarget(pool[0]);
      setState('TARGET_SELECT');
      BattleUI.enterTargetMode(u.target === 'ally' ? 'ally' : 'enemy', u.name + ' · 대상 선택');
      return;
    }
    B.ultTarget = null;
    execute(actor, () => performUlt(actor));
  }
  function selectTarget(unit) {
    if (!canAct() || !unit || !unit.alive) return;
    const actor = B.current, p = B.pending;
    if (!p) return;
    if (p.type === 'attack') return execute(actor, () => performAttack(actor, unit));
    if (p.type === 'skill') return execute(actor, () => performSkill(actor, p.skill, resolveTargets(actor, p.skill, unit), p.idx));
    if (p.type === 'ult') { B.ultTarget = unit; return execute(actor, () => performUlt(actor)); }
  }
  function cancel() {
    if (!B || B.busy || B.ended) return;
    B.pending = null; B.ultTarget = null;
    BattleUI.clearTargetMode();
    BattleUI.closeSkillSheet();
    if (B.current && B.current.side === 'ally' && B.current.alive) setState('PLAYER_TURN');
  }

  /* ---------------- 웨이브 / 종료 ---------------- */
  function spawnWave() {
    const wave = B.waves[B.waveIdx] || [];
    B.enemies = wave.map((id, i) => enemyUnit(id, B.stage.lv, i)).filter(Boolean);
    B.enemies.forEach(e => { e.av = BASE_AV / pSpd(e) * Util.rand(.95, 1.08); });
    BattleUI.renderUnits();
    BattleUI.renderAll();
  }
  async function onWaveCleared() {
    if (!B || B.ended) return;
    if (B.waveIdx + 1 < B.waves.length) {
      B.waveIdx++;
      log('적 증원 출현!');
      await sleep(600 / (GameState.settings().speed || 1));
      spawnWave();
      FX.flash('violet');
      await sleep(300 / (GameState.settings().speed || 1));
      return nextTurn();
    }
    return end(true);
  }
  function end(win) {
    if (!B || B.ended) return;
    B.ended = true;
    B.busy = false;
    setState(win ? 'VICTORY' : 'DEFEAT');
    BattleUI.clearTargetMode();
    BattleUI.closeSkillSheet();
    BattleUI.renderAll();
    AudioSystem.sfx(win ? 'win' : 'lose');
    B.event(win ? 'victory' : 'defeat');
    const cb = B.onEnd;
    setTimeout(() => Util.safe(() => cb && cb(win, B), 'battle-end'), 700);
  }
  function retreat() { if (B && !B.ended) end(false); }

  /* ---------------- 시작 ---------------- */
  function start(stageId, opts) {
    opts = opts || {};
    const stage = DB.STAGE_MAP[stageId];
    if (!stage) return false;
    const ids = GameState.party();
    if (!ids.length) { UI.toast('부대를 편성해 주세요', 'bad'); return false; }
    FX.clear();
    B = {
      stage, waves: stage.waves, waveIdx: 0,
      allies: ids.map(allyUnit).filter(Boolean),
      enemies: [],
      sp: 3, spMax: SP_MAX,
      state: 'INIT', busy: false, ended: false,
      log: [], actionCount: 0, turnCount: 0, totalDamage: 0,
      pending: null, current: null, ultTarget: null, allyDown: false,
      onEnd: opts.onEnd || null,
      tutorial: !!opts.tutorial,
      event: name => Util.safe(() => opts.onEvent && opts.onEvent(name), 'battle-event'),
    };
    if (!B.allies.length) return false;
    B.allies.forEach(a => {
      a.av = BASE_AV / pSpd(a);
      const p = hasPassive(a, 'startUlt');
      if (p) a.ult = clamp(p.val, 0, 100);
    });
    spawnWave();
    FX.spawnOrbs(14);
    log(stage.name + ' 전투 개시');
    setTimeout(() => nextTurn(), 420);
    return true;
  }

  return {
    start, retreat, cmdAttack, cmdSkills, cmdGuard, cmdUlt, chooseSkill, selectTarget, cancel,
    get: () => B, canAct, inputLocked, previewOrder, ultReady, isStunned, nextEnemyIntent,
    __calc: calcDamage,
    pAtk, pDef, pSpd, pCrit, aliveAllies, aliveEnemies, SP_MAX,
  };
})();

/* =====================================================================
 * INPUT — Pointer Events 통합 (중복 입력 방지)
 * ===================================================================== */
function onTap(el, fn) {
  if (!el) return;
  let down = false, sx = 0, sy = 0, last = 0;
  const guard = e => {
    const now = Date.now();
    if (now - last < 230) return false;
    last = now; return true;
  };
  if (window.PointerEvent) {
    el.addEventListener('pointerdown', e => { down = true; sx = e.clientX; sy = e.clientY; }, { passive: true });
    el.addEventListener('pointercancel', () => { down = false; }, { passive: true });
    el.addEventListener('pointerleave', () => { down = false; }, { passive: true });
    el.addEventListener('pointerup', e => {
      if (!down) return; down = false;
      if (Math.abs(e.clientX - sx) > 16 || Math.abs(e.clientY - sy) > 16) return;
      if (!guard(e)) return;
      Util.safe(() => fn(e), 'tap');
    });
  } else {
    el.addEventListener('click', e => { if (!guard(e)) return; Util.safe(() => fn(e), 'tap'); });
  }
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (!guard(e)) return; Util.safe(() => fn(e), 'tap-key'); }
  });
}

/* =====================================================================
 * BATTLE UI
 * ===================================================================== */
const BattleUI = (() => {
  const reg = new Map();          // uid -> {root, hpFill, hpText, brkFill, st, card...}
  let lastCmdKey = '', targetMode = null, hintEl = null;

  const B = () => BattleSystem.get();
  function unitEl(u) { const r = u && reg.get(u.uid); return r ? r.root : null; }

  /* --- 유닛 DOM 생성 --- */
  function renderUnits() {
    const b = B(); if (!b) return;
    reg.clear(); lastTlKey = '';
    const eLine = $('#enemy-line'), aLine = $('#ally-line');
    if (!eLine || !aLine) return;
    eLine.innerHTML = ''; aLine.innerHTML = '';
    b.enemies.forEach(u => eLine.appendChild(buildUnit(u)));
    b.allies.forEach(u => aLine.appendChild(buildUnit(u)));
    renderPartyCards();
  }
  function buildUnit(u) {
    const root = Util.el('div', 'unit ' + u.side + (u.isBoss ? ' boss' : ''));
    root.dataset.uid = u.uid;
    root.setAttribute('role', 'button');
    root.setAttribute('tabindex', '0');
    root.setAttribute('aria-label', u.name);
    const art = Util.el('div', 'u-art');
    art.innerHTML = Art.art(u.def, { bare: true });
    const bars = Util.el('div', 'u-bars');
    bars.innerHTML =
      '<div class="u-name"></div>' +
      (u.isBoss ? '<div class="u-intent"></div>' : '') +
      '<div class="bar hp' + (u.side === 'ally' ? ' ally' : '') + '"><i></i></div>' +
      (u.side === 'enemy' ? '<div class="bar brk"><i></i></div>' : '') +
      '<div class="st-icons"></div>';
    root.appendChild(art); root.appendChild(bars);
    onTap(root, () => {
      if (targetMode && targetMode.side === u.side && u.alive) BattleSystem.selectTarget(u);
    });
    reg.set(u.uid, {
      root, art,
      name: bars.querySelector('.u-name'),
      intent: bars.querySelector('.u-intent'),
      hp: bars.querySelector('.bar.hp > i'),
      brkBar: bars.querySelector('.bar.brk'),
      brk: bars.querySelector('.bar.brk > i'),
      st: bars.querySelector('.st-icons'),
    });
    return root;
  }

  /* --- 상태 아이콘 --- */
  function statusHtml(u) {
    let h = '';
    const seen = [];
    for (const bf of u.buffs) {
      let cls = 'buff', label = bf.name || '';
      if (bf.kind === 'debuff' || bf.kind === 'dot') cls = 'debuff';
      if (bf.kind === 'stun' || bf.kind === 'taunt') cls = 'ctrl';
      if (bf.kind === 'shield') { cls = 'buff'; label = 'SHD'; }
      if (bf.kind === 'regen') { cls = 'buff'; label = 'REG'; }
      if (bf.kind === 'dot') label = 'DOT';
      if (bf.kind === 'stun') label = 'STUN';
      if (bf.kind === 'taunt') label = 'TAUNT';
      if (!label) continue;
      if (seen.length >= 6) break;
      seen.push(label);
      h += '<span class="st-ic ' + cls + '">' + esc(label) + '<b>' + Math.max(0, bf.turns) + '</b></span>';
    }
    if (u.broken) h = '<span class="st-ic ctrl">BREAK<b>' + Math.max(0, u.breakTurns) + '</b></span>' + h;
    return h;
  }

  /* --- 전체 갱신 --- */
  function renderAll() {
    const b = B(); if (!b) return;
    Util.safe(() => {
      for (const u of b.allies.concat(b.enemies)) {
        const r = reg.get(u.uid); if (!r) continue;
        r.root.classList.toggle('dead', !u.alive);
        r.root.classList.toggle('acting', b.current === u && u.alive && !b.ended);
        const hpR = clamp(u.hp / u.maxHp, 0, 1) * 100;
        r.hp.style.width = hpR + '%';
        r.name.textContent = u.name;
        if (r.intent) {
          const intent = u.alive ? BattleSystem.nextEnemyIntent(u) : null;
          r.intent.textContent = intent ? '다음 ▶ ' + intent.name : '';
          r.intent.style.display = intent ? '' : 'none';
        }
        if (r.brkBar) {
          const t = u.toughMax > 0 ? clamp(u.tough / u.toughMax, 0, 1) * 100 : 0;
          r.brk.style.width = t + '%';
          r.brkBar.classList.toggle('broken', !!u.broken);
        }
        r.st.innerHTML = statusHtml(u);
      }
      renderPartyCards();
      renderTimeline();
      renderSp();
      renderCommands();
      renderTop();
    }, 'renderAll');
  }

  /* --- 아군 카드 --- */
  function renderPartyCards() {
    const b = B(); if (!b) return;
    const wrap = $('#bt-party'); if (!wrap) return;
    if (wrap.children.length !== b.allies.length) {
      wrap.innerHTML = '';
      b.allies.forEach(u => {
        const c = Util.el('div', 'ally-card');
        c.dataset.uid = u.uid;
        c.innerHTML =
          '<div class="ac-top"><div class="ac-p">' + Art.art(u.def) + '</div>' +
          '<div style="min-width:0;flex:1"><div class="ac-n"></div><div class="ac-hp"></div></div></div>' +
          '<div class="bar hp ally"><i></i></div>' +
          '<div class="ult-bar"><i></i></div>';
        onTap(c, () => {
          if (targetMode && targetMode.side === 'ally' && u.alive) BattleSystem.selectTarget(u);
        });
        wrap.appendChild(c);
      });
    }
    b.allies.forEach((u, i) => {
      const c = wrap.children[i]; if (!c) return;
      const ready = BattleSystem.ultReady(u);
      c.classList.toggle('active', b.current === u && !b.ended);
      c.classList.toggle('dead', !u.alive);
      c.classList.toggle('ultready', ready);
      c.querySelector('.ac-n').textContent = u.name;
      c.querySelector('.ac-hp').textContent = Math.ceil(u.hp) + '/' + u.maxHp;
      c.querySelector('.bar.hp > i').style.width = (clamp(u.hp / u.maxHp, 0, 1) * 100) + '%';
      const ub = c.querySelector('.ult-bar');
      ub.classList.toggle('full', ready);
      ub.querySelector('i').style.width = clamp(u.ult, 0, 100) + '%';
    });
  }

  /* --- 행동 순서 --- */
  let lastTlKey = '';
  function renderTimeline() {
    const b = B(); if (!b) return;
    const wrap = $('#timeline'); if (!wrap) return;
    const order = BattleSystem.previewOrder(6);
    const key = order.map(u => u.uid).join(',');
    if (key === lastTlKey) return;          // 순서가 그대로면 DOM 재생성 생략
    lastTlKey = key;
    let h = '<div class="tl-label">행동 순서</div>';
    order.forEach((u, i) => {
      h += '<div class="tl-item ' + (u.side === 'enemy' ? 'enemy' : '') + (i === 0 ? ' first' : '') + '">' +
        '<span class="tl-p">' + Art.art(u.def) + '</span><span class="tl-n">' + esc(u.name) + '</span></div>';
    });
    wrap.innerHTML = h;
  }

  /* --- SP --- */
  function renderSp() {
    const b = B(); if (!b) return;
    const wrap = $('#sp-row'); if (!wrap) return;
    let h = '<span class="sp-label">주력</span>';
    for (let i = 0; i < b.spMax; i++) h += '<span class="sp-pip' + (i < b.sp ? ' on' : '') + '"></span>';
    h += '<span class="sp-label">' + b.sp + '/' + b.spMax + '</span>';
    wrap.innerHTML = h;
  }

  /* --- 상단 --- */
  function renderTop() {
    const b = B(); if (!b) return;
    const wrap = $('#bt-top'); if (!wrap) return;
    const key = 'top';
    if (wrap.dataset.built !== key) {
      wrap.dataset.built = key;
      wrap.innerHTML =
        '<button class="btn-back" id="bt-menu" aria-label="전투 메뉴">≡</button>' +
        '<div style="min-width:0;flex:1"><div style="font-weight:800;font-size:calc(13px * var(--fs));white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="bt-stagename"></div>' +
        '<div class="tiny muted" id="bt-wave"></div></div>' +
        '<button class="chip" id="bt-speed">속도 x1</button>';
      onTap($('#bt-menu'), () => UI.battleMenu());
      onTap($('#bt-speed'), () => {
        const s = GameState.settings();
        s.speed = s.speed >= 3 ? 1 : s.speed + 1;
        GameState.persist(); AudioSystem.sfx('click'); renderTop();
      });
    }
    const sn = $('#bt-stagename'), wv = $('#bt-wave'), sp = $('#bt-speed');
    if (sn) sn.textContent = b.stage.name + ' (' + b.stage.id + ')';
    if (wv) wv.textContent = '웨이브 ' + (b.waveIdx + 1) + '/' + b.waves.length + ' · Lv.' + b.stage.lv;
    if (sp) sp.textContent = '속도 x' + (GameState.settings().speed || 1);
  }

  /* --- 커맨드 --- */
  function renderCommands() {
    const b = B(); if (!b) return;
    const grid = $('#cmd-grid'); if (!grid) return;
    const actor = b.current;
    const st = b.state;
    const key = [st, actor ? actor.uid : '-', b.sp, actor ? Math.floor(actor.ult) : 0, b.ended].join('|');
    if (key === lastCmdKey) return;
    lastCmdKey = key;
    if (st === 'TARGET_SELECT') {
      grid.style.gridTemplateColumns = '1fr';
      grid.innerHTML = '<button class="cmd-btn ghost" id="cmd-cancel">취소</button>';
      onTap($('#cmd-cancel'), () => { AudioSystem.sfx('back'); BattleSystem.cancel(); });
      return;
    }
    grid.style.gridTemplateColumns = '';
    const playable = st === 'PLAYER_TURN' || st === 'SKILL_SELECT';
    const dis = !playable || !actor || actor.side !== 'ally' || b.ended;
    const ultOk = actor && BattleSystem.ultReady(actor);
    const canSkill = actor && (actor.skills || []).some(s => (s.cost || 0) <= b.sp);
    grid.innerHTML =
      '<button class="cmd-btn atk" id="cmd-atk"' + (dis ? ' disabled' : '') + '>공격</button>' +
      '<button class="cmd-btn skill" id="cmd-skill"' + (dis || !canSkill ? ' disabled' : '') + '>스킬</button>' +
      '<button class="cmd-btn guard" id="cmd-guard"' + (dis ? ' disabled' : '') + '>방어</button>' +
      '<button class="cmd-btn ult' + (ultOk && !dis ? ' ready' : '') + '" id="cmd-ult"' + (dis || !ultOk ? ' disabled' : '') + '>필살기' +
      (actor && actor.side === 'ally' ? '<span class="cb-sub">' + Math.floor(actor.ult) + '%</span>' : '') + '</button>';
    onTap($('#cmd-atk'), () => { AudioSystem.sfx('click'); BattleSystem.cmdAttack(); });
    onTap($('#cmd-skill'), () => { AudioSystem.sfx('click'); BattleSystem.cmdSkills(); });
    onTap($('#cmd-guard'), () => { AudioSystem.sfx('click'); BattleSystem.cmdGuard(); });
    onTap($('#cmd-ult'), () => { AudioSystem.sfx('click'); BattleSystem.cmdUlt(); });
  }

  /* --- 스킬 시트 --- */
  function openSkillSheet(actor) {
    const b = B(); if (!b || !actor) return;
    const sheet = $('#skill-sheet'); if (!sheet) return;
    let h = '<div class="sheet-head"><span class="sh-t">' + esc(actor.name) + ' · 스킬</span>' +
      '<div class="spacer" style="flex:1"></div><button class="btn sm ghost" id="sheet-close">닫기</button></div>';
    actor.skills.forEach((s, i) => {
      const lv = (actor.sklv && actor.sklv[i]) || 1;
      const afford = (s.cost || 0) <= b.sp;
      h += '<button class="skill-btn" data-i="' + i + '"' + (afford ? '' : ' disabled') + '>' +
        '<span class="skill-ic">' + esc(s.icon || '✦') + '</span>' +
        '<span class="skill-meta"><span class="sn">' + esc(s.name) +
        '<span class="cost-pip">SP ' + (s.cost || 0) + '</span><span class="lv-pip">Lv.' + lv + '</span></span>' +
        '<span class="sd">' + esc(s.desc) + '</span></span></button>';
    });
    sheet.innerHTML = h;
    sheet.classList.add('open');
    onTap($('#sheet-close'), () => { AudioSystem.sfx('back'); BattleSystem.cancel(); });
    $$('.skill-btn', sheet).forEach(btn => {
      onTap(btn, () => {
        if (btn.disabled) { AudioSystem.sfx('error'); return; }
        AudioSystem.sfx('click');
        BattleSystem.chooseSkill(parseInt(btn.dataset.i, 10));
      });
    });
  }
  function closeSkillSheet() { const s = $('#skill-sheet'); if (s) s.classList.remove('open'); }

  /* --- 타겟 모드 --- */
  function enterTargetMode(side, hint) {
    targetMode = { side };
    const b = B(); if (!b) return;
    const list = side === 'ally' ? b.allies : b.enemies;
    list.forEach(u => {
      const r = reg.get(u.uid);
      if (r && u.alive) r.root.classList.add('targetable');
    });
    if (side === 'ally') $$('#bt-party .ally-card').forEach((c, i) => {
      if (b.allies[i] && b.allies[i].alive) c.classList.add('targetable');
    });
    showHint(hint || '대상을 선택하세요');
  }
  function clearTargetMode() {
    targetMode = null;
    $$('.unit.targetable').forEach(e => e.classList.remove('targetable'));
    $$('.ally-card.targetable').forEach(e => e.classList.remove('targetable'));
    hideHint();
  }
  function showHint(text) {
    hideHint();
    const st = $('#bt-stage'); if (!st) return;
    hintEl = Util.el('div', 'hint-bar', esc(text));
    st.appendChild(hintEl);
  }
  function hideHint() { if (hintEl && hintEl.parentNode) hintEl.parentNode.removeChild(hintEl); hintEl = null; }

  function setState() { renderCommands(); }

  function renderLog() {
    const b = B(); if (!b) return;
    const wrap = $('#bt-log'); if (!wrap) return;
    wrap.innerHTML = b.log.slice(-4).map(l => '<div class="log-line">' + esc(l) + '</div>').join('');
  }
  function showBreakTag(u) {
    const r = reg.get(u.uid); if (!r) return;
    const tag = Util.el('div', 'brk-tag', 'BREAK');
    r.root.appendChild(tag);
    setTimeout(() => { if (tag.parentNode) tag.parentNode.removeChild(tag); }, 1400);
  }
  function reset() {
    reg.clear(); lastCmdKey = ''; lastTlKey = ''; targetMode = null; hideHint();
    const e = $('#enemy-line'), a = $('#ally-line'), p = $('#bt-party'), l = $('#bt-log');
    if (e) e.innerHTML = ''; if (a) a.innerHTML = ''; if (p) p.innerHTML = ''; if (l) l.innerHTML = '';
    closeSkillSheet();
    const r = $('#result'); if (r) { r.classList.remove('on'); r.innerHTML = ''; }
    const t = $('#tutorial'); if (t) { t.classList.remove('on'); t.innerHTML = ''; }
  }
  return {
    renderUnits, renderAll, renderLog, renderTimeline, renderCommands, unitEl,
    openSkillSheet, closeSkillSheet, enterTargetMode, clearTargetMode, setState, showBreakTag, reset,
  };
})();

/* =====================================================================
 * GACHA SYSTEM — 뽑기 / 천장 / 중복
 * ===================================================================== */
const GachaSystem = (() => {
  const G = DB.GACHA;
  const poolOf = r => DB.CHARS.filter(c => c.rarity === r);

  function rate5At(pity) {
    if (pity >= G.pityMax) return 1;
    if (pity >= G.softPity) return clamp(G.rate5 + (pity - G.softPity + 1) * 0.06, 0, 1);
    return G.rate5;
  }
  function rollOne() {
    const g = GameState.get().gacha;
    g.pity++; g.since4++; g.total++;
    let rarity;
    if (Math.random() < rate5At(g.pity)) rarity = 5;
    else if (g.since4 >= G.guarantee4Every) rarity = 4;
    else if (Math.random() < G.rate4) rarity = 4;
    else rarity = 3;

    let id;
    if (rarity === 5) {
      g.pity = 0; g.since4 = 0;
      if (g.lost5050) { id = G.pickup; g.lost5050 = false; }
      else if (Math.random() < 0.5) { id = G.pickup; }
      else {
        const others = poolOf(5).filter(c => c.id !== G.pickup);
        id = (others.length ? Util.pick(others) : DB.byId(G.pickup)).id;
        g.lost5050 = true;
      }
    } else if (rarity === 4) {
      g.since4 = 0;
      id = Util.pick(poolOf(4)).id;
    } else {
      id = Util.pick(poolOf(3)).id;
    }
    const res = GameState.addChar(id);
    return { id, rarity, dup: !!res.dup, shard: res.shard || 0, jade: res.jade || 0 };
  }
  function pull(count) {
    const cost = count >= 10 ? G.cost10 : G.cost1;
    if (!GameState.canPay({ jade: cost })) return { ok: false, msg: '회주가 부족합니다.' };
    GameState.pay({ jade: cost });
    const out = [];
    for (let i = 0; i < count; i++) out.push(Util.safe(rollOne, 'gacha-roll', { id: poolOf(3)[0].id, rarity: 3, dup: true, shard: 0, jade: 0 }));
    GameState.persist(true);
    return { ok: true, results: out };
  }
  function pityInfo() {
    const g = GameState.get().gacha;
    return { pity: g.pity, max: G.pityMax, total: g.total, lost: g.lost5050, rate: rate5At(g.pity) };
  }
  return { pull, pityInfo, rate5At };
})();

/* =====================================================================
 * STAGE SYSTEM — 스테이지 진행 / 보상
 * ===================================================================== */
const StageSystem = (() => {
  let currentStage = null;

  function enter(stageId) {
    const stage = DB.STAGE_MAP[stageId];
    if (!stage) return;
    if (!GameState.stageUnlocked(stageId)) { UI.toast('이전 임무를 먼저 클리어하세요', 'bad'); return; }
    if (!GameState.party().length) { UI.toast('부대를 편성해 주세요', 'bad'); UI.nav('party'); return; }
    currentStage = stage;
    // 스토리 선재생
    const st = DB.STORY.find(s => s.stage === stageId);
    const seen = GameState.get().flags.story;
    if (st && !seen[st.id]) { UI.playStory(st.id, () => beginBattle(stageId)); return; }
    beginBattle(stageId);
  }
  function beginBattle(stageId) {
    const stage = DB.STAGE_MAP[stageId];
    UI.nav('battle', { noHistory: false });
    BattleUI.reset();
    FX.init(); FX.clear();
    const isTut = stage.tutorial && !GameState.get().flags.tutorialDone;
    const ok = BattleSystem.start(stageId, {
      tutorial: isTut,
      onEvent: name => { if (isTut) Tutorial.onEvent(name); },
      onEnd: (win, b) => finish(win, b, stageId),
    });
    if (!ok) { UI.nav('stage'); return; }
    if (isTut) Tutorial.begin();
  }
  function rewardsFor(stage, first) {
    const m = first ? 1 : 0.4;
    return {
      exp: Math.round(stage.rew.exp * m),
      gold: Math.round(stage.rew.gold * m),
      jade: first ? stage.rew.jade : Math.round(stage.rew.jade * 0.15),
      mat: Math.max(1, Math.round(stage.rew.mat * m)),
    };
  }
  function finish(win, b, stageId) {
    const stage = DB.STAGE_MAP[stageId];
    let rew = null, levelUps = [];
    if (win) {
      const first = !GameState.stageCleared(stageId);
      rew = rewardsFor(stage, first);
      GameState.give({ gold: rew.gold, jade: rew.jade, mat: rew.mat, exp: rew.exp });
      // 파티 캐릭터 경험치
      const party = GameState.party();
      const each = Math.round(rew.exp * 0.6 / Math.max(1, party.length));
      party.forEach(id => {
        const before = GameState.charState(id).lv;
        CharacterSystem.addExp(id, each);
        const after = GameState.charState(id).lv;
        if (after > before) levelUps.push({ id, from: before, to: after });
      });
      GameState.clearStage(stageId);
      rew.first = first;
    }
    GameState.persist(true);
    UI.showBattleResult(win, rew, levelUps, stageId);
  }
  function nextStageId(stageId) {
    const i = DB.STAGES.findIndex(s => s.id === stageId);
    return (i >= 0 && i + 1 < DB.STAGES.length) ? DB.STAGES[i + 1].id : null;
  }
  return { enter, beginBattle, finish, nextStageId, rewardsFor, current: () => currentStage };
})();

/* =====================================================================
 * TUTORIAL
 * ===================================================================== */
const Tutorial = (() => {
  let step = 0, active = false, shown = {};
  const STEPS = {
    intro: { t: '전투 개시', d: '속도가 빠른 순서대로 행동합니다. 화면 왼쪽의 <b>행동 순서</b>를 확인하세요.' },
    attack: { t: '① 공격', d: '<b>공격</b>은 주력(SP)을 1 회복하고 필살기 게이지를 채웁니다. 가장 기본이 되는 행동입니다.', sel: '#cmd-atk' },
    skill: { t: '② 스킬', d: '<b>스킬</b>은 주력(SP)을 소모해 강력한 효과를 냅니다. 파티 전체가 SP를 공유하니 배분이 중요합니다.', sel: '#cmd-skill' },
    guard: { t: '③ 방어', d: '<b>방어</b>는 받는 피해를 크게 줄이고 SP를 1 회복합니다. 보스의 큰 기술 직전에 사용하세요.', sel: '#cmd-guard' },
    ult: { t: '④ 필살기', d: '게이지가 100%가 되면 <b>필살기</b>를 사용할 수 있습니다. 컷인 연출과 함께 강력한 일격을 날립니다.', sel: '#cmd-ult' },
    brk: { t: '⑤ 브레이크', d: '적의 노란 <b>BREAK 게이지</b>를 모두 깎으면 적은 행동 불가가 되고 받는 피해가 35% 증가합니다. 큰 기술은 브레이크 이후에!' },
    win: { t: '⑥ 승리 보상', d: '승리하면 경험치·골드·회주를 얻습니다. 회주로 새로운 주술사를 소환할 수 있습니다.' },
  };
  let queue = [], visible = false;
  function begin() { active = true; step = 0; shown = {}; queue = []; visible = false; show('intro'); }
  function markDone() {
    const f = GameState.get().flags;
    if (!f.tutorialDone) { f.tutorialDone = true; GameState.persist(true); }
  }
  function done() { active = false; queue = []; markDone(); hide(); }
  function skip() { done(); UI.toast('튜토리얼을 건너뛰었습니다'); }
  function hide() {
    const w = $('#tutorial'); if (w) { w.classList.remove('on'); w.innerHTML = ''; }
    visible = false;
    if (queue.length) { const k = queue.shift(); setTimeout(() => render(k), 160); }
  }
  /** 이미 표시 중이면 큐에 쌓아 순서대로 보여준다 */
  function show(key) {
    if (!active) return;
    const s = STEPS[key]; if (!s || shown[key]) return;
    shown[key] = true;
    if (visible) { queue.push(key); return; }
    render(key);
  }
  function render(key) {
    const s = STEPS[key]; if (!s) return;
    const w = $('#tutorial'); if (!w) return;
    visible = true;
    let holeHtml = '';
    if (s.sel) {
      const t = $(s.sel);
      if (t) {
        const r = t.getBoundingClientRect();
        const br = $('#battle-root').getBoundingClientRect();
        holeHtml = '<div class="tut-hole" style="left:' + (r.left - br.left - 4) + 'px;top:' + (r.top - br.top - 4) +
          'px;width:' + (r.width + 8) + 'px;height:' + (r.height + 8) + 'px"></div>';
      }
    }
    const topPos = s.sel ? 'top:12%' : 'top:32%';
    w.innerHTML = (holeHtml ? holeHtml : '<div class="tut-mask"></div>') +
      '<div class="tut-box" style="' + topPos + '">' +
      '<div class="tb-t">' + s.t + '</div><div class="tb-d">' + s.d + '</div>' +
      '<div class="tb-a"><button class="btn sm ghost" id="tut-skip">튜토리얼 스킵</button>' +
      '<button class="btn sm primary" id="tut-ok">확인</button></div></div>';
    w.classList.add('on');
    onTap($('#tut-ok'), () => { AudioSystem.sfx('click'); hide(); });
    onTap($('#tut-skip'), () => { AudioSystem.sfx('back'); skip(); });
  }
  function onEvent(name) {
    if (!active) return;
    if (name === 'playerTurn') {
      step++;
      if (step === 1) show('attack');
      else if (step === 2) show('skill');
      else if (step === 3) show('guard');
      else {
        const b = BattleSystem.get();
        const ready = b && b.allies.some(a => BattleSystem.ultReady(a));
        if (ready || step >= 5) show('ult');
      }
    } else if (name === 'break') show('brk');
    else if (name === 'victory') { show('win'); active = true; markDone(); }
    else if (name === 'defeat') done();
  }
  return { begin, onEvent, skip, done, isActive: () => active };
})();

/* =====================================================================
 * UI SYSTEM
 * ===================================================================== */
const UI = (() => {
  let current = 'title';
  let detailId = null, detailFrom = 'chars';
  let charFilter = 'all', partyFilter = 'all';
  let partyPending = null;          // 교체 대기 캐릭터 id
  let story = null;                 // {scene, idx, onDone}

  /* ---------- 공통 ---------- */
  function toast(msg, kind) {
    const wrap = $('#toast-wrap'); if (!wrap) return;
    const t = Util.el('div', 'toast' + (kind ? ' ' + kind : ''), esc(msg));
    wrap.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; }, 1700);
    setTimeout(() => { if (t.parentNode) t.parentNode.removeChild(t); }, 2100);
  }
  function modal(opt) {
    const m = $('#modal'); if (!m) return;
    const acts = (opt.actions || [{ label: '확인' }]).map((a, i) =>
      '<button class="btn ' + (a.cls || '') + '" data-i="' + i + '">' + esc(a.label) + '</button>').join('');
    m.innerHTML = '<div class="modal-box"><div class="mb-t">' + esc(opt.title || '') + '</div>' +
      '<div class="mb-d">' + (opt.html || esc(opt.desc || '')) + '</div><div class="mb-a">' + acts + '</div></div>';
    m.classList.add('on');
    $$('.mb-a button', m).forEach(btn => onTap(btn, () => {
      const a = (opt.actions || [])[parseInt(btn.dataset.i, 10)];
      AudioSystem.sfx('click');
      m.classList.remove('on'); m.innerHTML = '';
      if (a && a.fn) Util.safe(a.fn, 'modal-action');
    }));
  }
  const closeModal = () => { const m = $('#modal'); if (m) { m.classList.remove('on'); m.innerHTML = ''; } };

  function currencyHtml() {
    const c = GameState.cur();
    return '<span class="cur jade"><span class="ic">🔷</span>' + fmt(c.jade) + '</span>' +
      '<span class="cur gold"><span class="ic">🪙</span>' + fmt(c.gold) + '</span>' +
      '<span class="cur shard"><span class="ic">📘</span>' + fmt(c.exp) + '</span>';
  }
  function refreshCurrency() {
    ['home-cur', 'stage-cur', 'gacha-cur', 'shop-cur', 'detail-cur'].forEach(id => {
      const e = document.getElementById(id); if (e) e.innerHTML = currencyHtml();
    });
  }

  /* ---------- 레이아웃 판정 ---------- */
  function updateLayout() {
    const app = $('#app'); if (!app) return;
    const w = window.innerWidth, h = window.innerHeight;
    const mn = Math.min(w, h), landscape = w > h;
    const coarse = Util.safe(() => window.matchMedia('(pointer:coarse)').matches, 'mq', false);
    let mode;
    if (mn >= 700) mode = landscape ? 'tl' : 'tp';          // 태블릿
    else if (!coarse && w >= 900) mode = 'd';               // 데스크톱
    else mode = landscape ? 'l' : 'p';                       // 모바일
    if (!coarse && w >= 1100 && h >= 700) mode = 'd';
    app.dataset.layout = mode;
    document.documentElement.style.setProperty('--vh', h + 'px');
  }
  function applySettings() {
    const s = GameState.settings();
    document.documentElement.style.setProperty('--fs', s.fontScale);
    document.body.classList.toggle('q-low', s.quality === 'low');
    document.body.classList.toggle('q-mid', s.quality === 'mid');
    document.body.classList.toggle('reduce-motion', !!s.reduceMotion);
    document.body.classList.toggle('high-contrast', !!s.highContrast);
    AudioSystem.applySettings();
  }

  /* ---------- 내비게이션 ---------- */
  const RENDER = {};
  function apply(id) {
    const target = $('#screen-' + id);
    if (!target) return;
    if (current === 'battle' && id !== 'battle') { BattleUI.reset(); FX.clear(); }
    $$('.screen').forEach(s => { s.classList.remove('active'); s.classList.remove('fade-in'); });
    target.classList.add('active'); target.classList.add('fade-in');
    current = id;
    Util.safe(() => { if (RENDER[id]) RENDER[id](); }, 'render:' + id);
    refreshCurrency();
  }
  function nav(id, opt) {
    opt = opt || {};
    if (id === current) { Util.safe(() => RENDER[id] && RENDER[id](), 'render'); return; }
    apply(id);
    Util.safe(() => history.pushState({ screen: id }, ''), 'history');
  }
  function back() {
    if (current === 'battle') { battleMenu(); return; }
    Util.safe(() => history.back(), 'back');
  }
  function initHistory() {
    Util.safe(() => history.replaceState({ screen: 'title' }, ''), 'history-init');
    window.addEventListener('popstate', e => {
      const scr = (e.state && e.state.screen) || 'home';
      if (current === 'battle') {
        // 전투 중 뒤로가기 → 게임이 꼬이지 않도록 메뉴만 표시
        Util.safe(() => history.pushState({ screen: 'battle' }, ''), 'history');
        battleMenu();
        return;
      }
      if (current === 'story' && story) { return; }
      apply($('#screen-' + scr) ? scr : 'home');
    });
  }

  /* ---------- 캐릭터 카드 ---------- */
  function charCard(id, opt) {
    opt = opt || {};
    const def = DB.byId(id); if (!def) return '';
    const cs = GameState.charState(id);
    const owned = !!cs;
    const el = DB.ELEMENTS[def.el] || {};
    const st = owned ? CharacterSystem.stats(id, cs) : null;
    return '<button class="char-card rar-' + def.rarity + (owned ? '' : ' locked') + (opt.sel ? ' sel' : '') +
      '" data-id="' + id + '">' +
      '<span class="cc-port"><span class="portrait">' + Art.portrait(def) + '</span>' +
      '<span class="cc-rar">' + def.rarity + '★</span>' +
      (owned ? '<span class="cc-lv">Lv.' + st.lv + '</span>' : '') +
      (owned && cs.asc > 0 ? '<span class="cc-asc">+' + cs.asc + '</span>' : '') +
      '<span class="cc-el" style="color:' + (el.color || '#fff') + '">' + (el.icon || '') + '</span></span>' +
      '<span class="cc-meta"><span class="cc-name">' + esc(def.name) + '</span>' +
      '<span class="cc-ver">' + esc(def.version) + '</span>' +
      '<span class="cc-role">' + ((DB.ROLES[def.role] || {}).name || '') + ' · ' + (el.name || '') + '</span></span></button>';
  }
  function bindCards(rootSel, fn) {
    $$(rootSel + ' .char-card').forEach(c => onTap(c, () => { AudioSystem.sfx('click'); fn(c.dataset.id, c); }));
  }
  const FILTERS = [
    { id: 'all', label: '전체' }, { id: 'owned', label: '보유' }, { id: 'lock', label: '미보유' },
    { id: 'r5', label: '5★' }, { id: 'r4', label: '4★' }, { id: 'r3', label: '3★' },
    { id: 'dps', label: '딜러' }, { id: 'brk', label: '브레이커' }, { id: 'tank', label: '탱커' },
    { id: 'sup', label: '서포터' }, { id: 'deb', label: '디버퍼' },
  ];
  function filterChars(f, onlyOwned) {
    let list = DB.CHARS.slice();
    if (onlyOwned) list = list.filter(c => GameState.owns(c.id));
    if (f === 'owned') list = list.filter(c => GameState.owns(c.id));
    else if (f === 'lock') list = list.filter(c => !GameState.owns(c.id));
    else if (f === 'r5') list = list.filter(c => c.rarity === 5);
    else if (f === 'r4') list = list.filter(c => c.rarity === 4);
    else if (f === 'r3') list = list.filter(c => c.rarity === 3);
    else if (DB.ROLES[f]) list = list.filter(c => c.role === f);
