# PREPARED, NOT ACTIVE. Render reads only the repository-root render.yaml.
# To deploy the GRID account server, move these entries into ../render.yaml
# (after approval): Render then creates a PostgreSQL database and a Node web
# service that serves the game and /api on one origin. The existing static
# site `tactical-fps` can stay as the offline-only build or be retired.
# See docs/grid-account-server.md §8 (운영).

databases:
  - name: grid-accounts
    databaseName: grid
    user: grid
    # Free Render databases expire after 30 days and have no backups: use a paid plan for real accounts.
    plan: basic-256mb
    postgresMajorVersion: "16"
    ipAllowList: [] # internal connections only

services:
  - type: web
    name: tactical-fps-online
    runtime: node
    plan: starter
    rootDir: tactical-fps
    # NODE_ENV=production also applies to the build: keep the dev dependencies (vite, typescript) for it.
    buildCommand: npm ci --include=dev && npm run build && npm run build:server
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: grid-accounts
          property: connectionString
      - key: GRID_MISSION_TZ
        value: Asia/Seoul
      # Defaults in production: Secure cookies, client IP from Render's proxy (X-Forwarded-For), 7-day sessions.
      - key: GRID_COOKIE_SECURE
        value: "true"
      - key: GRID_TRUST_PROXY
        value: "true"
